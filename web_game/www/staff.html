    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05070a;
            --card: #0d1117;
            --accent: #3b82f6;
            --gold: #c5a059;
            --success: #00ff88;
            --danger: #ff3366;
            --warning: #ffcc00;
            --text: #ffffff;
            --dim: #8b949e;
            --border: #1e293b;
        }
        html[data-theme="light"] {
            --bg: #f4f5f9;
            --card: #f4f5f9;
            --accent: #2563eb;
            --gold: #8a6b28;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #a16207;
            --text: #151a24;
            --dim: #6b7385;
            --border: #e2e5ec;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 10px; }

        /* ===== الهيدر ===== */
        .header-pro {
            background: linear-gradient(145deg, #0f172a, #020617);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;

            position: sticky;

            z-index: 100;

        .stat-item { text-align: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 40px; }

        /* ===== لوحة التحكم ===== */

        }

        .dash-card {
            background: linear-gradient(160deg, var(--card), rgba(255,255,255,0.015));
            border-radius: 14px;

            border: 1px solid var(--border);
        }
        .dash-card h4 {
            font-size: 0.72rem;
            color: var(--gold);
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .dept-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .dept-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            padding: 9px 12px;
            border-radius: 9px;
            font-size: 0.76rem;
        }
        .dept-item .num { font-weight: 800; color: var(--gold); font-size: 0.85rem; }

        .event-list { font-size: 0.78rem; line-height: 2.2; }
        .event-list .event { display: flex; gap: 9px; align-items: center; }
        .event-list .event .icon { color: var(--gold); width: 18px; text-align: center; }

        .alert-badge {

            color: #fff;
            border-radius: 50%;
            padding: 0 6px;
            font-size: 0.55rem;
            font-weight: bold;

        }

        /* ===== الفلاتر ===== */
        .filters-bar {

            gap: 8px;
            flex-wrap: wrap;
            padding: 10px 0;
            align-items: center;
        }
        .filters-bar input, .filters-bar select {

            padding: 8px 12px;

        .filters-bar input::placeholder { color: var(--dim); }
        .dept-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;

        .dept-tab {

            background: transparent;
            color: var(--dim);

        /* ===== قائمة الموظفين ===== */
        .staff-grid {

            margin-top: 10px;
        }
        .staff-card {

            .staff-grid { grid-template-columns: 1fr; }
            .btn-group { grid-template-columns: 1fr; }
            .dept-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<script>
    /* ============================================================
       نظام الطاقم المتكامل - Staff System v2.0
       ============================================================ */

    // ===== الدوال الأساسية =====
    function getClubName() { return localStorage.getItem('presidentialClub') || 'نادي الهلال'; }

    // ===== تحميل CSV =====
    function parseCSV(text) {
        const rows = [];
        let row = [], field = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i], next = text[i+1];
            if (inQuotes) {
                if (c === '"' && next === '"') { field += '"'; i++; }
                else if (c === '"') inQuotes = false;
                else field += c;
            } else {
                if (c === '"') inQuotes = true;
                else if (c === ',') { row.push(field); field = ''; }
                else if (c === '\r') { /* ignore */ }
                else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
                else field += c;
            }
        }
        if (field.length || row.length) { row.push(field); rows.push(row); }
        if (!rows.length) return [];
        const headers = rows[0];
        const out = [];
        for (let i = 1; i < rows.length; i++) {
            if (rows[i].length === 1 && rows[i][0] === '') continue;
            const obj = {};
            headers.forEach((h, idx) => obj[h] = rows[i][idx] !== undefined ? rows[i][idx] : '');
            out.push(obj);
        }
        return out;
    }

    // ===== معادلات التقييم حسب الوظيفة =====
    function calculateOverall(staff) {
        const s = staff;
        const role = s.role || 'admin';

        const formulas = {
            // 👔 المدربون
            'head_coach': {
                skills: ['man_management', 'tactical', 'motivation', 'judgement_ability', 'youth_development'],
                weights: [0.30, 0.30, 0.20, 0.10, 0.10]
            },
            'assistant': {
                skills: ['man_management', 'performance_analysis', 'judgement_ability', 'youth_development', 'motivation'],
                weights: [0.25, 0.25, 0.20, 0.20, 0.10]
            },
            'gk_coach': {
                skills: ['gk_coaching', 'gk_shot_stopping', 'gk_distribution', 'man_management', 'youth_development'],

            }
        };

        // الدور الافتراضي
        const f = formulas[role] || formulas['admin'];
        let total = 0;
        let weightSum = 0;

        f.skills.forEach((skill, i) => {
            const val = s[skill] !== undefined ? parseInt(s[skill]) : 50;
            const w = f.weights[i] || 0;
            total += val * w;
            weightSum += w;
        });

        return weightSum > 0 ? Math.min(99, Math.max(20, Math.round(total / weightSum))) : 50;

    // بعض الملفات تحوي عمود is_real_person حقيقياً موثوقاً — نعتمد عليه حصرياً هناك.
    // الملفات التي لا تحويه (تحققنا فعلياً: حتى مستوى السمعة لا يميّز الأسماء الحقيقية عن الحشو فيها)
    // نُطبِّق عليها حداً أقصى واقعياً لعدد الموظفين الفعلي في هذا الدور بأي نادٍ حقيقي، ونختار الأعلى سمعة/دقة فقط
    const REAL_STAFF_SOURCES = [

    function clampSkill(v, fallback) { const n = parseFloat(v); return isNaN(n) ? fallback : Math.max(20, Math.min(99, Math.round(n))); }
    function seedVariance(seedStr, base, spread) {
        let h=0; const s=String(seedStr); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
        return Math.max(20, Math.min(99, Math.round(base + ((h%100)/100 - 0.5) * spread)));
    }
    function baseStaffShape(over) {
        return { morale: 70, is_active: true, contract_start:'2024-07-01', contract_end:'2027-06-30', contract_end_ts: new Date('2027-06-30').getTime(),

    function mapCoachRow(role) {
        return (r, i) => {
            const rep20 = parseFloat(r.reputation_1_20) || 10;
            const base = 35 + (rep20/20) * 55; // تحويل واقعي من سلم 1-20 إلى 35-90
            const age = r.dob ? Math.max(28, new Date().getFullYear() - new Date(r.dob).getFullYear()) : 45;
            return baseStaffShape({
                id: `${role}_${i}`, name: r.name, nationality: r.nationality, department: 'sporting_director', role,
                age, experience_years: Math.max(1, age - 28),
                tactical: seedVariance(r.name+'t', base, 20), man_management: seedVariance(r.name+'m', base, 20),
                motivation: seedVariance(r.name+'o', base, 20), judgement_ability: seedVariance(r.name+'j', base, 20),
                youth_development: seedVariance(r.name+'y', base, 20), performance_analysis: seedVariance(r.name+'p', base, 20),
                formation: r.preferred_formation || '4-3-3', tacticalStyleRaw: r.tactical_style || '',
                salary: Math.round((parseFloat(r.salary_eur_annual)||1000000)/12),

                    matches = matches.filter(r => (r.is_real_person || '').trim().toLowerCase() === 'true');
                } else if (src.cap) {
                    // لا يوجد علم موثوقية في هذا المصدر تحديداً — نحدّ العدد لحجم واقعي فعلي لهذا الدور بأي نادٍ حقيقي،
                    // ونختار الأعلى تقييماً كأفضل تقريب متاح (وليس استيراد كل الصفوف كما كان يحدث سابقاً)
                    matches = matches.slice().sort((a,b) => (parseFloat(b[src.rankKey])||0) - (parseFloat(a[src.rankKey])||0)).slice(0, src.cap);
                }
                return matches.map((r, i) => ({ ...src.mapper(r, `${src.file}_${i}`), isVerified: !!src.hasRealFlag }));
            } catch (e) { console.warn('تعذر تحميل', src.file, e); return []; }
        }));
        let combined = [].concat(...results);
        // ضمان مدرب رئيسي واحد فقط فعلياً (خلل بيانات محتمل إن تكرر لسبب ما) — الباقي يُصنَّف مساعداً
        let headTaken = false;
        combined.forEach(s => {
            if (s.role === 'head_coach') { if (headTaken) s.role = 'assistant'; else headTaken = true; }
            s.overall = s.overallOverride || calculateOverall(s);
            if (!s.salary) s.salary = Math.round(300 * Math.pow(1.06, s.overall));
            delete s.overallOverride;
        });
        return combined;
    }

    function loadStaff(forceReload) {
        const stored = getStaffData();
        let clubStaff = stored[getClubName()];
        // شفاء تلقائي حقيقي لأي بيانات محفوظة سابقاً من نسخة معطوبة (عدد موظفين غير واقعي بسبب الخلل السابق) —
        // نادٍ حقيقي واحد لا يملك عشرات "المدربين"، فأي تخزين متضخم كهذا نعتبره فاسداً ونعيد تحميله فعلياً
        const looksCorrupted = clubStaff && clubStaff.length > 20;
        if (clubStaff && clubStaff.length && !forceReload && !looksCorrupted) {
            staffData = clubStaff;
            renderAll();
            return;
        }
        // أول دخول لهذا النادي (أو إعادة تحميل صريحة، أو شفاء بيانات فاسدة): حمّل طاقمه الفني الحقيقي الفعلي من جديد
        loadRealClubStaff().then(realStaff => {
            staffData = realStaff;
            if (looksCorrupted) showToast(`<i class="fas fa-wrench"></i> تم تصحيح بيانات الطاقم المخزَّنة سابقاً وإعادة تحميلها بدقة حقيقية (${realStaff.length})`);
            else if (realStaff.length) showToast(`<i class="fas fa-circle-check"></i> تم تحميل الطاقم الفني الحقيقي لـ${getClubName()} (${realStaff.length})`);
            saveToStorage();
            renderAll();
        });
    }

    function saveToStorage() {
        const all = getStaffData();
        all[getClubName()] = staffData;
        localStorage.setItem('staff_by_club', JSON.stringify(all));
    }


    // ===== عرض البيانات =====
    function renderAll() {
        updateDashboard();
        applyFilters();
        exportCoachingQuality();
        try { localStorage.setItem('academyQualityFactor_' + getClubName(), String(window.getAcademyEffect().quality)); } catch(e) {}
    }

    function updateDashboard() {
        document.getElementById('clubNameDisplay').innerText = getClubName();
        document.getElementById('countDisplay').innerText = staffData.length;

        const totalSalary = staffData.reduce((s, p) => s + (p.salary || 0), 0);
        document.getElementById('budgetDisplay').innerText = '€' + fmtMoney(totalSalary);

        const avgOverall = staffData.length ? Math.round(staffData.reduce((s, p) => s + (p.overall || 50), 0) / staffData.length) : 0;
        document.getElementById('avgOverall').innerText = avgOverall;

        const avgMorale = staffData.length ? Math.round(staffData.reduce((s, p) => s + (p.morale || 50), 0) / staffData.length) : 0;
        document.getElementById('avgMorale').innerText = avgMorale + '%';

        // الأقسام
        const deptMap = {
            'sporting_director': 'coaches',
            'medical': 'medical',
            'scouting': 'scouting',
            'academy': 'academy',
            'administration': 'admin',
            'analyst': 'analyst',
            'fitness': 'fitness'
        };
        const counts = {};
        staffData.forEach(s => {
            const key = deptMap[s.department] || 'admin';
            counts[key] = (counts[key] || 0) + 1;
        });
        Object.keys(deptMap).forEach(d => {
            const key = deptMap[d];
            document.getElementById('dept-' + key).innerText = counts[key] || 0;
        });

        // الأحداث
        const events = generateEvents();
        document.getElementById('eventsList').innerHTML = events.map(e =>
            `<div class="event"><span class="icon"><i class="fas ${e.icon}"></i></span> ${e.text}</div>`
        ).join('');

        // التنبيهات
        const alerts = generateAlerts();
        const container = document.getElementById('alertsContainer');
        if (alerts.length) {
            container.innerHTML = alerts.map(a =>
                `<div class="alert-box"><i class="fas fa-triangle-exclamation"></i> ${a}</div>`
            ).join('');
        } else {
            container.innerHTML = '';
        }
    }

    function generateEvents() {
        const events = [];
        // أحداث عشوائية حسب الطاقم
        const doctors = staffData.filter(s => s.role === 'doctor' || s.role === 'physio');
        if (doctors.length && Math.random() > 0.5) {
            events.push({ icon: 'fa-kit-medical', text: 'الطبيب أنهى علاج لاعب' });
        }
        const scouts = staffData.filter(s => s.role === 'scout' || s.role === 'chief_scout');
        if (scouts.length && Math.random() > 0.6) {
            events.push({ icon: 'fa-binoculars', text: 'الكشاف وجد موهبة جديدة' });
        }
        const analysts = staffData.filter(s => s.role === 'analyst' || s.role === 'head_analyst');
        if (analysts.length && Math.random() > 0.5) {
            events.push({ icon: 'fa-chart-line', text: 'المحلل جهز تقرير الخصم' });
        }
        const assistants = staffData.filter(s => s.role === 'assistant');
        if (assistants.length && Math.random() > 0.6) {
            events.push({ icon: 'fa-dumbbell', text: 'مساعد المدرب رفع معنويات الفريق' });
        }
        if (events.length === 0) {
            events.push({ icon: 'fa-clipboard-check', text: 'جميع الأقسام تعمل بكفاءة' });
        }
        return events;
    }

    function generateAlerts() {
        const alerts = [];
        const now = Date.now();
        staffData.forEach(s => {
            const remaining = (s.contract_end_ts - now) / (30 * 24 * 3600 * 1000);
            if (remaining < 4 && remaining > 0) {
                alerts.push(`ينتهي عقد ${s.name} خلال ${Math.round(remaining)} أشهر`);
            }
            if (s.morale < 30) {
                alerts.push(`${s.name} غير راضٍ وقد يطلب الرحيل`);
            }
            if (s.salary && s.salary < 3000 && s.overall > 75) {
                alerts.push(`${s.name} يستحق زيادة في الراتب`);
            }
        });
        // اكتشاف موهبة عشوائي
        if (Math.random() > 0.7) {
            const names = ['سالم العتيبي', 'فيصل الحربي', 'عبدالله الشمري'];
            alerts.push(`تم اكتشاف موهبة جديدة: ${names[Math.floor(Math.random()*names.length)]}`);
        }
        return alerts.slice(0, 5);
    }

    function fmtMoney(v) {
        v = Math.round(v || 0);
        if (v >= 1e6) return (v / 1e6).toFixed(v % 1e6 === 0 ? 0 : 1).replace(/\.0$/, '') + 'M';
        if (v >= 1e3) return Math.round(v / 1e3) + 'k';
        return v;
    }

    // ===== الفلاتر =====
    function setDeptFilter(dept) {
        currentDept = dept;
        document.querySelectorAll('.dept-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.dept === dept);
        });
        applyFilters();
    }

    function applyFilters() {
        const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();

        filteredStaff = staffData.filter(s => {
            if (q && !s.name.toLowerCase().includes(q)) return false;
            if (currentDept !== 'all' && s.department !== currentDept) return false;
            return true;
        });

        // ترتيب واقعي حسب الأهمية الفعلية في الهيكل الإداري/الفني (وليس ترتيب عشوائي أو حسب تاريخ التعاقد)
        filteredStaff.sort((a, b) => roleImportance(b.role) - roleImportance(a.role) || b.overall - a.overall);

        renderStaffList();
    }

    // ===== عرض القائمة =====
    function renderStaffList() {
        const grid = document.getElementById('staffGrid');
        if (!staffData.length) {
            grid.innerHTML = `<div class="empty-box"><i class="fas fa-building" style="font-size:1.6rem; color:var(--dim); margin-bottom:8px; display:block;"></i>لا يوجد أي موظف في طاقمك الفني والإداري حالياً.<br><span style="font-size:11px;opacity:0.75;">توجّه إلى سوق الانتقالات للتعاقد مع مدربين وموظفين حقيقيين — لن تظهروا هنا إلا بعد التعاقد الفعلي معهم.</span><br><a href="transfers.html" style="display:inline-block;margin-top:10px;background:var(--accent);padding:8px 20px;border-radius:8px;color:#000;font-weight:bold;text-decoration:none;">الذهاب لسوق الانتقالات</a></div>`;
            return;
        }
        if (!filteredStaff.length) {
            grid.innerHTML = `<div class="empty-box">لا يوجد موظف يطابق البحث.</div>`;
            return;
        }

        grid.innerHTML = filteredStaff.map((s, idx) => {
            const realIdx = staffData.indexOf(s);
            const remaining = (s.contract_end_ts - Date.now()) / (365.25 * 24 * 3600 * 1000);
            const pct = Math.min(100, Math.max(0, (remaining / 3) * 100));
            const barClass = remaining > 1.5 ? 'good' : remaining > 0.5 ? 'warn' : 'danger';
            const overallClass = s.overall >= 80 ? 'high' : s.overall >= 65 ? 'mid' : 'low';
            const isFeatured = idx === 0 && filteredStaff.length > 1;
            const roleIcon = getRoleIcon(s.role);

            return `
                <div class="staff-card ${isFeatured ? 'featured' : ''}" onclick="openModal(${realIdx})">
                    <div class="top">
                        <div class="avatar-role ${getRoleBadge(s.role)}"><i class="fas ${roleIcon}"></i></div>
                        <div style="flex:1; min-width:0;">
                            <div class="name">${s.name}</div>
                            <div style="display:flex; align-items:center; gap:6px; margin-top:2px; flex-wrap:wrap;">
                                <span class="badge-role ${getRoleBadge(s.role)}">${getRoleLabel(s.role)}</span>
                                <span style="font-size:0.55rem;color:var(--dim);">${getDeptLabel(s.department)}</span>
                                ${s.isVerified === false ? '<span style="font-size:0.5rem; color:var(--warning); border:1px solid var(--warning); border-radius:8px; padding:1px 6px;" title="بيانات هذا الموظف (الجنسية والراتب) تقديرية غير موثَّقة بدقة كاملة من المصدر"><i class="fas fa-triangle-exclamation"></i> غير موثَّق</span>' : ''}
                            </div>
                        </div>
                        <div class="overall ${overallClass}">${s.overall}</div>
                    </div>
                    <div class="meta">
                        <span>${flagEmoji(s.nationality)} ${s.nationality||'--'}</span>
                        <span><i class="fas fa-briefcase"></i> ${s.experience_years} سنة خبرة</span>
                        <span><i class="fas fa-sack-dollar"></i> ${fmtMoney(s.salary)}€</span>
                    </div>
                    <div class="contract-bar">
                        <div class="fill ${barClass}" style="width:${pct}%;"></div>
                    </div>
                    <div style="font-size:0.55rem;color:var(--dim);margin-top:4px;display:flex;justify-content:space-between;">
                        <span>${s.contract_start}</span>
                        <span>${s.contract_end}</span>
                    </div>
                </div>
            `;
        }).join('') + (filteredStaff.length > 1 ? `<div class="hierarchy-note">مرتَّبون حسب السلطة الفعلية في الهيكل الفني والإداري — الأعلى منصباً أولاً</div>` : '');
    }

        // المهارات
        renderStaffSkills(s);

        document.getElementById('staffContract').innerHTML = `

                <div class="stat-row"><span><i class="fas fa-binoculars"></i> لاعبون مكتشفون</span><b>${stats.players_discovered || 0}</b></div>
                <div class="stat-row"><span>⭐ نجوم مكتشفون</span><b>${stats.stars_discovered || 0}</b></div>
                <div class="stat-row"><span><i class="fas fa-sack-dollar"></i> قيمة المكتشفين</span><b>${fmtMoney(stats.discovered_market_value || 0)}€</b></div>
            ` : ''}
            ${s.role === 'analyst' || s.role === 'head_analyst' ? `
                <div class="stat-row"><span><i class="fas fa-file-lines"></i> تقارير سلمت</span><b>${stats.reports_delivered || 0}</b></div>
                <div class="stat-row"><span><i class="fas fa-bullseye"></i> دقة التقارير</span><b>${stats.report_accuracy || 0}%</b></div>
                <div class="stat-row"><span><i class="fas fa-trophy"></i> أفضل مباراة</span><b>${stats.best_match || '--'}</b></div>
            ` : ''}
        `;

        switchTab('info');
        document.getElementById('staffModal').style.display = 'flex';
    }

    function renderStaffSkills(s) {
        const skills = getRelevantSkills(s.role);
        const container = document.getElementById('staffSkills');

        if (!skills.length) {
            container.innerHTML = '<div style="color:var(--dim);text-align:center;">لا توجد مهارات معروضة لهذا الدور</div>';
            return;
        }

        container.innerHTML = skills.map(skill => {
            const val = s[skill] !== undefined ? parseInt(s[skill]) : 50;
            const label = SKILL_LABELS[skill] || skill.replace('_', ' ');
            const colorClass = val >= 80 ? 'high' : val >= 65 ? 'mid' : 'low';
            return `
                <div class="skill-row">
                    <span class="label">${label}</span>
                    <div class="bar">
                        <div class="fill ${colorClass}" style="width:${val}%;"></div>
                    </div>
                    <span class="val">${val}</span>
                </div>
            `;
        }).join('');
    }

    // ===== دوال العقد =====
    function renewContract() {
        if (activeIndex === null) return;
        const s = staffData[activeIndex];
        const now = new Date();
        now.setFullYear(now.getFullYear() + 2);
        s.contract_end = now.toISOString().split('T')[0];
        s.contract_end_ts = now.getTime();
        s.morale = Math.min(100, s.morale + 8);
        saveToStorage();
        loadStaff(true);
        closeModal();
        showToast(`<i class="fas fa-circle-check"></i> تم تمديد عقد ${s.name} حتى ${s.contract_end}`);
    }

    function buyoutContract() {
        if (activeIndex === null) return;
        const s = staffData[activeIndex];
        const cost = s.salary * 6;
        if (!confirm(`شراء عقد ${s.name} بتكلفة ${fmtMoney(cost)}€؟`)) return;
        // محاكاة دفع
        showToast(`<i class="fas fa-sack-dollar"></i> تم شراء عقد ${s.name} بمبلغ ${fmtMoney(cost)}€`);
        s.contract_end_ts = Date.now() + 30 * 24 * 3600 * 1000;
        saveToStorage();
        loadStaff(true);
        closeModal();
    }

    function fireStaff() {
        if (activeIndex === null) return;
        const s = staffData[activeIndex];
        if (!confirm(`إقالة ${s.name}؟ هذا الإجراء نهائي.`)) return;
        s.is_active = false;
        saveToStorage();
        loadStaff(true);
        closeModal();
        showToast(`<i class="fas fa-circle-xmark"></i> تمت إقالة ${s.name}`);
    }

    // ===== دوال مساعدة =====
    function switchTab(t) {
        document.querySelectorAll('.modal-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
        document.querySelectorAll('.modal-section').forEach(s => s.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
    }
        function closeModal() {
        document.getElementById('staffModal').style.display = 'none';
        activeIndex = null;
    }

    function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast-msg';
        t.innerHTML = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // ===== تأثير الطاقم على اللعبة =====
    // دوال يمكن استدعاؤها من صفحات أخرى
    window.getStaffByRole = function(role) {
        return staffData.filter(s => s.role === role && s.is_active !== false);
    };

    window.getStaffByDept = function(dept) {
        return staffData.filter(s => s.department === dept && s.is_active !== false);
    };

    // تأثير الطبيب: سرعة العلاج
    window.getMedicalEffect = function() {
        const doctors = staffData.filter(s => (s.role === 'doctor' || s.role === 'physio') && s.is_active !== false);
        if (!doctors.length) return { speed: 1, accuracy: 0.5, prevention: 0 };
        const avgMedical = doctors.reduce((sum, d) => sum + (d.medical_skill || 50), 0) / doctors.length;
        const avgRecovery = doctors.reduce((sum, d) => sum + (d.recovery_speed || 50), 0) / doctors.length;
        const avgPrevention = doctors.reduce((sum, d) => sum + (d.injury_prevention || 50), 0) / doctors.length;
        return {
            speed: 0.5 + (avgRecovery / 200), // 0.5 إلى 1.0
            accuracy: 0.3 + (avgMedical / 200), // 0.3 إلى 0.8
            prevention: avgPrevention / 100 // 0 إلى 1
        };
    };

    // تأثير المحلل: تحسين التكتيك
    window.getAnalystEffect = function() {
        const analysts = staffData.filter(s => s.role === 'analyst' && s.is_active !== false);
        if (!analysts.length) return { tactical: 0 };
        const avgOpp = analysts.reduce((sum, a) => sum + (a.opposition_analysis || 50), 0) / analysts.length;
        const avgPerf = analysts.reduce((sum, a) => sum + (a.performance_analysis || 50), 0) / analysts.length;
        return {
            tactical: (avgOpp + avgPerf) / 200, // 0 إلى 1
            opposition: avgOpp / 100
        };
    };

    // تأثير الكشاف: اكتشاف المواهب
    window.getScoutEffect = function() {
        const scouts = staffData.filter(s => s.role === 'scout' && s.is_active !== false);
        if (!scouts.length) return { quality: 0.3, range: 0 };
        const avgJudge = scouts.reduce((sum, s) => sum + (s.judgement_ability || 50), 0) / scouts.length;
        const avgRegion = scouts.reduce((sum, s) => sum + (s.regional_knowledge || 50), 0) / scouts.length;
        return {
            quality: 0.2 + (avgJudge / 125), // 0.2 إلى 1.0
            range: avgRegion / 100 // 0 إلى 1
        };
    };

    // تأثير الأكاديمية: جودة الناشئين
    window.getAcademyEffect = function() {
        const academy = staffData.filter(s => s.department === 'academy' && s.is_active !== false);
        if (!academy.length) return { quality: 0.2 };
        const avgYouth = academy.reduce((sum, a) => sum + (a.youth_development || 50), 0) / academy.length;
        const avgJudge = academy.reduce((sum, a) => sum + (a.judgement_ability || 50), 0) / academy.length;
        return {
            quality: 0.15 + ((avgYouth + avgJudge) / 250) // 0.15 إلى 0.95
        };
    };

    // تأثير مساعد المدرب: معنويات وتطور
    window.getAssistantEffect = function() {
        const assistants = staffData.filter(s => s.role === 'assistant' && s.is_active !== false);
        if (!assistants.length) return { morale: 0, development: 0 };
        const avgMan = assistants.reduce((sum, a) => sum + (a.man_management || 50), 0) / assistants.length;
        const avgMot = assistants.reduce((sum, a) => sum + (a.motivation || 50), 0) / assistants.length;
        return {
            morale: (avgMan + avgMot) / 200, // 0 إلى 1
            development: avgMan / 100 // 0 إلى 1
        };
    };

    // ===== التهيئة =====
    window.addEventListener('storage', function(e) {
        if (e.key === 'staff_by_club' || e.key === 'presidentialClub') {
            loadStaff(true);
        }
    });

    loadStaff(false);
</script>
</body>
</html>
