name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'tools/make_assets.py'
      - 'tools/tm_leagues.json.gz'
      - 'tools/fetch_logos.py'
      - 'assets/logos/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Add Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name football_manager --org com.footballmanager --platforms=android /tmp/shell
            cp -r /tmp/shell/android ./android
          fi

      - name: Allow internet access in the manifest
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="مدرب كرة القدم"', s, count=1)
          p.write_text(s, encoding='utf-8')
          EOF

      - name: Bundle league data into the app
        run: python3 tools/make_assets.py

      - name: Fetch competition logos and store them in the repo
        continue-on-error: true
        run: |
          mkdir -p logs
          python3 tools/fetch_logos.py 2>&1 | tee logs/logos.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos
          if ! git diff --cached --quiet; then
            git commit -qm "Add competition logos [skip ci]"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped"
          fi

      - name: Add Arabic font (Tajawal)
        continue-on-error: true
        run: |
          mkdir -p assets/fonts
          ok=1
          for w in Regular Medium Bold ExtraBold Black; do
            curl -fsSL --retry 4 -o assets/fonts/Tajawal-$w.ttf \
              https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-$w.ttf || ok=0
          done
          if [ "$ok" = 1 ]; then python3 tools/add_font.py; else rm -rf assets/fonts; echo "font skipped"; fi

      - run: flutter pub get

      - name: Analyze (log only)
        shell: bash
        run: |
          mkdir -p logs
          flutter analyze --no-pub > logs/analyze.txt 2>&1 || true
          tail -n 300 logs/analyze.txt

      - name: Build APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} 2>&1 | tee logs/build_full.log

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk football_manager.apk

      - name: Upload artifact (optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: football_manager-apk
          path: football_manager.apk

      - name: Publish APK to release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p logs
          {
            gh release view apk-latest >/dev/null 2>&1 || \
              gh release create apk-latest --title "Latest APK" --notes "Auto-built APK (debug-signed, for testing)"
            gh release upload apk-latest football_manager.apk --clobber
            gh release view apk-latest --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring))'
          } 2>&1 | tee logs/publish.txt

      - name: Save logs to ci-logs branch
        if: always()
        shell: bash
        run: |
          tail -n 400 logs/build_full.log > logs/build_tail.log 2>/dev/null || true
          rm -f logs/build_full.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f logs
          git commit -m "ci logs for ${GITHUB_SHA::7}: build ${{ steps.build.outcome }}, publish ${{ steps.publish.outcome }}"
          git push -f origin HEAD:ci-logs
