<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>
        // نفس آلية تطبيق المظهر الفوري المستخدمة عبر بقية اللعبة — يمنع وميض المظهر الخاطئ عند التحميل
        (function() { const t = localStorage.getItem('appTheme'); if (t === 'light') document.documentElement.setAttribute('data-theme','light'); })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة اللاعبين والعقود | محاكي كرة القدم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0e17; --card: #141b2d; --accent: #e8b84b;
            --success: #22c55e; --danger: #ef4444; --warning: #eab308;
            --text: #f1f5f9; --dim: #8b96ab; --gold: #e8b84b;
            --rating-high: #22c55e; --rating-mid: #eab308; --rating-low: #ef4444;
            /* Material Design 3 — نفس نظام الرموز الموحَّد عبر اللعبة (game_main.html/transfers.html) */
            --md-elevation-1: 0 1px 3px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.5);
            --md-elevation-2: 0 3px 8px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.5);
            --md-shape-sm:12px; --md-shape-md:16px; --md-shape-lg:20px; --md-shape-full:999px;
        }
        html[data-theme="light"] {
            --bg: #f4f5f9;
            --card: #ffffff;
            --accent: #b8862f;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #a16207;
            --text: #151a24;
            --dim: #6b7385;
            --gold: #b8862f;
            --rating-high: #16a34a;
            --rating-mid: #a16207;
            --rating-low: #dc2626;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 10px; }

        .header-pro {
            background: var(--card);
            padding: 16px; border-radius: var(--md-shape-lg); margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px;
            box-shadow: var(--md-elevation-1); position: sticky; top: 0; z-index: 100;
        }
        .stat-item { text-align: center; background: rgba(255,255,255,0.04); padding: 6px 14px; border-radius: var(--md-shape-full); }
        .stat-val { display: block; font-size: 1rem; font-weight: 800; color: var(--gold); }
        .stat-lbl { font-size: 0.55rem; color: var(--dim); text-transform: uppercase; }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .header-actions .btn { padding: 9px 16px; border-radius: var(--md-shape-full); border: none; font-weight: bold; cursor: pointer; font-size: 0.7rem; box-shadow: var(--md-elevation-1); }
        .btn-primary { background: var(--accent); color: #06090f; }
        .btn-success { background: var(--success); color: #06090f; }
        .btn-warning { background: var(--gold); color: #06090f; }
        .btn-danger { background: var(--danger); color: #fff; }

        .filters-bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 0; align-items: center; }
        .filters-bar input, .filters-bar select {
            background: var(--card); border: 1px solid rgba(255,255,255,0.08);
            color: var(--text); padding: 9px 14px; border-radius: var(--md-shape-full); font-size: 0.75rem;
        }
        .filters-bar input::placeholder { color: var(--dim); }

        .squad-list { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .player-card { background: var(--card); border-radius: var(--md-shape-md); border: 1px solid rgba(255,255,255,0.06); box-shadow: var(--md-elevation-1); cursor: pointer; transition: 0.2s; }
        .player-card:active { transform: scale(0.98); box-shadow: var(--md-elevation-2); }
        .matrix-row {
            display: grid; grid-template-columns: 50px 45px 1fr 80px 85px 55px 70px;
            padding: 10px 5px; text-align: center; font-size: 0.8rem; align-items: center;
        }
        .matrix-row div { display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,0.06); }
        .matrix-row div:last-child { border-left: none; }
        .matrix-row small { font-size: 0.5rem; color: var(--dim); margin-bottom: 2px; }
        .p-name { font-weight: bold; color: var(--accent); font-size: 0.85rem; }
        .jersey-num { display: inline-block; background: rgba(232,184,75,0.15); color: var(--gold); border: 1px solid rgba(232,184,75,0.4); border-radius: 5px; padding: 0px 5px; font-size: 0.7rem; font-weight: 900; margin-left: 4px; }
        .p-nat { display:flex; align-items:center; gap:5px; font-size:0.6rem; color:var(--dim); margin-top:2px; flex-wrap:wrap; }
        .flag { width:18px; height:13px; border-radius:2px; object-fit:cover; box-shadow:0 0 0 1px rgba(255,255,255,.12); vertical-align:middle; }
        .flag-lg { width:26px; height:19px; border-radius:3px; object-fit:cover; box-shadow:0 0 0 1px rgba(255,255,255,.15); }
        .badge-eu { background: #1a5276; color: #90caf9; padding: 1px 8px; border-radius: 12px; font-size: 0.5rem; }
        .badge-foreign { background: #4a1a1a; color: #ff6b6b; padding: 1px 8px; border-radius: 12px; font-size: 0.5rem; }
        .badge-home { background: #1a4a1a; color: #6bff6b; padding: 1px 8px; border-radius: 12px; font-size: 0.5rem; }
        .badge-region { background: #3a2e1a; color: #f0c674; padding: 1px 8px; border-radius: 12px; font-size: 0.5rem; }
        .badge-sale { background: #4a3a1a; color: var(--warning); padding: 1px 8px; border-radius: 12px; font-size: 0.5rem; border: 1px solid var(--warning); }
        .morale-mini { font-size: 0.85rem; }
        .injury-badge { font-size: 0.65rem; font-weight: 800; color: #ff4d4d; background: rgba(255,77,77,0.15); padding: 1px 6px; border-radius: 999px; margin-right: 4px; }
        .player-card-injured { border-color: rgba(255,77,77,0.4) !important; opacity: 0.88; }

        .pos-section { margin-bottom: 18px; }
        .pos-section-title { font-size: 0.85rem; font-weight: 800; color: var(--gold, #e8b84b); padding: 8px 4px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px; }
        .pos-count { background: rgba(255,255,255,0.08); font-size: 0.65rem; padding: 2px 8px; border-radius: 999px; color: #ccc; margin-right: auto; }
        .pos-empty { font-size: 0.72rem; color: #ff8080; padding: 10px 4px; }

        .squad-intel-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; margin: 10px 0; }
        .intel-stats { display: flex; justify-content: space-around; margin-bottom: 10px; }
        .intel-stat { text-align: center; }
        .intel-stat b { display: block; font-size: 1.1rem; color: var(--gold, #e8b84b); }
        .intel-stat small { font-size: 0.65rem; color: #999; }
        .intel-warnings { display: flex; flex-direction: column; gap: 6px; }
        .intel-warning { font-size: 0.72rem; color: #ffb84d; background: rgba(255,184,77,0.08); padding: 7px 10px; border-radius: 8px; line-height: 1.6; }
        .intel-ok { font-size: 0.75rem; color: #4ade80; background: rgba(74,222,128,0.08); padding: 9px 10px; border-radius: 8px; text-align: center; }
        .rating-oval {
            display: inline-block; width: 32px; height: 32px; border-radius: 50%;
            line-height: 32px; text-align: center; font-size: 0.65rem; font-weight: bold; border: 2px solid var(--gold);
        }
        .rating-high { color: var(--rating-high); border-color: var(--rating-high); }
        .rating-mid { color: var(--rating-mid); border-color: var(--rating-mid); }
        .rating-low { color: var(--rating-low); border-color: var(--rating-low); }

        .wage-fair { color: var(--success); } .wage-high { color: var(--danger); }
        .empty-box { text-align:center; padding:40px 20px; color:var(--dim); font-size:0.85rem; line-height:1.7; }
        .empty-box a { color: var(--accent); text-decoration:none; font-weight:bold; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { width: 100%; max-width: 580px; background: linear-gradient(160deg, #131c2e, #0a0f1a); border-radius: 20px; border: 1px solid var(--gold); padding: 20px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        .modal-tabs { display: flex; gap: 5px; margin: 10px 0; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 4px; }
        .modal-tab { flex: 1; padding: 9px; border: none; background: transparent; color: var(--dim); border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.7rem; transition: 0.3s; }
        .modal-tab.active { background: var(--gold); color: #000; }
        .modal-section { display: none; padding: 10px 0; }
        .modal-section.active { display: block; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; font-size: 0.72rem; }
        .stat-row .bar { flex: 1; height: 6px; background: rgba(128,128,128,0.15); border-radius: 3px; margin: 0 8px; overflow: hidden; }
        .stat-row .bar .fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
        .stat-row .bar .fill.high { background: var(--rating-high); }
        .stat-row .bar .fill.mid { background: var(--rating-mid); }
        .stat-row .bar .fill.low { background: var(--rating-low); }
        .contract-field { background: rgba(255,255,255,0.045); padding: 11px 12px; border-radius: 10px; margin: 5px 0; border: 1px solid rgba(255,255,255,0.06); border-right: 3px solid var(--gold); }
        .contract-field label { font-size: 0.62rem; color: var(--dim); display: flex; align-items: center; gap: 5px; letter-spacing: 0.2px; }
        .contract-field input { width: 100%; padding: 8px; background: var(--bg); border: 1px solid var(--border, rgba(255,255,255,0.15)); color: var(--text); border-radius: 6px; margin-top: 3px; font-size: 0.85rem; }
        .contract-field input:focus { border-color: var(--gold); outline: none; }
        .contract-field input:disabled { opacity: 0.5; cursor: not-allowed; }
        .fair-hint { font-size:0.62rem; margin-top:5px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-group .btn { padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.7rem; }
        .btn-group .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .toast-msg { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(255,255,255,0.08); border-right: 4px solid var(--gold); padding: 12px; border-radius: 50px; text-align: center; z-index: 2000; font-size: 0.9rem; }
        .renewal-window { background: rgba(255,204,0,0.1); border: 1px solid var(--warning); padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; color: var(--warning); margin: 5px 0; }
        .renewal-window .success { color: var(--success); }
        .renewal-window .danger { color: var(--danger); }
        
        .skill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .skill-item { background: rgba(128,128,128,0.08); padding: 6px 10px; border-radius: 6px; border-left: 3px solid var(--gold); }
        .skill-item .skill-name { font-size: 0.6rem; color: var(--dim); }
        .skill-item .skill-val { font-weight: bold; font-size: 0.85rem; }
        .skill-item .skill-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 3px; overflow: hidden; }
        .skill-item .skill-bar .fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        @media (max-width: 768px) {
            .matrix-row { grid-template-columns: 35px 35px 1fr 58px 60px 38px 55px; font-size: 0.6rem; padding: 8px 3px; }
            .rating-oval { width: 25px; height: 25px; line-height: 25px; font-size: 0.5rem; }
            .header-actions .btn { font-size: 0.6rem; padding: 5px 10px; }
            .btn-group { grid-template-columns: 1fr; }
            .flag { width:15px; height:11px; }
            .skill-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header-pro">
    <div class="stat-item"><span class="stat-val" id="countDisplay">0</span><span class="stat-lbl" id="lblPlayers">لاعباً</span></div>
    <div class="stat-item"><span class="stat-val" style="color:var(--accent)" id="clubNameDisplay">--</span><span class="stat-lbl" id="lblClub">النادي</span></div>
    <div class="stat-item"><span class="stat-val" id="totalMarketValue">0</span><span class="stat-lbl" id="lblSquadVal">قيمة القائمة</span></div>
    <div class="stat-item"><span class="stat-val" id="avgRating">0</span><span class="stat-lbl" id="lblAvgRating">متوسط التقييم</span></div>
    <div class="stat-item"><span class="stat-val" id="totalWage">0</span><span class="stat-lbl" id="lblWages">الرواتب/أسبوع</span></div>
    <div class="header-actions">
        <button class="btn btn-primary" onclick="loadSquad(true)" title="إعادة استيراد الفريق الحقيقي من CSV"><i class="fas fa-sync"></i></button>
    </div>
</div>

<div id="fedRestrictBanner" style="display:none; background:rgba(239,51,102,0.08); border:1px solid var(--danger); border-radius:10px; padding:10px 14px; margin:10px 0; font-size:0.78rem; color:var(--text); align-items:center; gap:8px;">
    <i class="fas fa-triangle-exclamation" style="color:var(--danger);"></i>
    <span id="fedRestrictText"></span>
</div>

<div id="squadIntelBox" class="squad-intel-box"></div>

<div class="squad-list" id="squadGrid"></div>

<!-- Modal -->
<div class="modal-overlay" id="controlModal">
    <div class="modal-content">
        <div style="display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg, rgba(232,184,75,0.08), transparent); border-radius:12px; padding:10px 12px; margin-bottom:4px;">
            <div style="display:flex;align-items:center;gap:10px;">
                <span id="modalJerseyNum" class="jersey-num" style="font-size:1rem; padding:3px 9px;"></span>
                <span id="modalFlagEmoji" class="flag-lg" style="font-size:1.4rem;"></span>
                <h2 id="modalPlayerName" style="color:var(--gold);font-size:1.2rem;"></h2>
            </div>
            <span id="modalPlayerRating" style="font-size:1.7rem;font-weight:900;color:var(--accent);text-shadow:0 0 12px rgba(96,165,250,0.4);"></span>
        </div>
        <p id="modalPlayerInfo" style="color:var(--dim);font-size:0.8rem;margin:5px 2px;"></p>
        <div class="modal-tabs">
            <button class="modal-tab active" data-tab="info" onclick="switchModalTab('info')"><i class="fas fa-circle-info"></i> <span id="tabInfo">المعلومات</span></button>
            <button class="modal-tab" data-tab="skills" onclick="switchModalTab('skills')"><i class="fas fa-chart-simple"></i> <span id="tabSkills">المهارات</span></button>
            <button class="modal-tab" data-tab="contract" onclick="switchModalTab('contract')"><i class="fas fa-file-signature"></i> <span id="tabContract">العقد</span></button>
        </div>
        <div class="modal-section active" id="tab-info">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div class="contract-field" style="border-right-color:#60a5fa;"><label><i class="fas fa-calendar-day"></i> <span id="lblAge">العمر</span></label><span id="infoAge" style="color:var(--text);font-size:1rem;"></span></div>
                <div class="contract-field" style="border-right-color:#60a5fa;"><label><i class="fas fa-earth-africa"></i> <span id="lblNationality">الجنسية</span></label><span id="infoNationality" style="color:var(--text);font-size:1rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;"></span></div>
                <div class="contract-field" style="border-right-color:var(--gold);"><label><i class="fas fa-chart-line"></i> <span id="lblPotential">الإمكانية</span></label><span id="infoPotential" style="color:var(--gold);font-size:1rem;"></span></div>
                <div class="contract-field" style="border-right-color:#a78bfa;"><label><i class="fas fa-face-smile"></i> <span id="lblMorale">الحالة المعنوية</span></label><span id="infoMorale" style="font-size:1rem;"></span></div>
                <div class="contract-field" style="border-right-color:#ff4d4d;"><label><i class="fas fa-notes-medical"></i> <span id="lblInjuryStatus">الحالة الصحية</span></label><span id="infoInjuryStatus" style="font-size:1rem;"></span></div>
                <div class="contract-field" style="border-right-color:var(--success);"><label><i class="fas fa-sack-dollar"></i> <span id="lblMarketValue">القيمة السوقية</span></label><span id="infoValue" style="color:var(--success);font-size:1rem;"></span></div>
                <div class="contract-field" style="border-right-color:var(--success);"><label><i class="fas fa-futbol"></i> <span id="lblGoals">الأهداف</span></label><span id="infoGoals" style="color:var(--success);font-size:1rem;"></span></div>
                <div class="contract-field" style="border-right-color:var(--accent);"><label><i class="fas fa-a" style="color:var(--accent);"></i> <span id="lblAssists">التمريرات</span></label><span id="infoAssists" style="color:var(--accent);font-size:1rem;"></span></div>
                <div class="contract-field" style="border-right-color:#60a5fa;"><label><i class="fas fa-list-check"></i> <span id="lblMatches">المباريات</span></label><span id="infoMatches" style="color:var(--text);font-size:1rem;"></span></div>
                <div class="contract-field" style="border-right-color:var(--warning);"><label><i class="fas fa-shield-halved"></i> <span id="lblRelease">الشرط الجزائي</span></label><span id="infoRelease" style="color:var(--warning);font-size:1rem;"></span></div>
            </div>
            <div class="contract-field" style="margin-top:10px;border-right-color:var(--gold);">
                <label><i class="fas fa-comment-dots"></i> <span id="lblThought">تفكير اللاعب</span></label>
                <p id="playerThought" style="color:var(--dim);font-size:0.85rem;line-height:1.5;margin-top:5px;"></p>
            </div>
        </div>
        <div class="modal-section" id="tab-skills">
            <div id="detailedRatings"></div>
        </div>
        <div class="modal-section" id="tab-contract">
            <div id="contractDetails"></div>
            <div id="renewalStatus" class="renewal-window"></div>
            <div style="margin-top:15px;border-top:1px solid rgba(255,255,255,0.08);padding-top:15px;">
                <h4 style="color:var(--gold);font-size:0.8rem;"><i class="fas fa-pen-to-square"></i> تعديل العقد</h4>
                <div id="contractEditArea">
                    <div class="contract-field">
                        <label><i class="fas fa-money-bill-wave"></i> <span id="lblProposedWage">الراتب الأسبوعي المقترح (€)</span></label>
                        <input type="number" id="editWage" oninput="checkWageFairness()">
                        <div class="fair-hint" id="wageFairHint"></div>
                    </div>
                    <div class="contract-field"><label><i class="fas fa-calendar-days"></i> <span id="lblContractYears">مدة العقد (سنوات)</span></label><input type="number" id="editYears" min="1" max="5" oninput="clampRenewalYears()"><div id="editYearsHint" style="font-size:0.65rem;color:var(--text-muted);margin-top:3px;"></div></div>
                    <div class="contract-field"><label><i class="fas fa-gift"></i> <span id="lblSignBonus">مكافأة التوقيع (€)</span></label><input type="number" id="editBonus" placeholder="اختياري"></div>
                    <div id="negotiationResult" style="margin: 8px 0; font-size: 0.75rem; padding: 8px; border-radius: 6px; display:none;"></div>
                    <div class="btn-group">
                        <button class="btn btn-success" id="renewBtn" onclick="attemptRenewal()"><i class="fas fa-file-signature"></i> <span id="btnRenewTxt">عرض تجديد</span></button>
                        <button class="btn btn-warning" id="listBtn" onclick="listForTransfer()"><i class="fas fa-tags"></i> <span id="btnListTxt">عرض للبيع</span></button>
                        <button class="btn btn-danger" onclick="releasePlayer()"><i class="fas fa-user-slash"></i> <span id="btnReleaseTxt">فسخ</span></button>
                    </div>
                </div>
            </div>
        </div>
        <button onclick="closeModals()" style="width:100%;margin-top:15px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:0.8rem;">
            <i class="fas fa-times"></i> إغلاق
        </button>
    </div>
</div>

<script>
    /* ============================================================
       دوال أساسية
       ============================================================ */
    function getClubName(){ return localStorage.getItem('presidentialClub') || 'نادي المستقبل'; }
    function getClubId(){ return localStorage.getItem('presidentialTeamId') || ''; }
    
    function fedGetRules(){
        return JSON.parse(localStorage.getItem('federationRules')) || {
            tier:1,
            squadMax:25,
            foreignMax:3,
            homegrownMin:0,
            wageCapPct:70,
            tierLabel:'الدرجة الأولى (الممتاز)',
            confederationLabel:'الاتحاد الأوروبي (UEFA)',
            confederation:'UEFA'
        };
    }

    /* ============================================================

    // ★ أعمدة السمات الحقيقية في ملف new-players-data-full.csv (بيانات FC25 الحقيقية) ★
    const REAL_ATTR_COLS = ['crossing','finishing','heading_accuracy','short_passing','volleys','dribbling',
        'curve','fk_accuracy','long_passing','ball_control','acceleration','sprint_speed','agility','reactions',
        'balance','shot_power','jumping','stamina','strength','long_shots','aggression','interceptions',
        'positioning','vision','penalties','composure','defensive_awareness','standing_tackle','sliding_tackle',
        'gk_diving','gk_handling','gk_kicking','gk_positioning','gk_reflexes'];

    function hasRealAttrColumns(row){
        return REAL_ATTR_COLS.some(col => row[col] !== undefined && row[col] !== '' && !isNaN(parseFloat(row[col])));
    }

    function num(row, col, fallback){
        const v = parseFloat(row[col]);
        return isNaN(v) ? fallback : v;
    }
    function avg(vals){
        const v = vals.filter(x => typeof x === 'number' && !isNaN(x));
        if(!v.length) return null;
        return v.reduce((a,b)=>a+b,0) / v.length;
    }
    function clampSkill(v){ return Math.min(99, Math.max(1, Math.round(v))); }

    // ★ استخراج المهارات الحقيقية من أعمدة CSV (بدون أي عشوائية) ★
    function extractSkillsFromRealAttrs(row){
        const skills = {};

        // السمات التفصيلية المطابقة مباشرة لأعمدة CSV الحقيقية
        skills.crossing       = clampSkill(num(row,'crossing', 40));
        skills.finishing      = clampSkill(num(row,'finishing', 40));
        skills.heading         = clampSkill(num(row,'heading_accuracy', 40));
        skills.short_passing   = clampSkill(num(row,'short_passing', 40));
        skills.volleys         = clampSkill(num(row,'volleys', 40));
        skills.dribbling_skill = clampSkill(num(row,'dribbling', 40));
        skills.curve           = clampSkill(num(row,'curve', 40));
        skills.fk_accuracy     = clampSkill(num(row,'fk_accuracy', 40));
        skills.long_passing    = clampSkill(num(row,'long_passing', 40));
        skills.ball_control    = clampSkill(num(row,'ball_control', 40));
        skills.acceleration    = clampSkill(num(row,'acceleration', 40));
        skills.sprint_speed    = clampSkill(num(row,'sprint_speed', 40));
        skills.agility         = clampSkill(num(row,'agility', 40));
        skills.reactions       = clampSkill(num(row,'reactions', 40));
        skills.balance         = clampSkill(num(row,'balance', 40));
        skills.shot_power      = clampSkill(num(row,'shot_power', 40));
        skills.jumping         = clampSkill(num(row,'jumping', 40));
        skills.stamina         = clampSkill(num(row,'stamina', 40));
        skills.strength        = clampSkill(num(row,'strength', 40));
        skills.tackling        = clampSkill(num(row,'standing_tackle', 30));
        skills.positioning     = clampSkill(num(row,'positioning', 40));
        skills.vision          = clampSkill(num(row,'vision', 40));
        skills.defending       = clampSkill(num(row,'defensive_awareness', 30));
        // مهارات حراسة المرمى
        skills.diving      = clampSkill(num(row,'gk_diving', 10));
        skills.handling    = clampSkill(num(row,'gk_handling', 10));
        skills.kicking     = clampSkill(num(row,'gk_kicking', 10));
        skills.reflexes    = clampSkill(num(row,'gk_reflexes', 10));

        // السمات المُجمّعة الست الأساسية (تُحسب من السمات الحقيقية التفصيلية - نفس منطق FIFA/FC)
        const pace = avg([num(row,'acceleration',null), num(row,'sprint_speed',null)]);
        skills.pace = clampSkill(pace !== null ? pace : 55);

        const shooting = avg([num(row,'finishing',null), num(row,'shot_power',null), num(row,'long_shots',null),
            num(row,'volleys',null), num(row,'penalties',null)]);
        skills.shooting = clampSkill(shooting !== null ? shooting : 45);

        const passing = avg([num(row,'short_passing',null), num(row,'long_passing',null), num(row,'vision',null),
            num(row,'crossing',null), num(row,'fk_accuracy',null), num(row,'curve',null)]);
        skills.passing = clampSkill(passing !== null ? passing : 45);

        const dribbling = avg([num(row,'dribbling',null), num(row,'ball_control',null), num(row,'agility',null),
            num(row,'balance',null), num(row,'reactions',null), num(row,'composure',null)]);
        skills.dribbling = clampSkill(dribbling !== null ? dribbling : 45);

        const defending = avg([num(row,'defensive_awareness',null), num(row,'standing_tackle',null),
            num(row,'sliding_tackle',null), num(row,'interceptions',null), num(row,'heading_accuracy',null)]);
        skills.defending = clampSkill(defending !== null ? defending : 35);

        const physical = avg([num(row,'strength',null), num(row,'stamina',null), num(row,'jumping',null),
            num(row,'aggression',null)]);
        skills.physical = clampSkill(physical !== null ? physical : 50);

        return skills;
    }

    // ★ استخراج المهارات من CSV أو توليدها ★
    function extractSkills(row) {
        const pos = row.best_position || row.main_position || row.position || 'CM';

        // 1. الأولوية لبيانات السمات الحقيقية (ملف new-players-data-full.csv)
        if (hasRealAttrColumns(row)) {
            return extractSkillsFromRealAttrs(row);
        }

        // 2. محاولة قراءة المهارات من صيغة CSV القديمة (توافقية)
        const skills = {};
        let hasRealSkills = false;
        Object.keys(CSV_TO_SKILL).forEach(csvCol => {
            const val = parseFloat(row[csvCol]);
            if (!isNaN(val) && val > 0) {
                const skillKey = CSV_TO_SKILL[csvCol];
                skills[skillKey] = Math.min(99, Math.max(1, Math.round(val)));
                hasRealSkills = true;
            }
        });

        if (hasRealSkills) {
            ALL_SKILLS.forEach(skill => {
                if (!skills[skill]) {
                    skills[skill] = generateSkillFromPosition(skill, pos, 50);
                }
            });
            return skills;
        }

        // 3. توليد مهارات حسب المركز (فقط إذا لم تتوفر أي بيانات حقيقية)
        const baseRating = parseInt(row.overall_rating || row.rating || row.ovr || 65);
        return generateSkillsByPosition(pos, baseRating);
    }

    // ★ توليد مهارات حسب المركز ★
    function generateSkillsByPosition(position, baseRating) {
        const skills = {};
        ALL_SKILLS.forEach(skill => {
            skills[skill] = generateSkillFromPosition(skill, position, baseRating);
        });
        return skills;
    }

    // ★ توليد مهارة واحدة حسب المركز ★
    function generateSkillFromPosition(skill, position, baseRating) {
        const posConfig = POSITION_SKILL_WEIGHTS[position] || POSITION_SKILL_WEIGHTS['CM'];
        
        if (posConfig.primary && posConfig.primary.includes(skill)) {
            return Math.min(99, Math.max(30, baseRating + Math.floor(Math.random() * 8) - 2));
        }
        else if (posConfig.secondary && posConfig.secondary.includes(skill)) {
            return Math.min(95, Math.max(25, baseRating - 4 + Math.floor(Math.random() * 6)));
        }
        else if (posConfig.ignore && posConfig.ignore.includes(skill)) {
            return Math.min(70, Math.max(15, baseRating - 18 + Math.floor(Math.random() * 10)));
        }
        else {
            return Math.min(85, Math.max(20, baseRating - 10 + Math.floor(Math.random() * 12)));
        }
    }

    // ★ حساب التقييم العام من المهارات (مثل FIFA) ★
    function calculateOverallFromSkills(skills, position) {
        if (!skills || Object.keys(skills).length === 0) return 60;
        
        const posConfig = POSITION_SKILL_WEIGHTS[position] || POSITION_SKILL_WEIGHTS['CM'];
        let total = 0;
        let count = 0;
        
        if (posConfig.primary) {
            posConfig.primary.forEach(skill => {
                if (skills[skill]) {
                    total += skills[skill] * 1.5;
                    count += 1.5;
                }
            });
        }
        
        if (posConfig.secondary) {
            posConfig.secondary.forEach(skill => {
                if (skills[skill]) {
                    total += skills[skill] * 1.0;
                    count += 1.0;
                }
            });
        }
        
        if (posConfig.ignore) {
            posConfig.ignore.forEach(skill => {
                if (skills[skill]) {
                    total += skills[skill] * 0.4;
                    count += 0.4;
                }
            });
        }
        
        ALL_SKILLS.forEach(skill => {
            if (!posConfig.primary?.includes(skill) && 
                !posConfig.secondary?.includes(skill) && 
                !posConfig.ignore?.includes(skill) &&
                skills[skill]) {
                total += skills[skill] * 0.3;
                count += 0.3;
            }
        });
        
        return count > 0 ? Math.min(99, Math.max(30, Math.round(total / count))) : 60;
    }

    function parseMarketValue(valueStr) {
        if (!valueStr) return 0;
        if (typeof valueStr === 'number' && !isNaN(valueStr)) return valueStr;
        
        let str = String(valueStr).trim();
        if (str === '') return 0;
        
        let cleanStr = str.replace(/[€\s]/g, '');
        let numMatch = cleanStr.match(/[\d.]+/);
        if (!numMatch) return 0;
        
        let num = parseFloat(numMatch[0]);
        if (isNaN(num) || num === 0) return 0;
        
        let suffix = cleanStr.replace(/[\d.]/g, '').toLowerCase();
        
        if (suffix.includes('b')) num *= 1e9;
        else if (suffix.includes('m')) num *= 1e6;
        else if (suffix.includes('k')) num *= 1e3;
        else if (num < 1000 && num > 0) num *= 1e6;
        
        return Math.round(num);
    }

    function estimateMarketValue(rating, age, position) {
        let baseValue = 0;
        if (rating >= 90) baseValue = 100000000;
        else if (rating >= 85) baseValue = 50000000;
        else if (rating >= 80) baseValue = 25000000;
        else if (rating >= 75) baseValue = 10000000;
        else if (rating >= 70) baseValue = 5000000;
        else if (rating >= 65) baseValue = 2000000;
        else if (rating >= 60) baseValue = 800000;
        else baseValue = 300000;
        
        if (age < 23) baseValue *= 1.5;
        else if (age > 30) baseValue *= 0.7;
        else if (age > 33) baseValue *= 0.5;
        
        if (['ST', 'CF', 'LW', 'RW'].includes(position)) baseValue *= 1.2;
        else if (['GK'].includes(position)) baseValue *= 0.8;
        
        return Math.round(baseValue / 100000) * 100000;
    }

    // ★ تقدير تقييم واقعي من القيمة السوقية الحقيقية (عكس estimateMarketValue) ★
    // يُستخدم فقط عندما لا يوجد للاعب صف مهارات حقيقي مطابق في new-players-data-full.csv
    function estimateRatingFromMarketValue(marketValue, age, position){
        let base = marketValue || 0;
        if (['ST', 'CF', 'LW', 'RW'].includes(position)) base /= 1.2;
        else if (position === 'GK') base /= 0.8;

        if (age < 23) base /= 1.5;
        else if (age > 33) base /= 0.5;
        else if (age > 30) base /= 0.7;

        if (base >= 90000000) return 90;
        if (base >= 45000000) return 85;
        if (base >= 22000000) return 80;
        if (base >= 9000000) return 75;
        if (base >= 4000000) return 70;
        if (base >= 1500000) return 65;
        if (base >= 600000) return 60;
        return 55;
    }

    // ★ تحليل تواريخ مرنة: يدعم صيغة ISO الكاملة وصيغة "YYYY-M-D" غير المبطّنة بالأصفار ★
    function parseFlexibleDate(str){
        if (!str) return null;
        let d = new Date(str);
        if (!isNaN(d.getTime())) return d;
        const m = String(str).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) {
            d = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
            if (!isNaN(d.getTime())) return d;
        }
        return null;
    }

    function extractNationalityFromDescription(desc){
        if (!desc) return null;

        // 1) الأدق: "...the <Country> national team"
        const teamMatch = desc.match(/the\s+([A-Za-z .'-]+?)\s+national team/i);
        if (teamMatch) {
            const country = teamMatch[1].trim();
            if (country.length > 1) return country;
        }

        // 2) صفة الجنسية: "is a/an <demonym> footballer"
        const demMatch = desc.match(/is\s+(?:an|a)\s+([A-Za-z\-]+(?:\s[A-Za-z\-]+){0,2})\s+footballer/i);
        if (demMatch) {
            const demonym = demMatch[1].trim().toLowerCase();
            if (DEMONYM_TO_COUNTRY[demonym]) return DEMONYM_TO_COUNTRY[demonym];
        }

        return null;
    }

    // ★ حساب العمر الحقيقي من تاريخ الميلاد (dob) ★
    function ageFromDob(dob){
        if(!dob) return null;
        const d = new Date(dob);
        if (isNaN(d.getTime())) return null;
        const now = new Date();
        let age = now.getFullYear() - d.getFullYear();
        const m = now.getMonth() - d.getMonth();
        if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
        return age;
    }

    // ★ تحويل سنة انتهاء العقد إلى timestamp حقيقي ★
    function contractYearToTs(yearVal){
        const y = parseInt(yearVal);
        if (isNaN(y) || y <= 0) return null;
        return new Date(y, 5, 30).getTime(); // 30 يونيو من سنة انتهاء العقد
    }

    // ★ تحويل رموز مراكز ملف الهوية المختصرة لما يوافق نظام أوزان المهارات ★
    const OLD_POS_MAP = { 'AM': 'CAM', 'DM': 'CDM', 'SS': 'CF' };

    function extractPlayerData(row, index, skillsNameIndex) {
        // ★ الاسم: دائمًا من الملف الأساسي (player_interface_part_1.csv) ★
        const name = row.player_name || row.name || row.player_display_name || row.full_name || row.long_name || 'لاعب';
        const displayName = row.player_display_name || '';

        // ★ إيجاد صف المهارات الحقيقي المطابق (إن وُجد) من new-players-data-full.csv ★
        const matchedSkillsRow = findSkillsRow(name, displayName, skillsNameIndex, row.club || row.club_name);

        // ★ الجنسية: من الملف الأساسي أولاً (كما طلب المستخدم)، ثم من صف المهارات المطابق إن كانت فارغة ★
        let nationality = (row.nationality || row.nationality_id || row.country || '').trim();
        if (!nationality && matchedSkillsRow) {
            nationality = (matchedSkillsRow.country_name || '').trim() ||
                extractNationalityFromDescription(matchedSkillsRow.description) || '';
        }
        if (!nationality) nationality = 'Saudi Arabia';

        // ★ المركز: من الملف الأساسي مع تحويل الرموز المختصرة (AM/DM/SS) ★
        let position = (row.main_position || row.position || row.pos || 'CM').trim();
        position = OLD_POS_MAP[position] || position || 'CM';

        // ★ العمر: معطى مباشرة في الملف الأساسي ★
        const age = Math.round(parseFloat(row.age)) || 25;

        const teamId = row.team_id || row.club_id || row.teamId || '';

        // ★ القيمة السوقية: تُحفظ دائمًا من الملف الأساسي كما طلب المستخدم صراحةً ★
        let marketValue = parseMarketValue(row.market_value_cur || row.market_value_cur_short || row.value);

        // ★ المهارات والتقييم والإمكانية: حقيقية من صف المهارات المطابق إن وُجد، وإلا تُقدَّر ★
        let skills, rating, potential;
        const hasRealSkills = !!matchedSkillsRow;
        if (matchedSkillsRow) {
            skills = extractSkills(matchedSkillsRow);
            rating = parseInt(matchedSkillsRow.overall_rating) || null;
            potential = parseInt(matchedSkillsRow.potential) || null;
        }
        if (!rating) rating = estimateRatingFromMarketValue(marketValue, age, position);
        if (!skills) skills = generateSkillsByPosition(position, rating);
        if (!potential) potential = Math.min(99, rating + (age <= 23 ? 6 : age <= 27 ? 2 : 0));
        if (marketValue === 0) marketValue = estimateMarketValue(rating, age, position);

        // ★ العقد: تاريخ الانتهاء وآخر تجديد الحقيقيان من الملف الأساسي ★
        let contractUntilTs = null;
        const contractDate = parseFlexibleDate(row.contract_until);
        if (contractDate) contractUntilTs = contractDate.getTime();
        if (!contractUntilTs) contractUntilTs = Date.now() + 3 * 365.25 * 24 * 3600 * 1000;

        let lastRenewalTs = null;
        const renewalDate = parseFlexibleDate(row.last_contract_renewal);
        if (renewalDate) lastRenewalTs = renewalDate.getTime();

        // ★ القدم المفضلة: من الملف الأساسي (بحروف صغيرة فنُحوّلها لحرف كبير أول) ★
        const rawFoot = (row.foot || '').trim();
        const foot = rawFoot ? (rawFoot.charAt(0).toUpperCase() + rawFoot.slice(1).toLowerCase()) : 'Right';

        // ★ الطول: بالأمتار في الملف الأساسي (مثال 1.80) فنحوّله لسم ★
        let height = 0;
        const rawHeight = parseFloat(row.height);
        if (!isNaN(rawHeight) && rawHeight > 0) {
            height = rawHeight <= 3 ? Math.round(rawHeight * 100) : Math.round(rawHeight);
        }

        return {
            name: name.trim(),
            nationality: nationality,
            position: position,
            rating: rating,
            age: age,
            market_value_eur: marketValue,
            weekly_wage: 0,
            contract_until_ts: contractUntilTs,
            last_renewal_ts: lastRenewalTs,
            id: 'p_' + (row.tmid || index),
            goals: parseInt(row.goals) || 0,
            assists: parseInt(row.assists) || 0,
            matches: parseInt(row.matches) || 0,
            potential: potential,
            team_id: teamId,
            club: row.club || row.club_name || '',
            jersey: parseInt(row.jersey) || (index % 30 + 1),
            is_captain: row.is_captain === '1' || row.is_captain === 'true' || row.is_captain === 'True' || row.is_captain === true || false,
            skills: skills,
            has_real_skills: hasRealSkills,
            height: height,
            foot: foot
        };
    }

    /* ============================================================
       حفظ واسترجاع البيانات
       ============================================================ */
    function getSquadData(){
        const all = JSON.parse(localStorage.getItem('signed_players_by_club')) || {};
        const club = getClubName();
        if(!all[club]) all[club] = [];
        return all;
    }

    function saveSquad(){
        const all = getSquadData();
        all[getClubName()] = players;
        localStorage.setItem('signed_players_by_club', JSON.stringify(all));
    }

    // ============================================================
    // مكافآت الأداء الحقيقية — تُدفع فعلياً مرة واحدة فقط عند بلوغ اللاعب فعلياً حدّاً حقيقياً
    // (كل 10 أهداف/مباريات رسمية حقيقية)، محسوبة من بيانات لعبه الفعلية، لا افتراضاً عاماً
    // ============================================================
    function getClubBudget(){ return parseFloat(localStorage.getItem('clubBudget')) || 0; }
    function setClubBudget(v){ localStorage.setItem('clubBudget', v.toFixed(2)); }
    function addMessageToSystem(sender, text, category) {
        let inbox = JSON.parse(localStorage.getItem('gameInbox')) || [];
        inbox.unshift({ id: Date.now(), sender, text, time: new Date().toLocaleTimeString('en-US', { hour12:false }), read:false, category: category || 'transfer' });
        localStorage.setItem('gameInbox', JSON.stringify(inbox));
        localStorage.setItem('hasNewMessage', 'true');
    }
    function checkPerformanceBonuses() {
        let changed = false;
        players.forEach(p => {
            const bonus = parseFloat(p.performanceBonus) || 0;
            if (!bonus || p.performanceBonusPaid) return;
            const contribUnits = (parseFloat(p.goals)||0) + (parseFloat(p.matches)||0); // مساهمة حقيقية فعلية (أهداف + مباريات لعبها)
            const baseline = parseFloat(p.performanceBonusBaseline) || 0;
            if (contribUnits - baseline >= 10) { // كل 10 وحدات مساهمة حقيقية فعلية منذ التوقيع
                setClubBudget(getClubBudget() + bonus / 1000000);
                p.performanceBonusPaid = true; // مكافأة واحدة لكل عقد كما تم الاتفاق عليه عند التوقيع
                addMessageToSystem('الإدارة المالية', `💰 ${pt('perfBonusMsg', p.player_name||p.name, (bonus/1000000).toFixed(2))}`, 'finance');
                changed = true;
            }
        });
        if (changed) saveSquad();
    }

    let players = [];
    let filteredPlayers = [];
    let activeIdx = null;
    let isLoading = false;

    /* ============================================================
       تحميل اللاعبين من ملف CSV
       ============================================================ */
    function parseCSV(text){
        const rows = [];
        let row = [], field = '', inQuotes = false;
        for (let i = 0; i < text.length; i++){
            const c = text[i], next = text[i+1];
            if (inQuotes){
                if (c === '"' && next === '"'){ field += '"'; i++; }
                else if (c === '"'){ inQuotes = false; }
                else field += c;
            } else {
                if (c === '"') inQuotes = true;
                else if (c === ','){ row.push(field); field = ''; }
                else if (c === '\r'){ /* تجاهل */ }
                else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
                else field += c;
            }
        }
        if (field.length || row.length){ row.push(field); rows.push(row); }
        if (!rows.length) return [];
        const headers = rows[0];
        const out = [];
        for (let i = 1; i < rows.length; i++){
            if (rows[i].length === 1 && rows[i][0] === '') continue;
            const obj = {};
            headers.forEach((h, idx) => obj[h] = rows[i][idx] !== undefined ? rows[i][idx] : '');
            out.push(obj);
        }
        return out;
    }

    // ★ الملف الأساسي (القديم): مصدر الحقيقة للاسم/النادي/الجنسية/القيمة السوقية/العقد ★
    // ★ مُقسّم على ملفين بدون أي تداخل بينهما - يجب دمجهما في قائمة واحدة ★
    const IDENTITY_CSV_FILES = ['player_interface_part_1.csv', 'player_interface_part_2.csv'];
    // ★ الملف الثانوي (الجديد): يُستخدم فقط لتعويض البيانات الناقصة (المهارات + التقييم) ★
    const SKILLS_CSV_FILE = 'new-players-data-full.csv';

    let identityRowsCache = null, identityFetchPromise = null;
    let skillsRowsCache = null, skillsFetchPromise = null;
    let skillsNameIndex = null;

    function fetchIdentityRows(){
        if (identityRowsCache) return Promise.resolve(identityRowsCache);
        if (identityFetchPromise) return identityFetchPromise;
        identityFetchPromise = Promise.all(
            IDENTITY_CSV_FILES.map(file =>
                fetch(file)
                    .then(r => { if (!r.ok) throw new Error(file + '-not-found'); return r.text(); })
                    .then(csv => parseCSV(csv))
                    .catch(err => { console.warn('تعذر تحميل', file, err); return []; })
            )
        ).then(partsArrays => {
            const combined = [].concat(...partsArrays);
            if (!combined.length) throw new Error('identity-csv-not-found');
            identityRowsCache = combined;
            return identityRowsCache;
        }).catch(err => { identityFetchPromise = null; throw err; });
        return identityFetchPromise;
    }

    function fetchSkillsRows(){
        if (skillsRowsCache) return Promise.resolve(skillsRowsCache);
        if (skillsFetchPromise) return skillsFetchPromise;
        skillsFetchPromise = fetch(SKILLS_CSV_FILE)
            .then(r => { if (!r.ok) throw new Error('skills-csv-not-found'); return r.text(); })
            .then(csv => { skillsRowsCache = parseCSV(csv); return skillsRowsCache; })
            .catch(err => { skillsFetchPromise = null; throw err; });
        return skillsFetchPromise;
    }

    // ★ توحيد اسم اللاعب للمطابقة بين الملفين (تجاهل حالة الأحرف والتشكيل والمسافات الزائدة) ★
    function normalizeName(s){
        if (!s) return '';
        return String(s)
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9\u0600-\u06FF]+/g, ' ')
            .trim();
    }

    // ★ بناء فهرس بالاسم لملف المهارات (new-players-data-full.csv) لإيجاد بيانات كل لاعب بسرعة ★
    // يشمل: الاسم، الاسم الكامل، والاسم الشائع المستخرج من بداية نص الوصف (الأدق للمطابقة)
    function buildSkillsNameIndex(skillsRows){
        const idx = new Map();
        function addVariant(key, row){
            if (!key) return;
            if (!idx.has(key)) idx.set(key, []);
            idx.get(key).push(row);
        }
        skillsRows.forEach(row => {
            addVariant(normalizeName(row.name), row);
            addVariant(normalizeName(row.full_name), row);
            const m = (row.description || '').match(/^([^(]+)\(/);
            if (m) addVariant(normalizeName(m[1]), row);
        });
        return idx;
    }

    // ★ إيجاد صف المهارات الحقيقي المطابق للاعب من الملف الأساسي (عبر الاسم، مع ترجيح تطابق النادي عند التكرار) ★
    function findSkillsRow(name, displayName, nameIndex, clubHint){
        if (!nameIndex) return null;
        const keys = [normalizeName(name), normalizeName(displayName)].filter(Boolean);
        let candidates = null;
        for (const k of keys) {
            if (nameIndex.has(k)) { candidates = nameIndex.get(k); break; }
        }
        if (!candidates || !candidates.length) return null;
        if (candidates.length === 1) return candidates[0];
        const normClub = normalizeClubName(clubHint);
        const clubMatch = normClub && candidates.find(c => normalizeClubName(c.club_name) === normClub);
        return clubMatch || candidates[0];
    }

    // ★ توحيد اسم النادي لتفادي فروقات بسيطة (أحرف كبيرة/صغيرة، FC، مسافات...) عند المطابقة ★
    function normalizeClubName(s){
        if (!s) return '';
        return String(s)
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/\b(fc|cf|afc|sc|cfc|ac|calcio|club|athletic|deportivo)\b/g, '')
            .replace(/[^a-z0-9\u0600-\u06FF]+/g, '')
            .trim();
    }

    // ★ إيجاد لاعبي النادي الحقيقي من صفوف ملف الهوية (player_interface_part_1.csv) بمرونة أكبر في المطابقة ★
    function matchClubPlayers(rows, clubName, clubId){
        const normTarget = normalizeClubName(clubName);

        let matched = rows.filter(row => {
            const rowName = row.name || row.player_name || '';
            if (!rowName.trim()) return false;
            const rowTeamId = row.club_id || row.team_id || '';
            if (rowTeamId && clubId && String(rowTeamId).trim() === String(clubId).trim()) return true;
            const rowClub = normalizeClubName(row.club_name || row.club || '');
            return normTarget && rowClub === normTarget;
        });

        // مطابقة تقريبية (احتواء) إذا لم يوجد تطابق تام في الاسم
        if (matched.length === 0 && normTarget) {
            matched = rows.filter(row => {
                const rowName = row.name || row.player_name || '';
                if (!rowName.trim()) return false;
                const rowClub = normalizeClubName(row.club_name || row.club || '');
                return rowClub && (rowClub.includes(normTarget) || normTarget.includes(rowClub));
            });
        }
        return matched;
    }

    function loadSquad(forceReload){
        const all = getSquadData();
        const storedPlayers = all[getClubName()] || [];

        if (!forceReload && storedPlayers.length > 0 && storedPlayers[0]?.skills) {
            players = storedPlayers;
            updatePlayersData();
            renderAll();
            return;
        }

        if (isLoading) return;
        isLoading = true;

        Promise.all([fetchIdentityRows(), fetchSkillsRows().catch(() => [])])
            .then(([identityRows, skillsRows]) => {
                if (!skillsNameIndex && skillsRows.length) {
                    skillsNameIndex = buildSkillsNameIndex(skillsRows);
                }
                const clubName = getClubName();
                const clubId = getClubId();

                const clubPlayers = matchClubPlayers(identityRows, clubName, clubId)
                    .map((row, idx) => extractPlayerData(row, idx, skillsNameIndex));

                if (clubPlayers.length > 0) {
                    clubPlayers.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                    const allData = getSquadData();
                    allData[clubName] = clubPlayers;
                    localStorage.setItem('signed_players_by_club', JSON.stringify(allData));
                    players = clubPlayers;
                    updatePlayersData();
                    renderAll();
                    if (typeof showToast === 'function') {
                        const withSkills = clubPlayers.filter(p => p.has_real_skills).length;
                        showToast(`<i class="fas fa-circle-check"></i> ${pt('extractedToast', clubPlayers.length, clubName, withSkills)}`);
                    }
                } else {
                    createDefaultTeam();
                    if (typeof showToast === 'function') {
                        showToast('<i class="fas fa-triangle-exclamation"></i> لم يُعثر على هذا النادي — اختر ناديك الحقيقي من القائمة أعلاه');
                    }
                }
                isLoading = false;
            })
            .catch(() => {
                createDefaultTeam();
                isLoading = false;
            });
    }

    function createDefaultTeam() {
        const club = getClubName();
        const defaultPlayers = generateDefaultSquad();
        const all = getSquadData();
        all[club] = defaultPlayers;
        localStorage.setItem('signed_players_by_club', JSON.stringify(all));
        players = defaultPlayers;
        updatePlayersData();
        renderAll();
        isLoading = false;
    }

    function generateDefaultSquad() {
        const positions = ['GK', 'CB', 'CB', 'LB', 'RB', 'CDM', 'CM', 'CM', 'CAM', 'LW', 'RW', 'ST', 'ST', 'CB', 'CM', 'LW', 'RW', 'CDM'];
        const firstNames = ['أحمد', 'محمد', 'علي', 'حسن', 'خالد', 'سعيد', 'عبدالله', 'فهد', 'نايف', 'سلطان', 'ماجد', 'ياسر', 'بدر', 'نواف', 'سالم', 'عمر', 'زيد', 'سعود'];
        const lastNames = ['الغامدي', 'الدوسري', 'القحطاني', 'الراجحي', 'العتيبي', 'المطيري', 'الشمري', 'الزهراني', 'الخالدي', 'القرني', 'البلوي', 'الحربي'];

        return positions.map((pos, i) => {
            const baseRating = 55 + ((i * 6 + pos.length * 2) % 30);
            const rating = Math.min(85, baseRating);
            const age = 19 + ((i * 5 + 2) % 15);
            const value = estimateMarketValue(rating, age, pos);
            
            // ★ توليد مهارات حسب المركز ★
            const skills = generateSkillsByPosition(pos, rating);

            return {
                name: firstNames[i % firstNames.length] + ' ' + lastNames[i % lastNames.length],
                nationality: 'Saudi Arabia',
                position: pos,
                rating: rating,
                age: age,
                market_value_eur: value,
                weekly_wage: 0,
                contract_until_ts: Date.now() + (1 + (i % 4)) * 365.25 * 24 * 3600 * 1000,
                last_renewal_ts: null,
                id: 'default_' + i,
                goals: 0,
                assists: 0,
                matches: 0,
                potential: Math.min(99, rating + (age < 24 ? 10 : 4)),
                team_id: '',
                club: getClubName(),
                jersey: i + 1,
                is_captain: i === 0,
                skills: skills,
                height: 175 + (i % 20),
                foot: i % 2 === 0 ? 'Right' : 'Left'
            };
        });
    }

    function updatePlayersData() {
        let changed = false;
        players.forEach((p, idx) => {
            const fair = fairWage(p);
            const cur = parseFloat(p.weekly_wage) || 0;
            if(!cur || cur > fair * 2.5 || cur < fair * 0.4) {
                p.weekly_wage = fair;
                changed = true;
            }
            if(!p.id) p.id = 'gen_' + idx + '_' + nameOf(p).replace(/\s+/g,'_');
            if(!p.contract_until_ts) { 
                p.contract_until_ts = Date.now() + 3 * 365.25 * 24 * 3600 * 1000; 
                changed = true; 
            }
            if(!p.nationality) p.nationality = 'Saudi Arabia';
            if(!p.position) p.position = 'CM';
            
            // ★ تحديث المهارات إذا كانت مفقودة ★
            if(!p.skills || Object.keys(p.skills).length === 0) {
                p.skills = generateSkillsByPosition(p.position, p.rating || 65);
                p.rating = calculateOverallFromSkills(p.skills, p.position);
                changed = true;
            }
            
            // ★ التحقق من صحة التقييم ★
            if(!p.rating || p.rating < 30 || p.rating > 99) {
                p.rating = calculateOverallFromSkills(p.skills, p.position);
                changed = true;
            }
            
            if(!p.age) p.age = 25;
            if(!p.market_value_eur || p.market_value_eur === 0) {
                p.market_value_eur = estimateMarketValue(p.rating || 65, p.age || 25, p.position || 'CM');
                changed = true;
            }
        });
        if(changed) saveSquad();
    }

    /* ============================================================
       عرض القائمة
       ============================================================ */
    function renderAll() {
        filteredPlayers = players.slice();
        checkPerformanceBonuses();
        renderSquad();
        renderHeaderStats();
        renderSquadIntel();
        fedRenderRestrictions();
    }

    function renderHeaderStats(){
        document.getElementById('clubNameDisplay').innerText = getClubName();
        document.getElementById('countDisplay').innerText = players.length;
        const totalVal = players.reduce((s,p) => s + marketValueEUR(p), 0);
        document.getElementById('totalMarketValue').innerText = fmtMoney(totalVal) + '€';
        const avg = players.length ? Math.round(players.reduce((s,p) => s + ratingOf(p), 0) / players.length) : 0;
        document.getElementById('avgRating').innerText = avg;
        const totalWage = players.reduce((s,p) => s + (parseFloat(p.weekly_wage) || 0), 0);
        document.getElementById('totalWage').innerText = fmtMoney(totalWage) + '€';
    }

    function ratingClass(r){ return r>=80?'rating-high':r>=68?'rating-mid':'rating-low'; }

    function formatContractRemaining(years){
        if (years <= 0) return '0 شهر';
        if (years < 1) return Math.max(1, Math.round(years * 12)) + ' شهر';
        return Math.round(years) + ' سنة';
    }

    function maxRenewalYears(age){
        if (age <= 23) return 6;
        if (age <= 27) return 5;
        if (age <= 30) return 4;
        if (age <= 33) return 2;
        return 1;
    }

    function clampRenewalYears(){
        if (activeIdx == null) return;
        const p = players[activeIdx];
        const max = maxRenewalYears(ageOf(p));
        const input = document.getElementById('editYears');
        let v = parseInt(input.value) || 1;
        if (v > max) v = max;
        if (v < 1) v = 1;
        input.value = v;
    }

    const POS_GROUP_I18N = {
        FWD: { ar:'خط الهجوم', en:'Forward Line', fr:'Ligne d\'attaque', es:'Línea de ataque', de:'Angriffslinie', pt:'Linha de ataque', tr:'Forvet Hattı' },
        MID: { ar:'خط الوسط', en:'Midfield Line', fr:'Ligne du milieu', es:'Línea del medio', de:'Mittelfeldlinie', pt:'Linha do meio', tr:'Orta Saha Hattı' },
        DEF: { ar:'خط الدفاع', en:'Defense Line', fr:'Ligne défensive', es:'Línea defensiva', de:'Verteidigungslinie', pt:'Linha defensiva', tr:'Defans Hattı' },
        GK: { ar:'حراس المرمى', en:'Goalkeepers', fr:'Gardiens de but', es:'Porteros', de:'Torhüter', pt:'Guarda-redes', tr:'Kaleciler' },
    };
    function pgLang() { return localStorage.getItem('gameLanguage') || 'ar'; }
    const POSITION_GROUPS = [
        { key:'FWD', get label(){ return POS_GROUP_I18N.FWD[pgLang()]; }, icon:'<i class="fas fa-bolt"></i>', positions:['LW','RW','ST','CF'] },
        { key:'MID', get label(){ return POS_GROUP_I18N.MID[pgLang()]; }, icon:'<i class="fas fa-gears"></i>', positions:['CDM','CM','CAM','LM','RM'] },
        { key:'DEF', get label(){ return POS_GROUP_I18N.DEF[pgLang()]; }, icon:'<i class="fas fa-shield-halved"></i>', positions:['CB','LB','RB','LWB','RWB'] },
        { key:'GK', get label(){ return POS_GROUP_I18N.GK[pgLang()]; }, icon:'<i class="fas fa-hand-fist"></i>', positions:['GK'] },
    ];
    function groupKeyForPosition(pos){
        for (const g of POSITION_GROUPS) if (g.positions.includes(pos)) return g.key;
        return 'MID'; // احتياط منطقي لأي مركز غير مصنَّف صراحة
    }

    function renderSquad(){
        const grid = document.getElementById('squadGrid');
        if(!players.length){
            grid.innerHTML = `<div class="empty-box">
                <i class="fas fa-shield"></i> قائمة ناديك فارغة حالياً.<br>
                توجّه إلى <a href="transfers.html">سوق الانتقالات</a> للتعاقد مع لاعبين.
            </div>`;
            return;
        }

        const groups = {};
        POSITION_GROUPS.forEach(g => groups[g.key] = []);
        players.forEach(p => { groups[groupKeyForPosition(posOf(p))].push(p); });
        POSITION_GROUPS.forEach(g => groups[g.key].sort((a,b) => ratingOf(b) - ratingOf(a)));

        grid.innerHTML = POSITION_GROUPS.map(g => {
            const list = groups[g.key];
            if (!list.length) return `<div class="pos-section"><div class="pos-section-title">${g.icon} ${g.label} <span class="pos-count">0</span></div><div class="pos-empty">${pt('emptyLine')}</div></div>`;
            return `<div class="pos-section">
                <div class="pos-section-title">${g.icon} ${g.label} <span class="pos-count">${list.length}</span></div>
                ${list.map(p => renderPlayerCard(p)).join('')}
            </div>`;
        }).join('');
    }

    function renderPlayerCard(p){
        const idx = players.indexOf(p);
        const r = ratingOf(p);
        const wage = parseFloat(p.weekly_wage) || 0;
        const fair = fairWage(p);
        const wageClass = wage > fair * 1.4 ? 'wage-high' : 'wage-fair';
        const contract = getContractStatus(p);
        const contractText = formatContractRemaining(contract.remaining);
        const nat = natOf(p);
        const status = getPlayerStatus(nat);
        const listed = isPlayerListed(p);
        const mInfo = moraleInfo(moraleOf(p));
        const injury = injuryOf(p);
        const contractDisplay = contract.isExpiring ?
            `<span style="color:var(--danger);">${contractText} <i class="fas fa-triangle-exclamation"></i></span>` :
            contract.canRenew ?
            `<span style="color:var(--warning);">${contractText} <i class="fas fa-rotate"></i></span>` :
            `${contractText}`;

        return `<div class="player-card ${injury?'player-card-injured':''}" onclick="openPlayer(${idx})">
            <div class="matrix-row">
                <div><span class="rating-oval ${ratingClass(r)}">${r}</span></div>
                <div><small>المركز</small><b>${posOf(p)}</b></div>
                <div style="align-items:flex-start;padding-right:6px;">
                    <span class="p-name"><span class="jersey-num">#${p.jersey || '-'}</span> ${nameOf(p)} <span class="morale-mini" style="color:${mInfo.color};" title="${mInfo.label}">${mInfo.icon}</span>${injury ? `<span class="injury-badge" title="${injury.type}"><i class="fas fa-kit-medical"></i> ${injury.remaining}ي</span>` : ''}</span>
                    <span class="p-nat">${flagImg(nat)} ${nat||'—'} ${listed ? '<span class="badge-sale"><i class="fas fa-tag"></i> للبيع</span>' : ''}</span>
                </div>
                <div class="${wageClass}"><small>أسبوعي</small><b>${fmtMoney(wage)}€</b></div>
                <div><small>القيمة</small><b>${fmtMoney(marketValueEUR(p))}€</b></div>
                <div><small>العمر</small><b>${ageOf(p)}</b></div>
                <div><small>العقد</small><b>${contractDisplay}</b></div>
            </div>
        </div>`;
    }

    // ============================================================
    // ذكاء واقعي حقيقي: تحليل فعلي لعمق التشكيلة، لا نص عام — يحسب من بيانات لاعبيك الحقيقيين فقط
    // ============================================================
    function renderSquadIntel(){
        const box = document.getElementById('squadIntelBox');
        if (!players.length) { box.innerHTML = ''; return; }

        const groups = {};
        POSITION_GROUPS.forEach(g => groups[g.key] = players.filter(p => groupKeyForPosition(posOf(p)) === g.key));

        const warnings = [];
        if (groups.GK.length < 2) warnings.push('<i class="fas fa-hand-fist"></i> نقص حقيقي في حراس المرمى — لديك أقل من حارسين بديلين.');

    function nameOf(p){ return p.name || p.player_name || p.player_display_name || p.long_name || 'لاعب'; }
    function natOf(p){ return p.nationality || p.nationality_id || p.country || ''; }
    function marketValueEUR(p){ return parseFloat(p.market_value_eur) || 0; }
    function ratingOf(p){ return parseInt(p.rating) || 65; }
    function ageOf(p){ return parseInt(p.age) || 25; }
    function posOf(p){ return p.position || p.main_position || '--'; }

    function fmtMoney(v){
        v = Math.round(v||0);
        if(v>=1e9) return (v/1e9).toFixed(v%1e9===0?0:1).replace(/\.0$/,'')+'B';
        if(v>=1e6) return (v/1e6).toFixed(v%1e6===0?0:1).replace(/\.0$/,'')+'M';
        if(v>=1e3) return Math.round(v/1e3)+'k';
        return v;
    }

    function fairWage(p){
        const mv = marketValueEUR(p);
        const rules = fedGetRules();
        const tierFactorMap = {1: 0.0045, 2: 0.0030, 3: 0.0020, 4: 0.0012};
        const tierFactor = tierFactorMap[rules.tier] || 0.0030;
        let wage = mv * tierFactor;

        const r = ratingOf(p);
        if(r>=85) wage*=1.35; else if(r>=80) wage*=1.20; else if(r>=75) wage*=1.08;
        else if(r<60) wage*=0.65; else if(r<65) wage*=0.80;

        const age = ageOf(p);
        if(age>=24 && age<=29) wage*=1.08;
        else if(age>=30 && age<=32) wage*=0.95;
        else if(age>32) wage*=0.78;
        else if(age<21) wage*=0.72;

        const annualCap = mv * 0.45;
        if(annualCap>0 && wage*52 > annualCap) wage = annualCap/52;

        const floorMap = {1: 5000, 2: 2500, 3: 1200, 4: 700};
        const floor = floorMap[rules.tier] || 1500;
        wage = Math.max(floor, wage);
        return Math.round(wage/100)*100;
    }
    function getContractStatus(p){
        const untilTs = p.contract_until_ts || (Date.now() + 3 * 365.25 * 24 * 3600 * 1000);
        const msRemaining = untilTs - Date.now();
        const remaining = Math.max(0, msRemaining / (365.25 * 24 * 3600 * 1000));
        const sinceTs = p.last_renewal_ts || (untilTs - 3 * 365.25 * 24 * 3600 * 1000);
        const total = Math.max(0.5, (untilTs - sinceTs) / (365.25 * 24 * 3600 * 1000));
        return {
            total: total,
            remaining: remaining,
            monthsRemaining: remaining * 12,
            untilTs: untilTs,
            isExpiring: remaining < 0.5,
            canRenew: remaining < 1 && remaining > 0
        };
    }

    function getTransferListed(){ return JSON.parse(localStorage.getItem('transferListed')) || []; }
    function saveTransferListed(list){ localStorage.setItem('transferListed', JSON.stringify(list)); }
    function isPlayerListed(p){
        return getTransferListed().some(x => x.name === nameOf(p) && x.club === getClubName());
    }

    // ============================================================
    // حالة الإصابة الحقيقية — نفس بيانات club_injuries المستخدمة بالضبط في medical.html
    // بدل تجاهل حالة اللاعب الصحية الفعلية هنا تماماً
    // ============================================================
    function getGameDate(){ return { day: parseInt(localStorage.getItem('game_day'))||1, month: parseInt(localStorage.getItem('game_month'))||9, year: parseInt(localStorage.getItem('game_year'))||2026 }; }
    function dateSortKey(d){ return d.year*10000+d.month*100+d.day; }
    function getClubInjuries(){ try { return JSON.parse(localStorage.getItem('club_injuries')) || []; } catch(e){ return []; } }
    function injuryOf(p){
        const injuries = getClubInjuries();
        const inj = injuries.find(x => String(x.tmid) === String(p.tmid) || x.playerName === nameOf(p));
        if (!inj) return null;
        const today = dateSortKey(getGameDate());
        const elapsed = Math.max(0, today - inj.occurredDateSort);
        const remaining = Math.max(0, Math.ceil(inj.totalDays - elapsed));
        return { ...inj, remaining };
    }

    function moraleOf(p){
        let m = 65;
        const wage = parseFloat(p.weekly_wage) || 0;
        const fair = fairWage(p);
        const ratio = fair > 0 ? wage / fair : 1;
        if (ratio >= 1.3) m += 15;
        else if (ratio >= 1.0) m += 8;
        else if (ratio >= 0.85) m += 0;
        else if (ratio >= 0.65) m -= 15;
        else m -= 30;

        const status = getContractStatus(p);
        if (status.isExpiring) m -= 12;
        else if (status.remaining > 3) m += 5;

        if (isPlayerListed(p)) m -= 20;

        const injury = injuryOf(p);
        if (injury) m -= Math.min(20, Math.round(injury.remaining / 3)); // إصابة طويلة تؤثر سلباً على معنوياته فعلياً

        const age = ageOf(p);
        if (age >= 32) m -= 5;
        if (p.is_captain) m += 8;

        return Math.max(5, Math.min(100, Math.round(m)));
    }

    function moraleInfo(m){
        const lang = localStorage.getItem('gameLanguage') || 'ar';
        const L = {
            veryHappy: {ar:'سعيد جداً ومندمج',en:'Very Happy & Settled',fr:'Très heureux et intégré',es:'Muy feliz e integrado',de:'Sehr zufrieden und integriert',pt:'Muito feliz e integrado',tr:'Çok Mutlu ve Uyumlu'},
            content: {ar:'راضٍ ومستقر',en:'Content & Stable',fr:'Satisfait et stable',es:'Contento y estable',de:'Zufrieden und stabil',pt:'Contente e estável',tr:'Memnun ve İstikrarlı'},
            neutral: {ar:'محايد',en:'Neutral',fr:'Neutre',es:'Neutral',de:'Neutral',pt:'Neutro',tr:'Nötr'},
            unhappy: {ar:'غير راضٍ',en:'Unhappy',fr:'Mécontent',es:'Descontento',de:'Unzufrieden',pt:'Descontente',tr:'Mutsuz'},
            angry: {ar:'غاضب ويطلب الرحيل',en:'Angry & Requesting Transfer',fr:'En colère et demande un transfert',es:'Enfadado y pide salir',de:'Wütend und fordert Wechsel',pt:'Zangado e pede transferência',tr:'Kızgın ve Transfer İstiyor'},
        };
        if (m >= 80) return { label: L.veryHappy[lang], icon: '<i class="fas fa-face-laugh-beam"></i>', color: 'var(--success)' };
        if (m >= 60) return { label: L.content[lang], icon: '<i class="fas fa-face-smile"></i>', color: 'var(--success)' };
        if (m >= 40) return { label: L.neutral[lang], icon: '<i class="fas fa-face-meh"></i>', color: 'var(--warning)' };

    function negotiateContract(p, offeredWage, years, bonus){
        const fair = fairWage(p);
        const ratio = offeredWage / fair;
        const status = getContractStatus(p);
        
        let acceptance = 0.5;
        if (ratio >= 1.2) acceptance += 0.30;
        else if (ratio >= 1.0) acceptance += 0.15;
        else if (ratio >= 0.85) acceptance += 0.05;
        else if (ratio >= 0.7) acceptance -= 0.10;
        else acceptance -= 0.30;
        
        const age = ageOf(p);
        if (age > 30 && years > 2) acceptance -= 0.15;
        else if (age > 30 && years <= 2) acceptance += 0.05;
        else if (age < 23 && years >= 3) acceptance += 0.10;
        
        const rating = ratingOf(p);
        if (rating >= 85 && ratio < 1.1) acceptance -= 0.20;
        else if (rating >= 80 && ratio < 1.0) acceptance -= 0.10;
        else if (rating < 70 && ratio >= 0.9) acceptance += 0.10;
        
        if (bonus > 0) {
            const bonusRatio = bonus / (fair * 52);
            acceptance += Math.min(0.15, bonusRatio * 0.5);
        }
        
        if (status.isExpiring) acceptance += 0.10;
        else if (!status.canRenew && !status.isExpiring) acceptance -= 0.30;

        const morale = moraleOf(p);
        acceptance += (morale - 50) / 250;

        acceptance = Math.max(0, Math.min(1, acceptance));

        return {
            accepted: acceptance >= 0.6,
            acceptanceRate: Math.round(acceptance * 100),
            message: acceptance >= 0.6 ? '<i class="fas fa-circle-check"></i> وافق اللاعب!' : acceptance >= 0.4 ? '<i class="fas fa-hourglass-half"></i> اللاعب متردد. حاول تحسين العرض.' : '<i class="fas fa-circle-xmark"></i> رفض اللاعب العرض.'
        };
    }

            });
            
            html += `</div>`;
        });

        container.innerHTML = html;
    }

    function renderContract(p){
        const wage = parseFloat(p.weekly_wage) || 0;
        const fair = fairWage(p);
        const status = getContractStatus(p);
        const morale = moraleOf(p);
        const mInfo = moraleInfo(morale);
        const untilDate = new Date(status.untilTs);
        const untilStr = untilDate.toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' });
        const lastRenewalStr = p.last_renewal_ts ? new Date(p.last_renewal_ts).toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' }) : 'غير معروف (عقد أصلي)';
        document.getElementById('contractDetails').innerHTML = `
            <div class="stat-row"><span>الراتب الأسبوعي الحالي</span><b>${fmtMoney(wage)}€</b></div>
            <div class="stat-row"><span>الأجر السنوي</span><b>${fmtMoney(wage * 52)}€</b></div>
            <div class="stat-row"><span>الراتب العادل</span><b style="color:var(--gold)">${fmtMoney(fair)}€</b></div>
            <div class="stat-row"><span>تاريخ انتهاء العقد الفعلي</span><b>${untilStr}</b></div>
            <div class="stat-row"><span>آخر تجديد للعقد</span><b>${lastRenewalStr}</b></div>
            <div class="stat-row"><span>المتبقي من العقد</span><b>${formatContractRemaining(status.remaining)}</b></div>
            <div class="stat-row"><span>الحالة المعنوية</span><div class="bar"><div class="fill ${morale>=60?'high':morale>=40?'mid':'low'}" style="width:${morale}%"></div></div><b style="color:${mInfo.color}">${mInfo.icon} ${morale}</b></div>
            ${p.height ? `<div class="stat-row"><span>${pt('heightLbl')}</span><b>${p.height} ${pt('cmUnit')}</b></div>` : ''}
            ${p.weight ? `<div class="stat-row"><span>${pt('weightLbl')}</span><b>${p.weight} ${pt('kgUnit')}</b></div>` : ''}
            ${p.foot ? `<div class="stat-row"><span>${pt('footLbl')}</span><b>${p.foot === 'Right' ? pt('rightFoot')+' <i class="fas fa-shoe-prints"></i>' : pt('leftFoot')+' <i class="fas fa-shoe-prints"></i>'}</b></div>` : ''}
        `;
    }

    function checkWageFairness(){
        if(activeIdx == null) return;
        const p = players[activeIdx];
        const val = parseFloat(document.getElementById('editWage').value) || 0;
        const fair = fairWage(p);
        const hint = document.getElementById('wageFairHint');
        if(val > fair * 1.4){ 
            hint.style.color = 'var(--danger)'; 
            hint.innerText = pt('wageHigh', fmtMoney(fair)); 
        } else if(val < fair * 0.85){ 
            hint.style.color = 'var(--warning)'; 
            hint.innerText = pt('wageRejectRisk', fmtMoney(fair)); 
        } else { 
            hint.style.color = 'var(--success)'; 
            hint.innerText = pt('wageFair', fmtMoney(fair)); 
        }
    }

    const SQUAD_AGENTS = [
        { name: 'وكالة الأفق الرياضي', tone: 'متعاون ويرى أن العرض عادل ما دام قريباً من قيمة السوق.' },
        { name: 'مجموعة النخبة للإدارة', tone: 'يدافع بشدة عن مصلحة لاعبه ويرفض أي عرض أقل من قيمته الحقيقية.' },
        { name: 'الوكيل المستقل مراد حلمي', tone: 'عملي ويهتم بضمان مدة عقد طويلة تحمي مستقبل لاعبه.' },
        { name: 'شركة القمة للتمثيل', tone: 'حريص على مكافآت الأداء أكثر من الراتب الأساسي نفسه.' }
    ];

    function squadAgentFor(p){
        const seed = String(nameOf(p)).split('').reduce((s,c)=>s+c.charCodeAt(0),0);
        return SQUAD_AGENTS[seed % SQUAD_AGENTS.length];
    }

    function attemptRenewal(){
        if(activeIdx == null) return;
        const p = players[activeIdx];
        const status = getContractStatus(p);
        
        if (!status.canRenew && !status.isExpiring) {
            showToast('ليس وقت تجديد العقد!', '#aa3e2e');
            return;
        }
        
        const offeredWage = parseFloat(document.getElementById('editWage').value) || fairWage(p);
        const maxYears = maxRenewalYears(ageOf(p));
        let years = parseInt(document.getElementById('editYears').value) || Math.min(3, maxYears);
        years = Math.max(1, Math.min(maxYears, years));
        document.getElementById('editYears').value = years;
        const bonus = parseFloat(document.getElementById('editBonus').value) || 0;
        
        const negotiation = negotiateContract(p, offeredWage, years, bonus);
        
        const resultDiv = document.getElementById('negotiationResult');
        resultDiv.style.display = 'block';
        resultDiv.style.background = negotiation.accepted ? 'rgba(0,255,136,0.1)' : 'rgba(255,51,102,0.1)';
        resultDiv.style.border = negotiation.accepted ? '1px solid var(--success)' : '1px solid var(--danger)';
        resultDiv.style.color = negotiation.accepted ? 'var(--success)' : 'var(--danger)';
        const agent = squadAgentFor(p);
        resultDiv.innerHTML = `${negotiation.message} (${pt('acceptanceRateLbl', negotiation.acceptanceRate)})`
            + `<div style="margin-top:8px;font-size:0.72rem;color:var(--text-muted);border-top:1px solid rgba(255,255,255,.08);padding-top:6px;">`
            + `<i class="fas fa-user-tie"></i> <b>${agent.name}:</b> ${agent.tone}</div>`;
        
        if (negotiation.accepted) {
            p.weekly_wage = offeredWage;
            p.contract_until_ts = Date.now() + years * 365.25 * 24 * 3600 * 1000;
            p.last_renewal_ts = Date.now();

            const oldValue = marketValueEUR(p);
            const valueFactor = 1 + (years - 3) * 0.05;
            const fairVal = fairWage(p);
            const wageFactor = 1 + (offeredWage / fairVal - 1) * 0.2;
            let newValue = oldValue * valueFactor * wageFactor;
            if (bonus > 0) newValue += bonus * 0.3;
            p.market_value_eur = Math.round(newValue);
            
            if (p.release_clause) {
                p.release_clause = Math.round(p.release_clause * (newValue / oldValue));
            }
            
            saveSquad();
            loadSquad();
            closeModals();
            showToast(pt('renewedToast', nameOf(p), new Date(p.contract_until_ts).toLocaleDateString(localStorage.getItem('gameLanguage')==='ar'?'ar-EG':'en-GB')));
        }
    }

    function listForTransfer(){
        if(activeIdx == null) return;
        const p = players[activeIdx];
        if (isPlayerListed(p)) { unlistFromTransfer(); return; }

        let list = getTransferListed();
        list.push({
            name: nameOf(p), club: getClubName(), position: posOf(p), pos: posOf(p),
            value: marketValueEUR(p), val: marketValueEUR(p), age: ageOf(p),
            nationality: natOf(p), wage: parseFloat(p.weekly_wage) || 0,
            skills: p.skills || {}
        });
        saveTransferListed(list);
        showToast(`<i class="fas fa-tag"></i> ${nameOf(p)} ${pt('nowListedToast')}`);
        renderAll();
        openPlayer(activeIdx);
    }

    function unlistFromTransfer(){
        if(activeIdx == null) return;
        const p = players[activeIdx];
        const list = getTransferListed().filter(x => !(x.name === nameOf(p) && x.club === getClubName()));
        saveTransferListed(list);
        showToast(`↩️ ${pt('withdrawnToast', nameOf(p))}`);
        renderAll();
        openPlayer(activeIdx);
    }
    
    function releasePlayer(){
        if(activeIdx == null) return;
        const p = players[activeIdx];
        if(!confirm(pt('releaseConfirm', nameOf(p)))) return;
        saveTransferListed(getTransferListed().filter(x => !(x.name === nameOf(p) && x.club === getClubName())));
        players.splice(activeIdx, 1);
        saveSquad();
        loadSquad();
        closeModals();
        showToast(pt('releasedToast', nameOf(p)));
    }

    function switchModalTab(t){
        document.querySelectorAll('.modal-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
        document.querySelectorAll('.modal-section').forEach(s => s.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
    }
    
    function closeModals(){ 
        document.getElementById('controlModal').style.display = 'none'; 
        activeIdx = null; 
    }
    
    function showToast(msg, bgColor){ 
        const t = document.createElement('div'); 
        t.className = 'toast-msg'; 
        t.innerHTML = msg; 
        if(bgColor) t.style.background = bgColor;
        document.body.appendChild(t); 
        setTimeout(() => t.remove(), 3000); 
    }
