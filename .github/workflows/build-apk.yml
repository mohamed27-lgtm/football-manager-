name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Add Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name football_manager --org com.footballmanager --platforms=android /tmp/shell
            cp -r /tmp/shell/android ./android
          fi

      - name: Allow internet access in the manifest
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="مدرب كرة القدم"', s, count=1)
          p.write_text(s, encoding='utf-8')
          EOF

      - run: flutter pub get

      - name: Analyze (log only)
        shell: bash
        run: |
          mkdir -p logs
          flutter analyze --no-pub > logs/analyze.txt 2>&1 || true
          tail -n 300 logs/analyze.txt

      - name: Build APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs
          flutter build apk --release 2>&1 | tee logs/build_full.log

      - name: Save logs to ci-logs branch
        if: always()
        shell: bash
        run: |
          tail -n 400 logs/build_full.log > logs/build_tail.log 2>/dev/null || true
          rm -f logs/build_full.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f logs
          git commit -m "ci logs for ${GITHUB_SHA::7}: build ${{ steps.build.outcome }}"
          git push -f origin HEAD:ci-logs

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk football_manager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: football_manager-apk
          path: football_manager.apk

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "Latest APK" --notes "Auto-built APK (debug-signed, for testing)"
          gh release upload apk-latest football_manager.apk --clobber
