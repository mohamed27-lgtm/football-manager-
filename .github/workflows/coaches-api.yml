name: Fetch coaches (API-Football)

# يسحب مدربي الأندية الناقصين تدريجياً بميزانية صغيرة يومياً (قبل مشروع الاستيراد)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: import-data
  cancel-in-progress: false

jobs:
  coaches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch coaches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          COACH_BUDGET: '70'
        run: python3 tools/fetch_coaches_api.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coaches_api.json || true
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: coaches $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
