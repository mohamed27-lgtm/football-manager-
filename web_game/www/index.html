<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Manager | البوابة الذكية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Cairo', system-ui, sans-serif;
            height: 100vh;
            background: radial-gradient(circle at 30% 10%, #0a0f1e, #02050c);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية كروية متحركة */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.08"><circle cx="50" cy="50" r="20" stroke="cyan" stroke-width="0.8" fill="none"/><polygon points="50,30 55,45 70,45 58,55 62,70 50,60 38,70 42,55 30,45 45,45" stroke="cyan" fill="none" stroke-width="0.6"/></svg>');
            background-repeat: repeat;
            background-size: 55px;
            pointer-events: none;
        }

        .splash-screen {
            text-align: center;
            animation: fadeInScale 0.8s ease-out forwards;
            transition: opacity 1s ease;
            position: relative;
            z-index: 10;
        }

        .splash-screen.fade-out {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .football-icon {
            font-size: 85px;
            color: white;
            background: linear-gradient(145deg, #1f2b3c, #0a0f18);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), 0 0 0 5px rgba(0,200,255,0.2);
            animation: ballPulse 1.2s infinite alternate;
        }

        @keyframes ballPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 3px rgba(0,200,255,0.3);}
            100% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(0,200,255,0.1);}
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #6ec8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 1.1rem;
            color: #bbd9ff;
            margin-top: 12px;
            border-right: 2px solid cyan;
            padding-right: 14px;
            display: inline-block;
        }

        .loading-progress {
            width: 200px;
            height: 3px;
            background: rgba(0,200,255,0.3);
            border-radius: 10px;
            margin: 30px auto 0;
            overflow: hidden;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: cyan;
            animation: loadWidth 2.5s ease forwards;
        }

        @keyframes loadWidth {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .hint {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #7e91b5;
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="football-icon">
            <i class="fas fa-futbol"></i>
        </div>
        <h1>FOOTBALL MANAGER</h1>
        <div class="tagline"><i class="fas fa-chart-line"></i> القيادة الذكية • الموسم 2026</div>
        <div class="loading-progress">
            <div class="loading-bar"></div>
        </div>
        <div class="hint">
            <i class="fas fa-magic"></i> يتم تجهيز غرفة القيادة ...
        </div>
    </div>

    <script>
        // الانتقال التلقائي بعد 3 ثوانٍ مع تأثير fade أنيق
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            splash.classList.add('fade-out');
            // بعد انتهاء الفيد، ننتقل إلى clubs.html
            setTimeout(() => {
                window.location.href = "clubs.html";
            }, 1000); // مدة الفيد 1 ثانية كافية
        }, 2800); // 2.8 ثانية ثم الفيد
    </script>
</body>
</html>
