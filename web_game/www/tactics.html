<script>
/* ============================================================
   بيانات مشتركة مع بقية اللعبة
   ============================================================ */
function getClubName(){ return localStorage.getItem('presidentialClub') || 'نادي المستقبل'; }
function getSignedPlayersByClub(){ return JSON.parse(localStorage.getItem('signed_players_by_club')) || {}; }
function getSquad(){ return getSignedPlayersByClub()[getClubName()] || []; }

/* ============================================================
   ★★★ نظام التوافق التكتيكي والكيمياء (Tactical Familiarity & Chemistry) ★★★
   كل هوية تكتيكية حقيقية (مأخوذة من الأسلوب الفعلي للمدرب المتعاقَد معه)
   تحتاج مهارات لاعب حقيقية مختلفة — وليس كل اللاعبين يناسبونها بنفس القدر.
   ============================================================ */
const TACTIC_PROFILES = {
    gegenpressing: { name: 'الضغط العكسي (Gegenpressing)', skills: ['stamina','acceleration','physical','tackling'] },
    tikitaka:      { name: 'تيكي تاكا (Tiki-Taka)',          skills: ['short_passing','vision','ball_control'] },
    counter:       { name: 'الهجوم المرتد (Counter-Attack)', skills: ['pace','acceleration','sprint_speed','finishing'] },
    catenaccio:    { name: 'الكاتيناتشيو (Catenaccio)',       skills: ['defending','tackling','positioning','physical'] }
};

// يحدد الهوية التكتيكية الحقيقية من نص "الأسلوب التكتيكي" الفعلي للمدرب (من قائمة_المدربين2026.csv)
function detectCoachTacticIdentity(styleText) {
    const s = (styleText || '').toLowerCase();
    if (s.includes('gegenpress')) return 'gegenpressing';
    if (s.includes('tiki-taka') || s.includes('tiki taka') || s.includes('positional control') || s.includes('possession') || s.includes('juego de posici')) return 'tikitaka';
    if (s.includes('catenaccio') || s.includes('low block') || s.includes('defensive block') || s.includes('tactical rigor') || s.includes('compact defensive')) return 'catenaccio';
    if (s.includes('counter-attack') || s.includes('counter attack') || s.includes('explosive') || s.includes('direct') || s.includes('fast break') || s.includes('rapid counter')) return 'counter';
    return null; // أسلوب غير مصنَّف ضمن الأربع الهويات الرئيسية => محايد بلا بونص أو خصم
}

function getHeadCoach() {
    const staff = JSON.parse(localStorage.getItem('staff_by_club')||'{}')[getClubName()] || [];
    return staff.find(s => s.role === 'head_coach') || null;
}
function getCoachTacticIdentity() {
    const coach = getHeadCoach();
    return coach ? detectCoachTacticIdentity(coach.tacticalStyleRaw || coach.style || '') : null;
}

// نسبة توافق مهارات لاعب معيّن مع الهوية التكتيكية الحالية (1.0 = محايد، >1 = يناسبها، <1 = لا يناسبها)
function playerTacticFit(p, tacticKey) {
    if (!tacticKey || !p.skills) return 1.0;
    const profile = TACTIC_PROFILES[tacticKey];
    const relevant = profile.skills.map(sk => p.skills[sk]).filter(v => v != null && !isNaN(v));
    if (!relevant.length) return 1.0;
    const avgRelevant = relevant.reduce((a,b)=>a+b,0) / relevant.length;
    const overall = playerRating(p);
    const gap = avgRelevant - overall; // موجب = اللاعب أقوى في هذه المهارات تحديداً من مستواه العام
    if (gap >= 6) return 1.08;
    if (gap >= 3) return 1.04;
    if (gap <= -10) return 0.90;
    if (gap <= -5) return 0.95;
    return 1.0;
}

// معامل المعنويات الحقيقي (من نفس نظام السمعة/الروح المعنوية للنادي، بدل رقم ثابت)
function moraleFactorOf(p) {
    const morale = parseFloat(localStorage.getItem('clubMorale')) || 70;
    return 0.85 + (morale/100) * 0.3; // نطاق واقعي 0.85 - 1.15
}

// المهارة الفعلية أثناء المباراة = المهارة الأساسية × بونص/خصم التكتيك × معامل المعنويات
function effectiveSkill(baseSkillValue, tacticMultiplier, morale) {
    return baseSkillValue * tacticMultiplier * morale;
}

/* ============================================================
   تعليمات المراكز الفردية (Individual Player Instructions)
   تُغيّر أي المهارات يُحتكم إليها فعلياً لهذا اللاعب في هذا المركز
   ============================================================ */
const INDIVIDUAL_ROLES = {
    inverted_wingback: { appliesTo: ['LB','RB'], name:'ظهير هجومي مقلوب', skills: ['long_passing','vision','short_passing'] },
    false_nine:        { appliesTo: ['ST','CF'], name:'مهاجم وهمي (False 9)', skills: ['dribbling','short_passing','vision'] }
};
function getIndividualRoleSkills(basePos, roleKey) {
    const role = INDIVIDUAL_ROLES[roleKey];
    if (role && role.appliesTo.includes(basePos)) return role.skills;
    return null;
}
// يقترح تلقائياً دوراً فردياً للاعب إن كانت مهاراته المرتبطة بذلك الدور أعلى وضوحاً من مهاراته العامة
function suggestIndividualRole(p, basePos) {
    if (!p.skills) return null;
    for (const roleKey in INDIVIDUAL_ROLES) {
        const role = INDIVIDUAL_ROLES[roleKey];
        if (!role.appliesTo.includes(basePos)) continue;
        const relevant = role.skills.map(sk => p.skills[sk]).filter(v => v != null && !isNaN(v));
        if (!relevant.length) continue;
        const avgRelevant = relevant.reduce((a,b)=>a+b,0) / relevant.length;
        if (avgRelevant - playerRating(p) >= 5) return roleKey; // يتفوق فعلياً في مهارات هذا الدور تحديداً
    }
    return null;
}
// تقييم اللاعب الفعّال في مركزه (يأخذ بعين الاعتبار الدور الفردي إن اختير، وإلا مهاراته الأساسية حسب مركزه)
function effectiveRatingInRole(p, basePos, roleKey, tacticKey) {
    const roleSkills = roleKey ? getIndividualRoleSkills(basePos, roleKey) : null;
    const base = roleSkills && p.skills
        ? roleSkills.map(sk => p.skills[sk]).filter(v=>v!=null).reduce((a,b,_,arr)=>a+b/arr.length,0)
        : playerRating(p);
    const tacticMult = playerTacticFit(p, tacticKey);
    const morale = moraleFactorOf(p);
    return Math.round(effectiveSkill(base, tacticMult, morale));
}

function getPlayerAttribute(p, attrName) {
    const base = playerRating(p);
    const seed = seedHash(String(playerId(p)) + '|' + attrName);
    const bias = (POSITION_ATTR_BIAS[playerPos(p)] || {})[attrName] || 0;
    const variance = (seed % 15) - 7; // ثابت لكل لاعب/صفة (-7..+7)، وليس عشوائياً بين كل تحديث
    return Math.max(25, Math.min(99, Math.round(base + bias + variance)));
}

/* ============================================================

   مع الهوية التكتيكية، بغض النظر عن مركزه الافتراضي
   ============================================================ */
const INDIVIDUAL_INSTRUCTIONS = {
    inverted_wingback: { label:'ظهير مقلوب (Inverted Wingback)', appliesTo:['LB','RB'], overrideAttrs:['long_passing','vision'] },
    false_nine:        { label:'مهاجم وهمي (False 9)',           appliesTo:['ST','CF'], overrideAttrs:['dribbling','short_passing'] }

function getPlayerInstructionsMap() {

// نسبة توافق لاعب واحد مع الهوية التكتيكية الحالية (0.90 - 1.10 تقريباً، أي ±10%)
function playerTacticalFit(p, slotIndex, style) {
    const instrKey = getPlayerInstructionsMap()[slotIndex];
    const instr = instrKey ? INDIVIDUAL_INSTRUCTIONS[instrKey] : null;
    const attrsToUse = instr ? instr.overrideAttrs : style.keyAttrs;
    const avg = attrsToUse.reduce((s,a) => s + getPlayerAttribute(p, a), 0) / attrsToUse.length;
    return 0.90 + (avg / 99) * 0.20; // كل نقطة أعلى في الصفات المطلوبة = أداء فعلي أعلى، والعكس صحيح
}

};
POSITION_SKILL_WEIGHTS['LM'] = POSITION_SKILL_WEIGHTS['LW'];
POSITION_SKILL_WEIGHTS['RM'] = POSITION_SKILL_WEIGHTS['RW'];
POSITION_SKILL_WEIGHTS['LWB'] = POSITION_SKILL_WEIGHTS['LB'];
POSITION_SKILL_WEIGHTS['RWB'] = POSITION_SKILL_WEIGHTS['RB'];
const ALL_SKILLS_LOCAL = ['pace','shooting','passing','dribbling','defending','physical','crossing','finishing','heading',
    'short_passing','volleys','dribbling_skill','curve','fk_accuracy','long_passing','ball_control','acceleration',
    'sprint_speed','agility','reactions','balance','shot_power','jumping','stamina','strength','tackling','positioning',
    'vision','diving','handling','kicking','reflexes'];
function skillSeedRandom(playerKey, skillKey) {
    let h = 0;
    const s = String(playerKey) + '|' + skillKey;
    for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
    return (h % 1000) / 1000;
}
function generateSkillFromPosition(skill, position, baseRating, playerKey) {
    const posConfig = POSITION_SKILL_WEIGHTS[position] || POSITION_SKILL_WEIGHTS['CM'];
    const rnd = skillSeedRandom(playerKey || (position+'_'+baseRating), skill);
    if (posConfig.primary && posConfig.primary.includes(skill)) return Math.min(99, Math.max(30, baseRating + Math.floor(rnd*8) - 2));
    if (posConfig.secondary && posConfig.secondary.includes(skill)) return Math.min(95, Math.max(25, baseRating - 4 + Math.floor(rnd*6)));
    if (posConfig.ignore && posConfig.ignore.includes(skill)) return Math.min(70, Math.max(15, baseRating - 18 + Math.floor(rnd*10)));
    return Math.min(85, Math.max(20, baseRating - 10 + Math.floor(rnd*12)));
}
function attachSkillsToSquad(list) {
    list.forEach(p => {
        if (p.skills) return;
        const pos = playerPos(p), rating = playerRating(p), key = playerId(p);
        const skills = {};
        ALL_SKILLS_LOCAL.forEach(sk => { skills[sk] = generateSkillFromPosition(sk, pos, rating, key); });
        p.skills = skills;
    });
    return list;
}

function selectFormation(f){
    if (f === currentFormation) return;
    // نحافظ على اللاعبين الذين تسمح مراكزهم بالبقاء قدر الإمكان بدل تفريغ التشكيلة بالكامل
    const oldSlots = FORMATIONS[currentFormation];
    const oldAssigned = lineup.map((id,i)=> id ? {id, pos:oldSlots[i].pos} : null).filter(Boolean);
    currentFormation = f;
    const newSlots = FORMATIONS[f];
    lineup = new Array(newSlots.length).fill(null);
    const used = new Set();
    newSlots.forEach((slot, i) => {
        let best = null, bestScore = 0;
        oldAssigned.forEach(entry => {
            if (used.has(entry.id)) return;
            const p = squad.find(pl => playerId(pl)===entry.id);
            if (!p) return;
            const score = fitScore(slot.pos, playerPos(p));
            if (score > bestScore) { bestScore = score; best = entry.id; }
        });
        if (best && bestScore >= 0.4){ lineup[i] = best; used.add(best); }
    });
    renderFormationChips();
    renderPitch();
    renderLists();
    renderStrength();
}

                </div>
                <div class="pname">${playerName(p)}</div>
                <div class="ppos">${slot.pos} · <span style="color:${conditionColor(cond)}">${cond}%</span></div>
                ${roleTag}`;
        } else {
            el.innerHTML = `<div class="chip"><i class="fas fa-plus"></i></div><div class="pname">فارغ</div><div class="ppos">${slot.pos}</div>`;
        }
        pitch.appendChild(el);
    });
}

/* ============================================================
   العرض: قوائم الأساسيين والاحتياط
   ============================================================ */
function rowHtml(p, num, posLabel){
    const cond = conditionOf(p);
    const grp = posGroup(playerPos(p));
    const tacticKey = getCoachTacticIdentity();
    const fit = playerTacticFit(p, tacticKey);
    const fitDot = tacticKey ? `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${fit>=1.04?'var(--success)':fit<=0.95?'var(--danger)':'#666'};margin-left:4px;" title="التوافق مع أسلوب المدرب"></span>` : '';
    return `<div class="prow" onclick="openPlayerCard('${playerId(p)}')">
        <div class="pn">${num||''}</div>
        <div class="ppill ${grp==='gk'?'':''}" style="background:var(--${grp});">${posLabel||playerPos(p)}</div>
        <div class="pname2">${playerName(p)} ${p.is_captain?'<span class="pcap">(C)</span>':''}${fitDot}</div>
        <div class="page2">${p.age||'-'}</div>
        <div class="pcond"><i style="width:${cond}%; background:${conditionColor(cond)};"></i></div>
        <div class="prat">${playerRating(p)}</div>
    </div>`;
}
function renderLists(){
    const slots = FORMATIONS[currentFormation];
    const starterIds = lineup.filter(Boolean);
    document.getElementById('startersCount').textContent = starterIds.length;

    let startersHtml = '';
    slots.forEach((slot, i) => {
        const pid = lineup[i];
        const p = pid ? squad.find(pl => playerId(pl)===pid) : null;
        if (p) startersHtml += rowHtml(p, i+1, slot.pos);
    });
    document.getElementById('startersList').innerHTML = startersHtml || `<div class="empty-list-note">لم يتم اختيار أي أساسي بعد — انقر على الملعب أعلاه لتعيين اللاعبين.</div>`;

    const benchPlayers = squad.filter(p => !starterIds.includes(playerId(p)));
    document.getElementById('benchList').innerHTML = benchPlayers.length
        ? benchPlayers.sort((a,b)=>playerRating(b)-playerRating(a)).map(p => rowHtml(p, '', playerPos(p))).join('')
        : `<div class="empty-list-note">لا يوجد لاعبون إضافيون في القائمة حالياً.</div>`;
}
function openPlayerCard(id){
    const p = squad.find(pl => playerId(pl)===id);
    if (!p) return;
    showToast(`${playerName(p)} · ${playerPos(p)} · تقييم ${playerRating(p)} · لياقة ${conditionOf(p)}%`);
}

/* ============================================================
   العرض: بطاقة قوة التشكيلة
   ============================================================ */
function renderStrength(){
    const slots = FORMATIONS[currentFormation];
    const starters = lineup.map((id,i) => id ? {p: squad.find(pl=>playerId(pl)===id), slot: slots[i]} : null).filter(Boolean);
    if (starters.length === 0){
        document.getElementById('strAvg').textContent='--';
        document.getElementById('strFit').textContent='--';
        document.getElementById('strStyle').textContent='--';
        document.getElementById('strOverall').textContent='--';
        return;
    }
    const tacticKey = getCoachTacticIdentity();
    const avgRating = starters.reduce((s,x)=>s+playerRating(x.p),0)/starters.length;
    const avgFit = starters.reduce((s,x)=>s+fitScore(x.slot.pos, playerPos(x.p)),0)/starters.length;
    const style = STYLES.find(s=>s.key===currentStyle);
    const styleMatches = starters.filter(x => style.bestWith.includes(playerPos(x.p))).length;
    const styleSynergy = styleMatches / 11;
    // متوسط توافق كل لاعب أساسي مع الهوية التكتيكية الحقيقية للمدرب الرئيسي (إن وُجد)
    const avgTacticFit = starters.reduce((s,x)=>s+playerTacticFit(x.p, tacticKey),0)/starters.length;
    const morale = 0.85 + ((parseFloat(localStorage.getItem('clubMorale'))||70)/100)*0.3;
    const overall = avgRating * (0.65 + 0.35*avgFit) * (0.92 + 0.08*styleSynergy) * avgTacticFit * morale * (starters.length/11);

    document.getElementById('strAvg').textContent = avgRating.toFixed(1);
    document.getElementById('strFit').textContent = Math.round(avgFit*100)+'%';
    document.getElementById('strStyle').textContent = Math.round(styleSynergy*100)+'%';
    document.getElementById('strOverall').textContent = Math.round(overall);

    const tacticEl = document.getElementById('strTactic');
    if (tacticEl) {
        if (!tacticKey) { tacticEl.textContent = 'بدون مدرب رئيسي بهوية واضحة'; }
        else {
            const pct = Math.round(avgTacticFit*100);
            tacticEl.textContent = `${TACTIC_PROFILES[tacticKey].name} — توافق الفريق ${pct}%`;
            tacticEl.style.color = pct >= 102 ? 'var(--success)' : pct <= 96 ? 'var(--danger)' : 'var(--dim)';
        }
    }
}

function renderHeader(){
    document.getElementById('headerSub').textContent = `${getClubName()} — ${squad.length} لاعباً في القائمة`;
}

function renderAll(){
    renderHeader();
    renderFormationChips();
    renderStyleGrid();
    renderPitch();
    renderLists();
    renderStrength();
}

/* ============================================================
   مودال اختيار لاعب لمركز معيّن (نقر خانة بالملعب)
   ============================================================ */
function openPickModal(slotIndex){
    pickingSlotIndex = slotIndex;
    const slot = FORMATIONS[currentFormation][slotIndex];
    document.getElementById('pickTitle').textContent = `اختر لاعباً لمركز ${slot.pos}`;
    document.getElementById('pickSub').textContent = FORMATION_LABELS[slot.pos] || '';

    const currentId = lineup[slotIndex];
    const currentP = currentId ? squad.find(p=>playerId(p)===currentId) : null;
    document.getElementById('pickNote').innerHTML = currentP
        ? `اللاعب الحالي: <b>${playerName(currentP)}</b>. اختر لاعباً آخر لتبديله معه، أو انقر عليه أدناه لإزالته من الملعب.`
        : `هذه الخانة فارغة — اختر لاعباً من القائمة لوضعه هنا.`;

    // نرتّب اللاعبين حسب مدى ملاءمتهم الفعلية لهذا المركز تحديداً (الأنسب أولاً)
    const ranked = squad.slice().sort((a,b) => {
        const fa = fitScore(slot.pos, playerPos(a)), fb = fitScore(slot.pos, playerPos(b));
        if (fb !== fa) return fb - fa;
        return playerRating(b) - playerRating(a);
    });

    document.getElementById('pickList').innerHTML = ranked.map(p => {
        const pid = playerId(p);
        const inLineupAt = lineup.indexOf(pid);
        const fit = fitScore(slot.pos, playerPos(p));
        const fitLabel = fit>=0.9 ? '<span style="color:var(--success);font-size:0.62rem;">مثالي</span>'
                        : fit>=0.5 ? '<span style="color:var(--warning);font-size:0.62rem;">مقبول</span>'
                        : '<span style="color:var(--danger);font-size:0.62rem;">غير مناسب</span>';
        const statusTag = inLineupAt === slotIndex ? ' <span style="color:var(--gold);font-size:0.62rem;">(هنا حالياً)</span>'
                         : inLineupAt !== -1 ? ' <span style="color:var(--dim);font-size:0.62rem;">(أساسي آخر)</span>' : '';
        return `<div class="prow" onclick="assignPlayerToSlot('${pid}')">
            <div class="ppill" style="background:var(--${posGroup(playerPos(p))});">${playerPos(p)}</div>
            <div class="pname2">${playerName(p)}${statusTag}</div>
            <div class="page2">${p.age||'-'}</div>
            <div class="prat">${playerRating(p)}</div>
            <div style="width:52px; text-align:center;">${fitLabel}</div>
        </div>`;
    }).join('');

    openModal('pickModal');
}

function assignPlayerToSlot(pid){
    if (pickingSlotIndex == null) return;
    const targetSlot = pickingSlotIndex;
    const existingAt = lineup.indexOf(pid);
    const wasAtTarget = lineup[targetSlot];

    if (existingAt === targetSlot){
        // نقر اللاعب الحالي نفسه: إزالته من الملعب
        lineup[targetSlot] = null;
    } else if (existingAt !== -1){
        // اللاعب أساسي في خانة أخرى بالفعل: تبديل مكانه مع صاحب هذه الخانة (Swap)
        lineup[existingAt] = wasAtTarget || null;
        lineup[targetSlot] = pid;
    } else {
        lineup[targetSlot] = pid;
    }

    closeModal('pickModal');
    renderPitch();
    renderLists();
    renderStrength();
}

/* ============================================================
   أفضل تشكيلة تلقائياً — اختيار جشع (Greedy) حسب الأنسب فعلياً
   ============================================================ */
function autoFillBest(silent){
    const slots = FORMATIONS[currentFormation];
    const order = slots.map((s,i)=>i).sort((a,b) => {
        // نملأ المراكز الأكثر تخصصاً أولاً (حارس المرمى، ثم الدفاع...) لتفادي حجز الأنسب لمركز عام لاحقاً
        const specificity = { GK:0, CB:1, LB:1, RB:1, CDM:2, CM:3, CAM:3, LW:4, RW:4, ST:5, CF:5 };
        return (specificity[slots[a].pos]??3) - (specificity[slots[b].pos]??3);
    });
    const used = new Set();
    const newLineup = new Array(slots.length).fill(null);
    order.forEach(i => {
        const slot = slots[i];
        let best = null, bestScore = -1;
        squad.forEach(p => {
            const pid = playerId(p);
            if (used.has(pid)) return;
            const score = fitScore(slot.pos, playerPos(p)) * playerRating(p);
            if (score > bestScore){ bestScore = score; best = pid; }
        });
        if (best){ newLineup[i] = best; used.add(best); }
    });
    lineup = newLineup;
    renderPitch();
    renderLists();
    renderStrength();
    if (!silent) showToast('✅ تم اختيار أفضل تشكيلة متاحة تلقائياً حسب مستوى ومراكز لاعبيك.');
}

function clearLineup(){
    if (!confirm('تفريغ كل الملعب من اللاعبين الحاليين؟')) return;
    lineup = new Array(FORMATIONS[currentFormation].length).fill(null);
    renderPitch();
    renderLists();
    renderStrength();
}

/* ============================================================
   التهيئة
   ============================================================ */
function init(){
    loadTactics();
    renderAll();
}
document.getElementById('pickModal').addEventListener('click', function(e){ if (e.target === this) closeModal('pickModal'); });
document.addEventListener('DOMContentLoaded', init);
</script>
