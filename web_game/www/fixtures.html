    <style>
        :root {
            --bg: #090f1d;

        html[data-theme="light"] {

            --card: #ffffff;
            --border: #e2e5ec;
            --text: #151a24;
            --muted: #6b7385;
            --gold: #8a6b28;

            --red: #dc2626;

        }
        

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; min-height: 100vh; gap: 12px; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .page-header-right { display: flex; align-items: center; gap: 8px; }
        .page-header h2 { font-size: 14px; color: var(--text); font-weight: 600; }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .filter-trigger-btn { background: none; border: none; color: var(--text); font-size: 16px; cursor: pointer; padding: 4px; transition: color 0.2s; }

        .filter-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: flex-end; }
        .filter-content { width: 75%; max-width: 300px; background: #0c1322; height: 100%; border-right: 1px solid var(--border); display: flex; flex-direction: column; animation: slideIn 0.25s ease-out; }

    <script>
        let activeUserClub = localStorage.getItem('presidentialClub') || "Chelsea";
// ============================================================
// Session Guard (Save Slot)
// - يضمن أن بيانات IndexedDB/المباريات الودية ترتبط بحفظة واحدة فقط
// - عند (لعبة جديدة) يجب تغيير game_session_id لمسح/فصل البيانات القديمة
// ============================================================
function getGameSessionId() {
    let sid = localStorage.getItem('game_session_id');
    if (!sid) {
        sid = 'S' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
        localStorage.setItem('game_session_id', sid);
    }
    return sid;
}
const GAME_SESSION_ID = getGameSessionId();

        let currentLeagueName = localStorage.getItem('current_league_name') || "Premier League";
        let currentLeagueTeams = [];
        
        // نظام الجلب الديناميكي لقراءة أندية الدوري الحالي (بما فيها الفرق الصاعدة)
        try {
            let storedTeams = localStorage.getItem('current_league_teams');
            if (storedTeams) currentLeagueTeams = JSON.parse(storedTeams).filter(t => t !== "إستراحة" && t.trim() !== "");
        } catch(e) { console.error("خطأ في قراءة الأندية الصاعدة والديناميكية:", e); }

        // أندية افتراضية للحماية في حال لم يجد بيانات مخزنة
        if (currentLeagueTeams.length === 0) {
            currentLeagueTeams = [activeUserClub, "Arsenal", "Man City", "Liverpool", "Man United", "Tottenham", "Aston Villa", "Newcastle"];
        }

        // جلب أسماء الكؤوس الفرعية ديناميكياً من التخزين حسب الدولة الحالية
        let realCupName = localStorage.getItem('current_cup_name') || "كأس المسابقة المحلية";
        let realSuperCupName = localStorage.getItem('current_super_cup_name') || "كأس السوبر المحلي";

        let currentBrowsingClub = activeUserClub;

        // ميكانيكية تحديد فترات وجدولة الكؤوس الإقصائية وسط أسابيع الدوري
        let r32Round = 4;
        let r16Round = 12;
        let qfRound = 20;
        let sfRound = 28;
        let finalCupRound = (currentLeagueTeams.length - 1) * 2 - 2; 

        let currentRound = parseInt(localStorage.getItem('database_current_round')) || 0;
        let nextMatchStage = localStorage.getItem('database_next_stage') || "super";
        let cupTournamentData = JSON.parse(localStorage.getItem('database_cup_data')) || null;
        let superCupData = JSON.parse(localStorage.getItem('database_super_cup_data')) || null;

        // ============================================================
        // محرك التقويم الحقيقي: ربط كل جولة وكل مباراة بتاريخ فعلي
        // متزامن مع محرك الوقت في game_main.html (game_day/month/year)
        // ============================================================
        const gameNow = {
            day: parseInt(localStorage.getItem('game_day') || '1'),
            month: parseInt(localStorage.getItem('game_month') || '6'),
            year: parseInt(localStorage.getItem('game_year') || '2026')
        };
        // نفس مسار شعارات الأندية الحقيقي المستخدم بالضبط عبر بقية اللعبة (stadium.html, medical.html...)
        function getTeamLogoUrl(t) { return `teams_logos/${(t||'').trim()}.png`; }
        // شعارات البطولات الحقيقية — تُطابَق حسب اسم/نوع البطولة الفعلي
        const COMPETITION_LOGOS = {
            'دوري أبطال أوروبا': 'comp_logos/ucl.png', 'دوري أبطال آسيا': 'comp_logos/acl.png',
            'كأس السوبر': 'comp_logos/super_cup.png', 'الدوري المحلي': 'comp_logos/league.png',
        };
        function getCompetitionLogoUrl(name) {
            for (const key in COMPETITION_LOGOS) if (name && name.includes(key)) return COMPETITION_LOGOS[key];
            return 'comp_logos/generic_cup.png';
        }
        function pad(n) { return n < 10 ? '0' + n : n; }
        function fmtDate(d) { return `${pad(d.day)}/${pad(d.month)}/${d.year}`; }

        // تحويل التاريخ (object) إلى Date حقيقي للتعامل مع اليوم/الساعة
        function toJSDate(d) {
            return new Date(d.year, (d.month - 1), d.day, 0, 0, 0, 0);
        }
        function fromJSDate(dt) {
            return { day: dt.getDate(), month: dt.getMonth() + 1, year: dt.getFullYear(), _js: dt };
        }

        // format DM/Y لــ Date
        function formatDMY(dt) {
            const dd = String(dt.getDate()).padStart(2, '0');
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const yy = dt.getFullYear();
            return `${dd}/${mm}/${yy}`;
        }

        // مفتاح ترتيب يدعم وجود وقت (Date) أو object
        function dateSortKey(x) {
            if (!x) return 0;
            if (x instanceof Date) return x.getTime();
            return (x.year * 10000 + x.month * 100 + x.day);
        }

        // إضافة أيام تدعم object أو Date
        function addDaysToDate(base, days) {
            if (base instanceof Date) {
                const dt = new Date(base.getTime());
                dt.setDate(dt.getDate() + (days || 0));
                return dt;
            }
            let d = { ...base };
            for (let i = 0; i < (days || 0); i++) {
                d.day++;
                let daysInMonth = 30;
                if ([1,3,5,7,8,10,12].includes(d.month)) daysInMonth = 31;
                else if (d.month === 2) daysInMonth = (d.year % 4 === 0) ? 29 : 28;
                if (d.day > daysInMonth) { d.day = 1; d.month++; }
                if (d.month > 12) { d.month = 1; d.year++; }
            }
            // دعم الأيام السالبة عند الحاجة
            for (let i = 0; i < Math.abs(Math.min(0, days || 0)); i++) {
                d.day--;
                if (d.day < 1) {
                    d.month--;
                    if (d.month < 1) { d.month = 12; d.year--; }
                    let daysInMonth = 30;
                    if ([1,3,5,7,8,10,12].includes(d.month)) daysInMonth = 31;
                    else if (d.month === 2) daysInMonth = (d.year % 4 === 0) ? 29 : 28;
                    d.day = daysInMonth;
                }
            }
            return d;
        }

        // بداية الموسم: 15 أغسطس، محسوبة تلقائياً بحيث تسبق تاريخ اليوم الحالي للعبة
        const seasonStartYear = (gameNow.month >= 8) ? gameNow.year : gameNow.year - 1;
        const SEASON_START = { day: 15, month: 8, year: seasonStartYear };
        function roundDate(roundNum) {
            const base = addDaysToDate(SEASON_START, (roundNum - 1) * 7);
            // نرجع object كما كان سابقاً (لأجزاء الصفحة الأخرى)، لكن مع إضافة نسخة Date داخلية
            if (base instanceof Date) return fromJSDate(base);
            return { ...base, _js: toJSDate(base) };
        }
        function parseDMY(str) {
            const [d, m, y] = (str || '').split('/').map(n => parseInt(n));
            return { day: d || 1, month: m || 1, year: y || seasonStartYear };
        }

        // توليد مباريات الدوري ذهاب وإياب بنظام التدوير الكامل
        function generateDoubleRoundRobin(teams) {
            let schedule = [];
            let pool = [...teams];
            if (pool.length % 2 !== 0) pool.push("إستراحة");
            let totalTeams = pool.length;
            let roundsCount = totalTeams - 1;
            let matchesPerRound = totalTeams / 2;

            for (let round = 0; round < roundsCount; round++) {
                let roundMatches = [];
                for (let i = 0; i < matchesPerRound; i++) {
                    let home = pool[i]; let away = pool[totalTeams - 1 - i];
                    if (home === "إستراحة" || away === "إستراحة") continue;
                    if (round % 2 === 1) { let tmp = home; home = away; away = tmp; }
                    roundMatches.push({ home: home, away: away, type: "league", stageKey: "league", roundNum: round + 1, title: `الدوري - جولة ${round + 1}` });
                }
                schedule.push(roundMatches);
                pool.splice(1, 0, pool.pop());
            }
            let firstHalfLength = schedule.length;
            for (let round = 0; round < firstHalfLength; round++) {
                let roundMatches = [];
                schedule[round].forEach(m => {
                    roundMatches.push({ home: m.away, away: m.home, type: "league", stageKey: "league", roundNum: round + 1 + firstHalfLength, title: `الدوري - جولة ${round + 1 + firstHalfLength}` });
                });
                schedule.push(roundMatches);
            }
            return schedule;
        }

        // =============================
        // 🗓️ مواعيد واقعية للمباريات (اليوم + الساعة)
        // - الدوري: نهاية الأسبوع (الجمعة/السبت/الأحد) مع توزيع تلقائي على أوقات مختلفة
        // - الكأس: منتصف الأسبوع غالباً (الثلاثاء/الأربعاء/الخميس)
        // - السوبر: افتتاح الموسم (غالباً مساء الجمعة/السبت)
        // =============================

        function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

        function minutesToLabel(mins) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            const hh = String(h).padStart(2, '0');
            const mm = String(m).padStart(2, '0');
            return `${hh}:${mm}`;
        }

        // يبني وقت انطلاق “واقعي” حسب نوع المباراة مع توزيع بسيط لتفادي التكدّس
        function getRealisticKickoffForMatch({ baseDate, type, roundOrder, home, away, matchIdx, totalMatchesInRound }) {
            // baseDate عندنا غالباً object (day/month/year) من roundDate، أو Date حقيقي
            let dt;
            if (baseDate instanceof Date) dt = new Date(baseDate.getTime());
            else if (baseDate && baseDate._js instanceof Date) dt = new Date(baseDate._js.getTime());
            else if (baseDate && typeof baseDate.year === 'number') dt = toJSDate(baseDate);
            else dt = new Date();

            let dayOffsets;
            if (type === 'league') dayOffsets = [0, 1, -1];            // سبت/أحد/جمعة (حول تاريخ الجولة)
            else if (type === 'cup') dayOffsets = [0, -1, 1];          // أربعاء/ثلاثاء/خميس تقريباً
            else if (type === 'super') dayOffsets = [0, -1, 1];        // سبت/جمعة/أحد
            else dayOffsets = [0];

            const timeSlots = (type === 'league')
                ? [15 * 60, 17 * 60 + 30, 20 * 60]                       // 15:00 / 17:30 / 20:00
                : (type === 'cup')
                    ? [18 * 60, 20 * 60 + 15, 21 * 60]                   // 18:00 / 20:15 / 21:00
                    : [19 * 60 + 30, 21 * 60];                           // 19:30 / 21:00

            const str = `${type}|${roundOrder}|${home}|${away}`;
            let seed = 0;
            for (let i = 0; i < str.length; i++) seed = (seed * 31 + str.charCodeAt(i)) >>> 0;

            const dayPick = dayOffsets[seed % dayOffsets.length];
            const slotPick = timeSlots[(seed + (matchIdx || 0)) % timeSlots.length];

            const spread = clamp(totalMatchesInRound || 1, 1, 20);
            const extra = ((seed % spread) * 15) % 60; // 0/15/30/45

            dt.setHours(0, 0, 0, 0);
            const shifted = addDaysToDate(dt, dayPick); // يرجع Date
            const mins = slotPick + extra;
            shifted.setHours(Math.floor(mins / 60), mins % 60, 0, 0);

            const label = `${formatDMY(shifted)} • ${minutesToLabel(mins)}`;
            return { dateObj: shifted, label };
        }

        const fullLeagueSchedule = generateDoubleRoundRobin(currentLeagueTeams);

        async function renderFixturesAndStats() {
            document.getElementById('browsingClubLabel').innerText = currentBrowsingClub + (currentBrowsingClub === activeUserClub ? " (فريقك الحالي)" : "");
            
            let stats = { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, pts: 0 };
            const container = document.getElementById('fixturesDynamicContainer');
            container.innerHTML = "";

            let timeline = [];

            // 1. حقن مباراة السوبر المحلي الافتتاحية إن وجدت
            if (superCupData) {
                const superKick = getRealisticKickoffForMatch({
                    baseDate: addDaysToDate(SEASON_START, -7),
                    type: "super",
                    roundOrder: 0,
                    home: superCupData.t1,
                    away: superCupData.t2,
                    matchIdx: 0,
                    totalMatchesInRound: 1
                });

                timeline.push({
                    roundOrder: 0, stageKey: "super", type: "super", title: realSuperCupName,
                    home: superCupData.t1, away: superCupData.t2,
                    hScore: superCupData.s1, aScore: superCupData.s2, played: superCupData.played,
                    sortKey: dateSortKey(superKick.dateObj),
                    kickoffLabel: superKick.label
                });
            }

            // 2. بناء الأجندة الزمنية للدوري وحقن أدوار الكأس بداخلها
            fullLeagueSchedule.forEach((roundMatches, idx) => {
                let rNum = idx + 1;
                roundMatches.forEach(m => {
                    let hScore = null; let aScore = null; let isPlayed = rNum <= currentRound;
                    if (isPlayed) {
                        hScore = Math.floor(Math.random() * 3);
                        aScore = Math.floor(Math.random() * 3);
                        if (m.home === activeUserClub || m.away === activeUserClub) {
                            let savedScores = JSON.parse(localStorage.getItem('full_season_scores')) || [];
                            let found = savedScores.find(s => s.roundIdx === idx);
                            if (found) { hScore = found.homeScore; aScore = found.awayScore; }
                        }
                    }

                    // موعد واقعي: الدوري غالباً في نهاية الأسبوع، وتوزيع المباريات عبر الجمعة/السبت/الأحد
                    // (محليّاً: فرق نفس الجولة تتوزع لتفادي “كلها في نفس الدقيقة”)
                    const leagueKick = getRealisticKickoffForMatch({
                        baseDate: roundDate(rNum),
                        type: "league",
                        roundOrder: rNum,
                        home: m.home,
                        away: m.away,
                        matchIdx: (m.matchIdx ?? 0),
                        totalMatchesInRound: (roundMatches.length || 1)
                    });

                    timeline.push({
                        roundOrder: rNum, stageKey: "league", type: "league", title: `الدوري - الجولة ${rNum}`,
                        home: m.home, away: m.away, hScore: hScore, aScore: aScore, played: isPlayed,
                        sortKey: dateSortKey(leagueKick.dateObj),
                        kickoffLabel: leagueKick.label
                    });
                });

                // جدولة أدوار الكأس المحلي بالتوازي مع أسابيع الموسم
                if (rNum === r32Round) insertCupRoundToTimeline(timeline, "r32", `دور الـ 32 - ${realCupName}`, "cup_r32", rNum);
                if (rNum === r16Round) insertCupRoundToTimeline(timeline, "r16", `ثمن النهائي (دور 16) - ${realCupName}`, "cup_r16", rNum);
                if (rNum === qfRound) insertCupRoundToTimeline(timeline, "qf", `ربع النهائي (دور 8) - ${realCupName}`, "cup_qf", rNum);
                if (rNum === sfRound) insertCupRoundToTimeline(timeline, "sf", `نصف النهائي - ${realCupName}`, "cup_sf", rNum);
                if (rNum === finalCupRound) insertCupRoundToTimeline(timeline, "final", `المباراة النهائية الكبرى 🏆 - ${realCupName}`, "cup_final", rNum);
            });

            let filteredTimeline = timeline.filter(item => item.home === currentBrowsingClub || item.away === currentBrowsingClub);

            // حقن المباريات الودية الرسمية المرتّبة عبر صفحة "المباريات الودية"
            // (تظهر فقط عند تصفح فريق الرئاسة نفسه، لأنها بيانات خاصة بناديك)
            if (currentBrowsingClub === activeUserClub) {
                try {
                    await clubDB.init();
                    const upcomingFriendlies = (await clubDB.getAllUpcomingMatches()).filter(m => m.competition === "ودية" && (m.ownerClub === undefined || m.ownerClub === activeUserClub) && (m.sessionId === undefined || m.sessionId === GAME_SESSION_ID));
                    const playedFriendlies = (await clubDB.getAllFriendlyMatches()).filter(m => (m.ownerClub === undefined || m.ownerClub === activeUserClub) && (m.sessionId === undefined || m.sessionId === GAME_SESSION_ID));

                    upcomingFriendlies.forEach(m => {
                        const isHomeVenue = m.venue !== "away";
                        filteredTimeline.push({
                            type: "friendly", stageKey: "friendly_" + m.id,
                            title: `مباراة ودية رسمية`,
                            home: isHomeVenue ? currentBrowsingClub : m.opponent,
                            away: isHomeVenue ? m.opponent : currentBrowsingClub,
                            hScore: null, aScore: null, played: false,
                            friendlyDate: m.date, friendlyId: m.id,
                            sortKey: m.dateSort || dateSortKey(parseDMY(m.date))
                        });
                    });

                    playedFriendlies.forEach(m => {
                        const isHomeVenue = m.venue !== "away";
                        let [myScore, theirScore] = (m.result || "0-0").split("-").map(n => parseInt(n));
                        if (isNaN(myScore)) myScore = 0; if (isNaN(theirScore)) theirScore = 0;
                        filteredTimeline.push({
                            type: "friendly", stageKey: "friendly_played_" + (m.id || Math.random()),
                            title: `مباراة ودية رسمية`,
                            home: isHomeVenue ? currentBrowsingClub : m.opponent,
                            away: isHomeVenue ? m.opponent : currentBrowsingClub,
                            hScore: isHomeVenue ? myScore : theirScore,
                            aScore: isHomeVenue ? theirScore : myScore,
                            played: true, friendlyDate: m.date,
                            sortKey: dateSortKey(parseDMY(m.date))
                        });
                    });
                } catch (e) {
                    console.warn("تعذر تحميل المباريات الودية من قاعدة البيانات:", e);
                }
            }

            // ترتيب زمني حقيقي كامل: من أقدم مباراة إلى أحدثها حسب التقويم الفعلي للموسم
            filteredTimeline.sort((a, b) => (a.sortKey || 0) - (b.sortKey || 0));

            if (filteredTimeline.length === 0) {
                container.innerHTML = `<div class="empty-state">لا توجد مباريات مجدولة لهذا النادي حالياً.</div>`;
                return;
            }

            filteredTimeline.forEach(match => {
                let isPlayed = match.played;
                let scoreSpace = `<span class="vs-sign">VS</span>`;
                let rowClass = "highlighted-match";
                let phaseBadge = `<span class="round-phase phase-league">الدوري</span>`;
                
                if (match.type === "cup") phaseBadge = `<span class="round-phase phase-cup">الكأس المحلي</span>`;
                if (match.type === "super") phaseBadge = `<span class="round-phase phase-super">السوبر</span>`;
                if (match.type === "friendly") phaseBadge = `<span class="round-phase phase-friendly">ودية</span>`;

                // احتساب الإحصائيات الشاملة وإصلاح قراءة الأهداف بشكل صحيح وديناميكي
                if (isPlayed && match.hScore !== null) {
                    let isHome = match.home === currentBrowsingClub;
                    let myScore = isHome ? match.hScore : match.aScore;
                    let theirScore = isHome ? match.aScore : match.hScore;

                    stats.played += 1; 
                    stats.gf += myScore; 
                    stats.ga += theirScore;

                    if (myScore > theirScore) { stats.wins += 1; if(match.type === "league") stats.pts += 3; }
                    else if (myScore === theirScore) { stats.draws += 1; if(match.type === "league") stats.pts += 1; }
                    else { stats.losses += 1; }

                    let scoreStyle = "final-score";
                    if (match.home === currentBrowsingClub && match.hScore > match.aScore) scoreStyle += " win";
                    if (match.away === currentBrowsingClub && match.aScore > match.hScore) scoreStyle += " win";
                    scoreSpace = `<span class="${scoreStyle}">${match.hScore} - ${match.aScore}</span>`;
                } else {
                    let isNext = false;
                    if (nextMatchStage === match.stageKey) isNext = true;
                    if (nextMatchStage === "league" && match.type === "league" && match.roundOrder === (currentRound + 1)) isNext = true;

                    if (isNext && currentBrowsingClub === activeUserClub) {
                        rowClass = "next-to-play";
                        scoreSpace = `<span class="live-sign">🔴 قريباً</span>`;
                    }
                }

                let homeActive = (match.home === currentBrowsingClub) ? "active-browsing" : "";
                let awayActive = (match.away === currentBrowsingClub) ? "active-browsing" : "";

                container.innerHTML += `
                    <div class="round-container ${rowClass}" onclick="handleMatchClick('${match.stageKey}', ${match.played}, '${match.type}')">
                        <div class="week-header">
                            <span><img class="comp-logo" src="${getCompetitionLogoUrl(match.title)}" onerror="this.style.display='none';">${match.title}</span>
                            ${phaseBadge}
                        </div>
                        <div class="match-row">
                            <div class="match-main">
                                <div class="match-team home ${homeActive}">
                                    <span>${match.home}</span>
                                    <div class="team-logo"><img src="${getTeamLogoUrl(match.home)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-shield-alt\\'></i>';"></div>
                                </div>
                                <div class="match-score-space">${scoreSpace}</div>
                                <div class="match-team away ${awayActive}">
                                    <div class="team-logo"><img src="${getTeamLogoUrl(match.away)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-shield-alt\\'></i>';"></div>
                                    <span>${match.away}</span>
                                </div>
                            </div>
                            <div class="match-time-bar">
                                <span class="match-tournament-tag">${match.type === 'league' ? currentLeagueName : match.type === 'friendly' ? 'مباراة ودية' : 'بطولة إقصائية'}</span>
                                ${match.friendlyDate ? `<span class="match-date-tag"><i class="fas fa-calendar-day"></i> ${match.friendlyDate}</span>` : ''}
                                ${match.kickoffLabel ? `<span class="match-date-tag"><i class="fas fa-clock"></i> ${match.kickoffLabel}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            // طباعة الإحصائيات في الشريط العلوي الملون
            document.getElementById('stat-played').innerText = stats.played;
            document.getElementById('stat-wins').innerText = stats.wins;
            document.getElementById('stat-draws').innerText = stats.draws;
            document.getElementById('stat-losses').innerText = stats.losses;
            document.getElementById('stat-gf').innerText = stats.gf;
            document.getElementById('stat-ga').innerText = stats.ga;
            let diff = stats.gf - stats.ga;
            document.getElementById('stat-gd').innerText = diff >= 0 ? `+${diff}` : diff;
            document.getElementById('stat-pts').innerText = stats.pts;
        }

        // دالة مساعدة لحقن مباريات أدوار الكأس من التخزين المحلي
        function insertCupRoundToTimeline(timeline, cupKey, roundTitle, stageKey, rNum) {
            if (!cupTournamentData) return;
            let matches = [];
            if (cupKey === "final") matches = [cupTournamentData.final];
            else matches = cupTournamentData[cupKey] || [];

            matches.forEach((m, i) => {
                if (m && m.t1) {
                    let played = m.s1 !== null;

                    const cupKick = getRealisticKickoffForMatch({
                        baseDate: addDaysToDate(roundDate(rNum), 3),
                        type: "cup",
                        roundOrder: rNum,
                        home: m.t1,
                        away: m.t2,
                        matchIdx: i,
                        totalMatchesInRound: (matches.length || 1)
                    });

                    timeline.push({
                        roundOrder: 99, stageKey: stageKey, type: "cup", title: roundTitle,
                        home: m.t1, away: m.t2, hScore: m.s1, aScore: m.s2, played: played,
                        sortKey: dateSortKey(cupKick.dateObj),
                        kickoffLabel: cupKick.label
                    });
                }
            });
        }

        function handleMatchClick(stageKey, isPlayed, matchType) {
            if (isPlayed) return;
            if (currentBrowsingClub !== activeUserClub) return;
            if (matchType === "friendly") {
                window.location.href = "friendly_matches.html";
                return;
            }
            if (nextMatchStage === stageKey || (nextMatchStage === "league" && stageKey === "league")) {
                window.location.href = "match_day.html";
            }
        }

        function openFilterDrawer() {
            const listContainer = document.getElementById('filterTeamsListContainer');
            listContainer.innerHTML = "";
            currentLeagueTeams.forEach(team => {
                let activeClass = (team === currentBrowsingClub) ? "active" : "";
                listContainer.innerHTML += `
                    <div class="filter-team-item ${activeClass}" onclick="selectClubToBrowse('${team}')">
                        <div class="team-logo" style="width:22px;height:22px;"><img src="${getTeamLogoUrl(team)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-shield-alt\\'></i>';"></div>
                        <span>${team}</span>
                    </div>
                `;
            });
            document.getElementById('filterDrawer').style.display = 'flex';
        }

        function closeFilterDrawer() { document.getElementById('filterDrawer').style.display = 'none'; }
        async function selectClubToBrowse(teamName) { currentBrowsingClub = teamName; closeFilterDrawer(); await renderFixturesAndStats(); }

        window.onload = async function() {
            await renderFixturesAndStats();
        };
    </script>
</body>
</html>
