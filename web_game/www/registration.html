<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

<style>

  .page-header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:12px 14px;border-radius:10px;border:1px solid var(--border);gap:10px;flex-wrap:wrap;}

  .page-header h2{font-size:15px;font-weight:700;}
  .page-header .sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .back-btn{background:var(--border);color:#fff;border:none;padding:8px 12px;font-size:12px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .header-links{display:flex;gap:8px;flex-wrap:wrap;}
  .link-btn{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.28);color:#93c5fd;padding:7px 12px;font-size:11px;border-radius:8px;text-decoration:none;font-weight:600;}

  .rules-panel{background:linear-gradient(150deg,#15203a,#0c1322);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .rules-panel .rp-head{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .rule-cell{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 12px;}
  .rule-cell .rc-top{display:flex;justify-content:space-between;align-items:baseline;}
  .rule-cell .rc-lbl{font-size:11px;color:var(--muted);}
  .rule-cell .rc-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
  .rule-cell .rc-val.ok{color:var(--green);} .rule-cell .rc-val.warn{color:var(--amber);} .rule-cell .rc-val.bad{color:var(--red);}
  .rule-cell .rc-bar{height:6px;background:var(--border);border-radius:20px;margin-top:8px;overflow:hidden;}
  .rule-cell .rc-fill{height:100%;border-radius:20px;transition:width .6s var(--ease);}
  .rule-cell .rc-fill.ok{background:var(--green);} .rule-cell .rc-fill.warn{background:var(--amber);} .rule-cell .rc-fill.bad{background:var(--red);}

  .window-note{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:8px;}

  .window-note.blocked{color:#fecaca;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.06);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}

  .reg-list{display:flex;flex-direction:column;gap:10px;}

</style>

    if(!iso || iso.length!==2) return '🌍';
    const A=0x1F1E6;

    if(iso && SPECIAL[iso]) return SPECIAL[iso];
    if(!iso){
        const arabicIso = {'السعودية':'sa','مصر':'eg','المغرب':'ma','إسبانيا':'es','إنجلترا':'gb-eng','فرنسا':'fr','إيطاليا':'it','ألمانيا':'de','اليابان':'jp','البرازيل':'br','الأرجنتين':'ar','البرتغال':'pt','هولندا':'nl','بلجيكا':'be','كرواتيا':'hr','النرويج':'no','كندا':'ca','نيجيريا':'ng'}[String(nat).trim()];
        if(arabicIso) return SPECIAL[arabicIso] || isoToEmoji(arabicIso);
        return '🏳️';
    }
    return isoToEmoji(iso);
}

/* ============================================================
   ★ تصنيف اللاعبين: محلي / إقليمي / أجنبي ★
   ============================================================ */
function getPlayerStatus(nat){
    if(!nat) return {type:'unknown', label:'غير معروف', badge:''};
    const natLower = String(nat).trim().toLowerCase();
    const homeLower = String(HOME).trim().toLowerCase();
    if(natLower===homeLower || String(nat).trim()===HOME_AR){
        return {type:'home', label:'محلي', badge:'<span class="tag local">🏠 محلي</span>'};
    }
    const rules = getRules();
    const natConf = confederationOf(nat);
    if(natConf && rules.confederation && natConf===rules.confederation){
        return {type:'regional', label:'إقليمي', badge:'<span class="tag regional">🌐 إقليمي</span>'};
    }
    return {type:'foreign', label:'أجنبي', badge:'<span class="tag foreign">🛫 أجنبي</span>'};
}
function isFullForeign(nat){ return getPlayerStatus(nat).type === 'foreign'; }
function isRegional(nat){ return getPlayerStatus(nat).type === 'regional'; }

/* ============================================================
   دوال البيانات
   ============================================================ */
function getRules(){ return JSON.parse(localStorage.getItem('federationRules')) || {tier:1,squadMax:25,foreignMax:7,homegrownMin:0,wageCapPct:70,minStadium:12000,tierLabel:'الدرجة الأولى (الممتاز)',confederationLabel:'الاتحاد الآسيوي (AFC)',confederation:'AFC'}; }
function getBudget(){ return parseFloat(localStorage.getItem('clubBudget')) || 150.0; }
function getSigned(){ const a=JSON.parse(localStorage.getItem('signed_players_by_club'))||{}; return a[CLUB]||[]; }
function setSigned(list){ const a=JSON.parse(localStorage.getItem('signed_players_by_club'))||{}; a[CLUB]=list; localStorage.setItem('signed_players_by_club',JSON.stringify(a)); }
function getPending(){ const a=JSON.parse(localStorage.getItem('pending_registration_by_club'))||{}; return a[CLUB]||[]; }
function setPending(list){ const a=JSON.parse(localStorage.getItem('pending_registration_by_club'))||{}; a[CLUB]=list; localStorage.setItem('pending_registration_by_club',JSON.stringify(a)); }
function inbox(sender,text){ const i=JSON.parse(localStorage.getItem('gameInbox'))||[]; i.unshift({sender,text,time:new Date().toLocaleTimeString('ar-EG'),read:false}); localStorage.setItem('gameInbox',JSON.stringify(i)); localStorage.setItem('hasNewMessage','true'); }
function gameMonth(){ return parseInt(localStorage.getItem('game_month')||'6'); }
function windowOpen(){ const m=gameMonth(); return (m>=6&&m<=8)||m===1; }
function fedBlocked(){ return localStorage.getItem('clubRegistrationBlocked')==='true'; }

/* FFP */
function ffpWith(extraWeekly){
  const wk=getSigned().reduce((s,p)=>s+(parseFloat(p.weekly_wage)||0),0)+(extraWeekly||0);
  const annual=wk*52/1000000; const b=getBudget();
  return b<=0?100:Math.round(annual/b*100);
}
function ovrClass(o){ return o>=88?'elite':o>=83?'good':'avg'; }

/* ============================================================
   ★ دالة مساعدة للحصول على اسم اللاعب (تدعم كلا التنسيقين) ★
   ============================================================ */
function getPlayerName(p) {
    return p.player_name || p.name || 'لاعب';
}

function getPlayerPosition(p) {
    return p.main_position || p.position || '-';
}

function getPlayerRating(p) {
    return p.rating || p.overall || 50;
}

function getPlayerAge(p) {
    return p.age || '-';
}

function getPlayerClub(p) {
    return p.fromClub || p.club || '-';
}

function getPlayerFee(p) {
    return p.fee || p.transferFee || 0;
}

function getPlayerId(p) {
    return p.tmid || p.id || 'unknown';
}

function getPlayerMarketValue(p) {
    if (p.market_value_cur) return (p.market_value_cur / 1000000).toFixed(1) + 'M €';
    if (p.market_value_eur) return (p.market_value_eur / 1000000).toFixed(1) + 'M €';
    if (p.market_value) return (p.market_value / 1000000).toFixed(1) + 'M €';
    return '—';
}

/* ============================================================
   فحص أهلية لاعب واحد للتسجيل
   ============================================================ */
function evaluate(player) {
    const rules = getRules();
    const signed = getSigned();
    const foreign = signed.filter(p => isFullForeign(p.nationality)).length;
    const foreignPlayer = isFullForeign(player.nationality);
    const checks = [];

    const squadOk = signed.length < rules.squadMax;
    checks.push({ ok: squadOk, label: squadOk ? `مقعد متاح في القائمة (${signed.length}/${rules.squadMax})` : `القائمة ممتلئة (${rules.squadMax})` });

    const foreignOk = !foreignPlayer || foreign < rules.foreignMax;
    if (foreignPlayer) {
        checks.push({ ok: foreignOk, label: foreignOk ? `حصة الأجانب متاحة (${foreign}/${rules.foreignMax})` : `تجاوز حد الأجانب (${rules.foreignMax})` });
    } else if (isRegional(player.nationality)) {
        checks.push({ ok: true, label: 'لاعب من اتحادكم القاري (لا يُحتسب ضمن حصة الأجانب)' });
    } else {
        checks.push({ ok: true, label: 'لاعب محلي (لا يحتسب على الأجانب)' });
    }

    const playerWage = parseFloat(player.weekly_wage) || 0;
    const ffp = ffpWith(playerWage);
    const ffpOk = ffp <= rules.wageCapPct;
    checks.push({ ok: ffpOk, label: ffpOk ? `ضمن سقف FFP (${ffp}%/${rules.wageCapPct}%)` : `يتجاوز سقف الرواتب (${ffp}%/${rules.wageCapPct}%)` });

    const winOk = windowOpen();
    checks.push({ ok: winOk, label: winOk ? 'نافذة الانتقالات مفتوحة' : 'نافذة الانتقالات مغلقة' });

    const notBlocked = !fedBlocked();
    if (!notBlocked) checks.push({ ok: false, label: 'النادي محظور من التسجيل (FFP)' });

    const eligible = squadOk && foreignOk && ffpOk && winOk && notBlocked;
    return { eligible, checks, ffp };
}

/* ============================================================
   تنفيذ التسجيل
   ============================================================ */
function registerPlayer(id, silent) {
    const pend = getPending();
    const idx = pend.findIndex(p => (p.tmid === id || p.id === id));
    if (idx < 0) {
        if (!silent) showToast('bad', 'تعذّر التسجيل', 'اللاعب غير موجود في قائمة الانتظار.');
        return false;
    }
    const player = pend[idx];
    const ev = evaluate(player);
    if (!ev.eligible) {
        if (!silent) {
            const fail = ev.checks.find(c => !c.ok);
            showToast('bad', 'تعذّر التسجيل', fail ? fail.label : 'شرط غير مستوفٍ.');
            render();
        }
        return false;
    }
    const signed = getSigned();
    player.status = 'registered';
    player.registeredOn = `${localStorage.getItem('game_day') || '1'}/${localStorage.getItem('game_month') || '6'}/${localStorage.getItem('game_year') || '2026'}`;
    signed.push(player);
    setSigned(signed);
    pend.splice(idx, 1);
    setPending(pend);
    inbox('لجنة تسجيل اللاعبين', `✅ اكتمل تسجيل ${getPlayerName(player)} رسمياً لدى الاتحاد وأصبح ضمن القائمة الأولى للنادي.`);
    if (!silent) {
        showToast('ok', 'تم التسجيل بنجاح', `${getPlayerName(player)} انضم رسمياً إلى قائمة ${CLUB}.`);
        render();
    }
    return true;
}

function registerAllEligible() {
    const pend = getPending().slice();
    let done = 0;
    for (const p of pend) {
        const id = getPlayerId(p);
        if (id && registerPlayer(id, true)) done++;
    }
    render();
    if (done) {
        showToast('ok', 'تم تسجيل دفعة', `اعتُمد ${done} لاعب${done > 1 ? 'ين' : ''} ضمن القائمة الرسمية.`);
    } else {
        showToast('bad', 'لا يوجد مؤهّلون', 'لا يمكن تسجيل أي لاعب حالياً وفق قيود الاتحاد.');
    }
}

function releasePlayer(id) {
    const pend = getPending();
    const idx = pend.findIndex(p => (p.tmid === id || p.id === id));
    if (idx < 0) return;
    const player = pend[idx];
    
    let daysSinceDeal = 0;
    if (player.dealDate) {
        const parts = player.dealDate.split('/').map(n => parseInt(n));
        if (parts.length === 3) {
            const dealAbs = Date.UTC(parts[2], parts[1] - 1, parts[0]);
            const todayAbs = Date.UTC(parseInt(localStorage.getItem('game_year') || '2026'), (parseInt(localStorage.getItem('game_month') || '6')) - 1, parseInt(localStorage.getItem('game_day') || '1'));
            daysSinceDeal = Math.max(0, Math.round((todayAbs - dealAbs) / 86400000));
        }
    }
    
    const fee = getPlayerFee(player);
    const refundPct = Math.max(0.35, 0.80 - daysSinceDeal * 0.03);
    const refund = +(fee * refundPct).toFixed(2);
    localStorage.setItem('clubBudget', (getBudget() + refund).toFixed(2));
    pend.splice(idx, 1);
    setPending(pend);
    inbox('مدير التعاقدات', `تم فسخ اتفاق ${getPlayerName(player)} قبل التسجيل (بعد ${daysSinceDeal} يوم من الاتفاق). استُرجع ${refund}M € (${Math.round(refundPct * 100)}% من الرسوم) إلى الميزانية.`);
    showToast('bad', 'تم إلغاء التعاقد', `${getPlayerName(player)} خرج من غرفة التسجيل. استُرجع ${refund}M € (${Math.round(refundPct * 100)}%).`);
    render();
}

/* ============================================================
   الواجهة
   ============================================================ */
function setCell(prefix,cur,max,invert){
  const pct=max>0?Math.min(100,Math.round(cur/max*100)):0;
  const val=document.getElementById('val'+prefix);
  const bar=document.getElementById('bar'+prefix);
  val.innerText = prefix==='FFP'? cur+'% / '+max+'%' : cur+' / '+max;
  let state;
  if(invert){ state = cur>=max?'ok':cur>=max*0.5?'warn':'bad'; }
  else { state = pct>=100?'bad':pct>=80?'warn':'ok'; }
  val.className='rc-val '+state; bar.className='rc-fill '+state; bar.style.width=pct+'%';
}

function renderRules(){
  const rules=getRules();
  const signed=getSigned();
  const foreign=signed.filter(p=>isFullForeign(p.nationality)).length;
  const homegrown=signed.filter(p=>getPlayerStatus(p.nationality).type==='home').length;
  document.getElementById('clubSub').innerText=`${CLUB} • ${rules.tierLabel}`;
  document.getElementById('confedLabel').innerText=rules.confederationLabel||'';
  document.getElementById('confedNote').innerText=rules.confederationLabel||rules.confederation||'اتحادك';
  setCell('Squad',signed.length,rules.squadMax,false);
  setCell('Foreign',foreign,rules.foreignMax,false);
  setCell('FFP',ffpWith(0),rules.wageCapPct,false);
  if(rules.homegrownMin>0){ document.getElementById('cellHome').style.display='block'; setCell('Home',homegrown,rules.homegrownMin,true); }
  else document.getElementById('cellHome').style.display='none';

  const wn=document.getElementById('windowNote'); const wt=document.getElementById('windowText');
  if(fedBlocked()){ wn.className='window-note blocked'; wt.innerHTML='<b>النادي محظور من التسجيل</b> بسبب مخالفة FFP مسجّلة. لن يُقبل أي تسجيل حتى تسوية الوضع في صفحة المالية.'; }
  else if(!windowOpen()){ wn.className='window-note closed'; wt.innerHTML='<b>نافذة الانتقالات مغلقة.</b> يمكن الاحتفاظ باللاعبين معلّقين، لكن التسجيل يُفتح صيفاً (يونيو–أغسطس) وشتاءً (يناير).'; }
  else { wn.className='window-note'; wt.innerHTML='<b>نافذة الانتقالات مفتوحة.</b> يمكنك اعتماد تسجيل اللاعبين المؤهّلين الآن.'; }
}

function render(){
  renderRules();
  const pend=getPending();
  document.getElementById('pendCount').innerText = pend.length? '('+pend.length+')':'';
  const anyEligible = pend.some(p=>evaluate(p).eligible);
  document.getElementById('bulkBtn').disabled = !anyEligible;

  const box=document.getElementById('regList');
  if(!pend.length){
    box.innerHTML=`<div class="empty"><i class="fas fa-file-circle-check"></i>لا يوجد لاعبون بانتظار التسجيل.<br><br>توجّه إلى <a href="transfers.html">سوق الانتقالات</a> للتعاقد مع لاعبين جدد.</div>`;
    return;
  }
  
  // ★ عرض اللاعبين مع دعم كلا التنسيقين ★
  box.innerHTML = pend.map(p=>{
    const ev=evaluate(p);
    const playerName = getPlayerName(p);
    const position = getPlayerPosition(p);
    const rating = getPlayerRating(p);
    const flag = flagEmoji(p.nationality);
    const status = getPlayerStatus(p.nationality);
    const marketVal = getPlayerMarketValue(p);
    const fee = getPlayerFee(p);
    const fromClub = getPlayerClub(p);
    const playerId = getPlayerId(p);
    const age = getPlayerAge(p);
    const wage = parseFloat(p.weekly_wage) || 0;
    const contractYears = p.contract_years || p.contractYears || '?';
    
    const checksHtml = ev.checks.map(c=>`<span class="check ${c.ok?'pass':'fail'}"><i class="fas fa-${c.ok?'check':'xmark'}"></i>${c.label}</span>`).join('');
    
    return `<div class="rcard ${ev.eligible?'eligible':'blocked'}">
      <div class="rcard-top">
        <div class="ovr ${ovrClass(rating)}"><div class="n">${rating}</div><div class="p">${position}</div></div>
        <div class="rinfo">
          <div class="rname">${playerName} <span class="flag">${flag}</span> ${status.badge}</div>
          <div class="rmeta">
            <span>العمر <b>${age}</b></span>
            <span>من <b>${fromClub}</b></span>
            <span>القيمة السوقية <b>${marketVal}</b></span>
            <span>رسوم الصفقة <b>${fee}M €</b></span>
            <span>الراتب المتفَق عليه <b>${(wage/1000).toFixed(1)}K/أسبوع</b></span>
            <span>عقد <b>${contractYears} مواسم</b></span>
          </div>
        </div>
        <div class="ractions">
          <button class="btn-reg" ${ev.eligible?'':'disabled'} onclick="registerPlayer('${playerId}')"><i class="fas fa-stamp"></i> ${ev.eligible?'تسجيل رسمي':'غير مؤهّل'}</button>
          <button class="btn-release" onclick="releasePlayer('${playerId}')">فسخ التعاقد</button>
        </div>
      </div>
      <div class="checks">${checksHtml}</div>
    </div>`;
  }).join('');
}

function showToast(kind,title,desc){
  const t=document.getElementById('toast');
  t.className='toast '+kind;
  t.innerHTML=`<div class="tt">${title}</div><div class="td">${desc}</div>`;
  t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),4200);
}

// ★ تحميل البيانات من localStorage عند فتح الصفحة ★
function loadData(){
    render();
}

// ★ التنبيه إذا لم يتم العثور على بيانات ★
function checkData(){
    const pend = getPending();
    if(pend.length === 0){
        console.log('📭 لا يوجد لاعبون بانتظار التسجيل.');
    } else {
        console.log(`📋 ${pend.length} لاعب(ين) بانتظار التسجيل.`);
        pend.forEach((p, i) => {
            console.log(`  ${i+1}. ${getPlayerName(p)} (${getPlayerPosition(p)}) - تقييم ${getPlayerRating(p)}`);
        });
    }
}

// ★ بدء التشغيل ★
document.addEventListener('DOMContentLoaded', function() {
    loadData();
    checkData();
});

// ★ مراقبة التغييرات في localStorage (عند تسجيل لاعب من صفحة أخرى) ★
window.addEventListener('storage', function(e) {
    if (e.key === 'pending_registration_by_club' || e.key === 'signed_players_by_club') {
        console.log('🔄 تم تحديث البيانات، إعادة تحميل...');
        loadData();
    }
});

// ★ تحديث كل 3 ثوانٍ (للتأكد من التحديث) ★
setInterval(function() {
    const currentPend = getPending();
    const displayedPend = document.querySelectorAll('.rcard').length;
    if (currentPend.length !== displayedPend) {
        loadData();
    }
}, 3000);

render();
</script>
