name: Wikidata player photos

# يجلب صور لاعبي Transfermarkt الحرة من ويكيميديا كومنز (عبر ويكيداتا) ويرفعها كحزمة في الإصدار data-latest
on:
  workflow_dispatch:
    inputs:
      max_new:
        description: 'max new photos this run (small for a smoke test)'
        default: '100000'
      budget_min:
        description: 'time budget in minutes'
        default: '100'
  schedule:
    - cron: '41 4 8 * *'

permissions:
  contents: write

concurrency:
  group: wikidata-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Fetch photos
        env:
          GH_TOKEN: ${{ github.token }}
          WD_MAX_NEW: ${{ inputs.max_new || '100000' }}
          WD_BUDGET_SEC: ${{ (inputs.budget_min && format('{0}', inputs.budget_min)) || '100' }}
        run: |
          export WD_BUDGET_SEC=$(( ${WD_BUDGET_SEC:-100} * 60 ))
          python3 tools/fetch_wikidata.py
      - name: Publish pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/wd_work/photos_wikidata.zip ]; then
            gh release view data-latest >/dev/null 2>&1 || \
              gh release create data-latest --title "Data packs" --notes "Auto-generated data packs for the game"
            gh release upload data-latest /tmp/wd_work/photos_wikidata.zip --clobber
            ls -la /tmp/wd_work/photos_wikidata.zip
          else
            echo "nothing to publish"
          fi
