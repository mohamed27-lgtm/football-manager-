    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>جدول الترتيب والمسابقات | Football Manager World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #090f1d;
            --card: #111a2e;
            --border: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --gold: #c5a059;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --gray: #64748b;
        }
        html[data-theme="light"] {
            --bg: #f4f5f9;
            --card: #ffffff;
            --border: #e2e5ec;
            --text: #151a24;
            --muted: #6b7385;
            --gold: #8a6b28;
            --green: #16a34a;
            --red: #dc2626;
            --blue: #2563eb;
            --gray: #6b7385;
        }
        

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            gap: 12px; 
        }
        
        /* الهيدر العلوي بنظام أزرار Super Kick-Off */
        .page-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            background: var(--card); 
            padding: 10px 12px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            gap: 12px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
        }

        .back-btn { 
            background: var(--border); 
            color: white; 
            border: none; 
            padding: 8px 12px; 
            font-size: 12px; 
            border-radius: 8px; 
            text-decoration: none; 
        }

        /* شريط التنقل المتمدد والمتقلص */
        .elastic-nav-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 4px;
            gap: 6px;
            align-items: center;
            flex-grow: 1;
        }

        .elastic-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .elastic-btn img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .elastic-btn span {
            display: none;
            opacity: 0;
            max-width: 0;
            transition: opacity 0.2s ease, max-width 0.3s ease;
        }

        .elastic-btn.active {
            flex: 2.8;
            background: var(--gold);
            color: var(--bg);
        }

        .elastic-btn.active span {
            display: inline-block;
            opacity: 1;
            max-width: 150px;
        }

        .elastic-btn.active img {
            transform: scale(1.1);
        }

        .table-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-x: auto; 
            width: 100%;
        }

        /* جداول الدوري */
        .standings-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
            min-width: 500px; 
        }

        .standings-table th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--gold);
            padding: 12px 6px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }

        .standings-table td {
            padding: 12px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.01);
        }

        .text-right { text-align: right; padding-right: 12px !important; }
        
        /* كلاسات حواف الألوان لتحديد المقاعد والصعود والهبوط الواقعي */
        .ucl-bracket { border-right: 4px solid var(--blue); }              /* دوري أبطال أوروبا */
        .uel-bracket { border-right: 4px solid var(--gold); }              /* الدوري الأوروبي */
        .uecl-bracket { border-right: 4px solid #14b8a6 !important; }      /* دوري المؤتمر الأوروبي */
        .afc-bracket { border-right: 4px solid #10b981 !important; }       /* دوري أبطال آسيا للنخبة */
        .afc2-bracket { border-right: 4px solid #34d399 !important; }      /* دوري أبطال آسيا 2 */
        .caf-bracket { border-right: 4px solid #f59e0b !important; }       /* دوري أبطال أفريقيا */
        .caf2-bracket { border-right: 4px solid #fb923c !important; }      /* كأس الكونفدرالية الأفريقية */
        .concacaf-bracket { border-right: 4px solid #ec4899 !important; }  /* دوري أبطال الكونكاكاف */
        .conmebol-bracket { border-right: 4px solid #06b6d4 !important; }  /* كوبا ليبرتادوريس */
        .conmebol2-bracket { border-right: 4px solid #67e8f9 !important; } /* كوبا سودامريكانا */
        .ofc-bracket { border-right: 4px solid #8b5cf6 !important; }       /* دوري أبطال أوقيانوسيا */
        .promotion-bracket { border-right: 4px solid var(--green) !important; } /* شريط الصعود الأخضر للدرجات تحت الأولى */
        .relegation-bracket { border-right: 4px solid var(--red); } 

        .comp-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            padding: 10px 14px;
            font-size: 11px;
            color: var(--muted);
            border-top: 1px solid var(--border);
        }
        .comp-legend span { display: flex; align-items: center; gap: 6px; }
        .comp-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .continental-link {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            margin-top: 10px; padding: 10px; border-radius: 10px;
            background: rgba(197,160,89,0.08); border: 1px solid var(--border);
            color: var(--gold); text-decoration: none; font-size: 12px; font-weight: 600;
        }
        
        .user-club-row { background: rgba(197, 160, 89, 0.08) !important; }

        .team-name-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
        }

        .team-logo-td {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .form-container { display: flex; gap: 3px; justify-content: center; }
        .form-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            font-size: 9px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-W { background-color: var(--green); }
        .form-D { background-color: var(--gray); }
        .form-L { background-color: var(--red); }

        /* شجرة الكأس (دور الـ 16) */
        .cup-container { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
        .bracket-scroll { overflow-x: auto; overflow-y: hidden; padding: 10px 4px 20px 4px; -webkit-overflow-scrolling: touch; }
        .bracket-track { display: flex; flex-direction: row-reverse; align-items: stretch; min-width: max-content; }
        .bracket-round-col { display: flex; flex-direction: column; justify-content: space-around; min-width: 170px; position: relative; }
        .bracket-round-label { position: sticky; top: 0; text-align: center; font-size: 10.5px; font-weight: 800; color: var(--gold); padding: 4px 0 10px 0; }
        .bracket-match-wrap { display: flex; align-items: center; flex: 1; position: relative; padding: 0 14px; }
        .bracket-match { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 100%; overflow: hidden; }
        .bracket-slot { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 8px; font-size: 11px; border-bottom: 1px solid var(--border); }
        .bracket-slot:last-child { border-bottom: none; }
        .bracket-slot.winner { background: rgba(16,185,129,0.08); color: var(--green); font-weight: 800; }
        .bracket-slot .bteam { display: flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .bracket-slot .bteam img { width: 15px; height: 15px; object-fit: contain; flex-shrink: 0; }
        .bracket-slot .bscore { font-weight: 800; font-size: 11px; min-width: 16px; text-align: center; }
        /* موصلات الأقواس الكلاسيكية بين الأدوار — بلا صور، بحدود CSS فقط */
        .bracket-round-col:not(:last-child) .bracket-match-wrap::after {
            content: ''; position: absolute; left: -1px; top: 50%; width: 14px; height: 1px; background: var(--border);
        }
        .bracket-round-col:not(:first-child) .bracket-match-wrap::before {
            content: ''; position: absolute; right: -1px; top: 50%; width: 14px; height: 1px; background: var(--border);
        }
        .bracket-trophy { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 12px; color: var(--gold); font-size: 26px; }
        .winner-highlight { color: var(--green); }

        /* كأس السوبر */
        .supercup-container {
            padding: 30px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .supercup-title {
            font-size: 16px;
            color: var(--gold);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .supercup-title img { width: 28px; height: 28px; object-fit: contain; }
        .supercup-match {
            display: flex;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            justify-content: space-between;
        }
        .super-team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .super-team-box img { width: 45px; height: 45px; object-fit: contain; }
        .super-team-name { font-size: 13px; font-weight: bold; }
        .super-center-trophy { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; padding: 0 10px; }
        .super-center-trophy img { width: 40px; height: 40px; object-fit: contain; }
        .super-score-box { font-size: 15px; font-weight: 800; color: var(--gold); background: var(--bg); padding: 3px 10px; border-radius: 8px; }
        .empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

        .stats-board-title {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 14px; font-size: 13px; font-weight: 700; color: var(--gold);
            border-bottom: 1px solid var(--border);
        }
        .scorers-table td, .scorers-table th { font-size: 12px; }
        .scorers-table .player-rank {
            display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 700;
            background: rgba(255,255,255,0.05); color: var(--muted);
        }
        .scorers-table tr:nth-child(1) .player-rank { background: var(--gold); color: var(--bg); }
        .scorers-table tr:nth-child(2) .player-rank { background: #94a3b8; color: var(--bg); }
        .scorers-table tr:nth-child(3) .player-rank { background: #b45309; color: var(--bg); }
        .scorers-table .player-team { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
        .scorers-table .player-team img { width: 16px; height: 16px; object-fit: contain; }
        .scorers-table .stat-value { color: var(--gold); font-weight: 700; }
    </style>
</head>

        };

        // يحوّل سجل قاعدة البيانات اليدوية إلى نفس الشكل الذي تتوقعه بقية الدوال (getRowBracket / getLegendItems)
        // اسم الكأس المحلي الحقيقي لكل دولة، مطابق تماماً لمفاتيح TROPHY_IMAGE_MAP الفعلية — إصلاح جذري:
        // كان الكود يمرّر اسم الدوري نفسه (وليس اسم الكأس)، ومعرّفاً وهمياً ثابتاً "cup" بدل معرّف حقيقي، فتفشل كل مطابقة دائماً
        const REAL_DOMESTIC_CUP_NAMES = {
            'Saudi Arabia': 'Crown Prince Cup', 'Spain': 'Copa del Rey', 'England': 'FA Cup', 'France': 'Coupe de France',
            'Italy': 'Coppa Italia', 'Germany': 'DFB-Pokal', 'Brazil': 'Copa do Brasil', 'Netherlands': 'KNVB Cup',
            'Turkiye': 'Turkish Cup', 'Egypt': 'Egypt Cup', 'Morocco': 'Moroccan Cup', 'Portugal': 'Taça de Portugal',
            'Belgium': 'Belgian Cup', 'Austria': 'Austrian Cup', 'Japan': 'Emperors Cup', 'Norway': 'Norwegian Cup',
        };
        function getRealCupTrophyName() {
            const home = (localStorage.getItem('homeCountry') || '').trim();
            return REAL_DOMESTIC_CUP_NAMES[home] || null;
        }
        function buildCompInfoFromManual(entry, tier) {
            return {
                name: entry.name,
                type_id: tier,
                cup_id: tier <= 2 ? "cup" : "",
                super_id: tier === 1 ? "super" : "",
                tier_above: tier > 1 || entry.hasUpperTier ? ["above"] : [],
                tier_below: entry.hasLowerTier ? ["below"] : [],
                relegation: entry.relegation || 0,
                promotion: entry.promotion || 0,
                continental_type: entry.continental_type || "",
                ucl: entry.ucl || 0,
                uel: entry.uel || 0,
                uecl: entry.uecl || 0
            };
        }

        // دالة تُعيد بيانات المسابقة الحالية: أولاً من القاعدة اليدوية الموثوقة (دولة + درجة)،
        // ثم من قاموس competition_detailed.csv كفولباك فقط لأي دولة غير مُدرجة يدوياً
        function getCompInfo() {
            const homeCountry = (localStorage.getItem('homeCountry') || '').trim();
            const tier = parseInt(localStorage.getItem('current_competition_type_id')) || null;
            if (homeCountry && tier && MANUAL_LEAGUE_DB[homeCountry] && MANUAL_LEAGUE_DB[homeCountry][tier]) {
                return buildCompInfoFromManual(MANUAL_LEAGUE_DB[homeCountry][tier], tier);
            }

            const rawCid = localStorage.getItem('current_competition_id') || '';
            const cid = rawCid.trim();
            if (cid && COMP_DB[cid]) return COMP_DB[cid];

            // مطابقة غير حساسة لحالة الأحرف/الفراغات (قد يختلف شكل المعرف القادم من ملف الأندية الفعلي عن مفتاح القاموس)
            if (cid) {
                const lower = cid.toLowerCase();
                for (const key in COMP_DB) {
                    if (key.toLowerCase() === lower) return COMP_DB[key];
                }
            }

            // فولباك: مطابقة بالاسم + نوع الدرجة (عندما لا يتطابق المعرّف إطلاقاً مع القاموس)
            const rawName = (localStorage.getItem('current_league_name') || '').replace('مسيرة ', '').trim();
            const tierId = tier;
            if (rawName) {
                const nameLower = rawName.toLowerCase();
                let candidates = Object.values(COMP_DB).filter(c => c.name && c.name.toLowerCase() === nameLower);
                if (candidates.length > 1 && tierId) {
                    const refined = candidates.filter(c => c.type_id === tierId);
                    if (refined.length) candidates = refined;
                }
                if (candidates.length) return candidates[0];
            }

            // فولباك أخير: country_id|type_id
            const cntry = localStorage.getItem('current_country_id') || '';
            const tierStr  = localStorage.getItem('current_competition_type_id') || '';
            if (cntry && tierStr) return COMP_DB[cntry + '|' + tierStr] || null;
            return null;
        }

        // بعض الدوريات (كالمصري والمغربي...) لديها tier_below بقيمة placeholder "virtual_lower"
        // لأن الدرجة الثانية غير مُحاكاة فعلياً داخل اللعبة، فمن منظور اللعبة هي أدنى درجة قابلة للعب،
        // لذلك لا يجب إظهار شريط الهبوط لها رغم وجود هبوط حقيقي في الواقع خارج اللعبة.
        function hasRealLowerTier(compInfo) {
            if (!compInfo || !compInfo.tier_below || !compInfo.tier_below.length) return false;
            return compInfo.tier_below.some(t => t && t !== 'virtual_lower');
        }

        // خريطة الألوان والأسماء الحقيقية للمقاعد القارية حسب كل اتحاد قاري
        const CONTINENTAL_SLOTS = {
            "UEFA":     { t1: { cls: "ucl-bracket",      name: "دوري أبطال أوروبا" },
                          t2: { cls: "uel-bracket",      name: "الدوري الأوروبي" },
                          t3: { cls: "uecl-bracket",     name: "دوري المؤتمر الأوروبي" } },
            "AFC":      { t1: { cls: "afc-bracket",      name: "دوري أبطال آسيا للنخبة" },
                          t2: { cls: "afc2-bracket",     name: "دوري أبطال آسيا 2" },
                          t3: null },
            "CAF":      { t1: { cls: "caf-bracket",      name: "دوري أبطال أفريقيا" },
                          t2: { cls: "caf2-bracket",     name: "كأس الكونفدرالية الأفريقية" },
                          t3: null },
            "CONCACAF": { t1: { cls: "concacaf-bracket", name: "دوري أبطال الكونكاكاف" },
                          t2: null, t3: null },
            "CONMEBOL": { t1: { cls: "conmebol-bracket",  name: "كوبا ليبرتادوريس" },
                          t2: { cls: "conmebol2-bracket", name: "كوبا سودامريكانا" },
                          t3: null },
            "OFC":      { t1: { cls: "ofc-bracket",      name: "دوري أبطال أوقيانوسيا" },
                          t2: null, t3: null }
        };

        // دالة الشريط الجانبي: تُعيد كلاس CSS حسب موقع الفريق ونوع الاتحاد القاري الحقيقي
        // اللعبة لا تسمح باختيار أي درجة أعمق من الدرجة الثالثة (choose_club.html يحصر الاختيار في 1/2/3 فقط)،
        // لذلك الدرجة الثالثة هي دائماً أعمق درجة يمكن الوصول إليها فعلياً داخل اللعبة - بغض النظر عن عمق الهرم الحقيقي
        // لكرة القدم في ذلك البلد (حتى لو كان يصل لـ4 أو 5 درجات في الواقع). فلا هبوط يظهر من الدرجة الثالثة أبداً.
        function isRelegatableInGame(compInfo) {
            if (!compInfo) return false;
            if (compInfo.type_id >= 3) return false; // الدرجة الثالثة فما فوق = نهاية الهرم القابل للعب في هذه اللعبة
            return hasRealLowerTier(compInfo);
        }

        function getRowBracket(index, total, compInfo) {
            if (!compInfo) return '';
            const tid  = compInfo.type_id;
            const ct   = compInfo.continental_type || '';
            const ucl  = compInfo.ucl  || 0;
            const uel  = compInfo.uel  || 0;
            const uecl = compInfo.uecl || 0;
            const rel  = compInfo.relegation || 0;
            const pro  = compInfo.promotion  || 0;
            const slots = CONTINENTAL_SLOTS[ct] || null;

            if (tid === 1) {
                // مقاعد قارية واقعية لكل دوري بحسب اتحاده القاري الفعلي (وليس نفس الألوان لكل الدوريات)
                if (slots) {
                    if (ucl  > 0 && index < ucl && slots.t1)                              return slots.t1.cls;
                    if (uel  > 0 && index < ucl + uel && slots.t2)                        return slots.t2.cls;
                    if (uecl > 0 && index < ucl + uel + uecl && slots.t3)                  return slots.t3.cls;
                } else {
                    // فولباك افتراضي إذا لم يُحدد الاتحاد القاري
                    if (ucl  > 0 && index < ucl)               return 'ucl-bracket';
                    if (uel  > 0 && index < ucl + uel)          return 'uel-bracket';
                    if (uecl > 0 && index < ucl + uel + uecl)   return 'uecl-bracket';
                }
                // هبوط فقط إذا كانت هناك درجة أدنى حقيقية قابلة للعب فعلاً (الدرجة الدنيا لا هبوط منها إطلاقاً)
                if (rel > 0 && isRelegatableInGame(compInfo)) {
                    if (index >= total - rel) return 'relegation-bracket';
                }
                return '';
            }

            if (tid >= 2 && tid <= 6) {
                // الصعود فقط إذا كانت هناك درجة أعلى فعلاً
                if (pro > 0 && compInfo.tier_above && compInfo.tier_above.length > 0) {
                    if (index < pro) return 'promotion-bracket';
                }
                // الهبوط فقط إذا كانت هناك درجة أدنى حقيقية قابلة للعب وقابلة للاختيار فعلياً في اللعبة
                // (آخر درجة فعلية قابلة للعب = لا هبوط دائماً، والدرجة الثالثة هي الحد الأقصى القابل للاختيار)
                if (rel > 0 && isRelegatableInGame(compInfo)) {
                    if (index >= total - rel) return 'relegation-bracket';
                }
                return '';
            }
            return '';
        }

        // تُعيد نص شرح مختصر لكل شارة لون حسب المسابقة الحالية (لعرضه في مفتاح الألوان أسفل الجدول)
        function getLegendItems(compInfo, total) {
            if (!compInfo) return [];
            const items = [];
            const tid = compInfo.type_id;
            const ct  = compInfo.continental_type || '';
            const slots = CONTINENTAL_SLOTS[ct] || null;

            if (tid === 1 && slots) {
                if (compInfo.ucl  > 0 && slots.t1) items.push({ cls: slots.t1.cls, label: slots.t1.name });
                if (compInfo.uel  > 0 && slots.t2) items.push({ cls: slots.t2.cls, label: slots.t2.name });
                if (compInfo.uecl > 0 && slots.t3) items.push({ cls: slots.t3.cls, label: slots.t3.name });
            }
            if (tid >= 2 && tid <= 6 && compInfo.promotion > 0 && compInfo.tier_above && compInfo.tier_above.length > 0) {
                items.push({ cls: 'promotion-bracket', label: 'صعود' });
            }
            if (compInfo.relegation > 0 && isRelegatableInGame(compInfo)) {
                items.push({ cls: 'relegation-bracket', label: 'هبوط' });
            } else {
                items.push({ cls: '', label: 'لا يوجد هبوط — هذه أدنى درجة قابلة للعب في اللعبة' });
            }
            return items;
        }

        // ألوان حقيقية مطابقة لألوان أشرطة الجدول، تُستخدم في مفتاح الألوان
        const LEGEND_COLORS = {
            'ucl-bracket': '#3b82f6', 'uel-bracket': '#c5a059', 'uecl-bracket': '#14b8a6',
            'afc-bracket': '#10b981', 'afc2-bracket': '#34d399',

            'conmebol-bracket': '#06b6d4', 'conmebol2-bracket': '#67e8f9',

            'promotion-bracket': '#10b981', 'relegation-bracket': '#ef4444'

        function renderLegend() {
            const el = document.getElementById('compLegend');
            if (!el) return;
            const compInfo = getCompInfo();
            const items = getLegendItems(compInfo, currentLeagueTeams.length);
            if (!items.length) { el.innerHTML = ''; return; }
            el.innerHTML = items.map(it => `<span><i style="background:${it.cls ? (LEGEND_COLORS[it.cls] || '#64748b') : 'transparent'};"></i>${it.label}</span>`).join('');
        }

        // دالة تحدد: هل الكأس المحلية متاحة لهذا الدوري؟
        // الكؤوس تشمل الدرجة الأولى والثانية (وأحياناً الثالثة) لكن ليس أدنى
        function isCupAvailable(compInfo) {
            if (!compInfo) return false;
            if (!compInfo.cup_id) return false;
            // الكأس متاحة للدرجة 1 و2 فقط
            return compInfo.type_id <= 2;
        }

        // دالة تحدد: هل السوبر متاح؟ (الدرجة الأولى فقط)
        function isSuperAvailable(compInfo) {
            if (!compInfo) return false;
            if (!compInfo.super_id) return false;
            return compInfo.type_id === 1;
        }

        const activeUserClub = localStorage.getItem('presidentialClub') || "ريال مدريد";
        let currentLeagueName = localStorage.getItem('current_league_name') || "الدوري الإسباني";
        let currentRound = parseInt(localStorage.getItem('database_current_round')) || 0;
        let currentLeagueTeams = [];
        const realLogosPath = "teams_logos/";

        // ============================================================
        // نفس منطق التاريخ الحقيقي بالضبط المستخدم في fixtures.html — بداية الموسم 15 أغسطس، وكل جولة أسبوع كامل
        // لضمان أن مواعيد بطولة الكأس هنا تطابق تماماً تقويم اللعبة الحقيقي المستخدم في كل مكان آخر
        // ============================================================
        function getGameDate() { return { day: parseInt(localStorage.getItem('game_day'))||1, month: parseInt(localStorage.getItem('game_month'))||9, year: parseInt(localStorage.getItem('game_year'))||2026 }; }
        const gameNowForDates = getGameDate();
        function addDaysToDateReal(base, days) {
            let d = { ...base };
            for (let i = 0; i < days; i++) {
                d.day++;
                let dim = 30;
                if ([1,3,5,7,8,10,12].includes(d.month)) dim = 31;
                else if (d.month === 2) dim = (d.year % 4 === 0) ? 29 : 28;
                if (d.day > dim) { d.day = 1; d.month++; }
                if (d.month > 12) { d.month = 1; d.year++; }
            }
            return d;
        }
        const seasonStartYearReal = (gameNowForDates.month >= 8) ? gameNowForDates.year : gameNowForDates.year - 1;
        const SEASON_START_REAL = { day: 15, month: 8, year: seasonStartYearReal };
        function roundDateReal(roundNum) { return addDaysToDateReal(SEASON_START_REAL, (roundNum - 1) * 7); }
        function pad2(n) { return n < 10 ? '0' + n : n; }
        function fmtDateReal(d) { return `${pad2(d.day)}/${pad2(d.month)}/${d.year}`; }

        // شعارات بطولات حقيقية — نفس القاموس المستخدم في fixtures.html، لضمان اتساق كامل بين الصفحتين
        const COMPETITION_LOGOS = {

            'كأس السوبر': 'comp_logos/super_cup.png', 'الدوري المحلي': 'comp_logos/league.png', 'الكأس': 'comp_logos/generic_cup.png',
        };
        function getCompetitionLogoUrl(name) {
            for (const key in COMPETITION_LOGOS) if (name && name.includes(key)) return COMPETITION_LOGOS[key];
            return 'comp_logos/generic_cup.png';
        }

        let cleanLeagueName = currentLeagueName.replace("مسيرة ", "").trim();
        
        // قاموس الترجمة والفصل النهائي الحقيقي الصافي لمسميات الكؤوس والسوبر بالإنجليزية
        const competitionsMapping = {

        function createEmptyStats(teamName) {

        function generateDoubleRoundRobin(teams) {
            let pool = [...teams];
            if (pool.length % 2 !== 0) pool.push("إستراحة");
            let totalTeams = pool.length;
            let roundsCount = totalTeams - 1;
            let matchesPerRound = totalTeams / 2;
            let schedule = [];

            for (let round = 0; round < roundsCount; round++) {
                let roundMatches = [];
                for (let i = 0; i < matchesPerRound; i++) {
                    let home = pool[i]; let away = pool[totalTeams - 1 - i];
                    if (home === "إستراحة" || away === "إستراحة") continue;
                    if (round % 2 === 1) { let tmp = home; home = away; away = tmp; }
                    roundMatches.push({ home: home, away: away });
                }
                schedule.push(roundMatches);
                pool.splice(1, 0, pool.pop());
            }
            let firstHalfLength = schedule.length;
            for (let round = 0; round < firstHalfLength; round++) {
                let roundMatches = [];
                schedule[round].forEach(m => { roundMatches.push({ home: m.away, away: m.home }); });
                schedule.push(roundMatches);
            }
            return schedule;
        }

        function calculateStandings() {
            if (currentLeagueTeams.length === 0) return [];
            let standings = {};
            currentLeagueTeams.forEach(t => { standings[t] = createEmptyStats(t); });

            const schedule = generateDoubleRoundRobin(currentLeagueTeams);
            let savedScores = JSON.parse(localStorage.getItem('full_season_scores')) || [];

            for (let i = 0; i < currentRound; i++) {
                if (!schedule[i]) break;
                schedule[i].forEach(match => {
                    let hScore = 0, aScore = 0;
                    if (match.home === activeUserClub || match.away === activeUserClub) {
                        let found = savedScores.find(s => s.roundIdx === i);
                        if (found) { hScore = found.homeScore; aScore = found.awayScore; }
                    } else {
                        let seed = i + match.home.length + match.away.length;
                        hScore = seed % 3; aScore = (seed + 1) % 3;
                    }

                    let home = standings[match.home];
                    let away = standings[match.away];
                    if (home && away) {
                        home.total.played++; home.total.gf += hScore; home.total.ga += aScore;
                        away.total.played++; away.total.gf += aScore; away.total.ga += hScore;
                        if (hScore > aScore) { home.total.wins++; home.total.pts += 3; home.form.push('W'); away.total.losses++; away.form.push('L'); }
                        else if (hScore === aScore) { home.total.draws++; home.total.pts += 1; home.form.push('D'); away.total.draws++; away.total.pts += 1; away.form.push('D'); }
                        else { away.total.wins++; away.total.pts += 3; away.form.push('W'); home.total.losses++; home.form.push('L'); }
                    }
                });
            }
            return Object.values(standings).sort((a,b) => b.total.pts - a.total.pts || (b.total.gf-b.total.ga) - (a.total.gf-a.total.ga));
        }

        function getSeasonLabel() {

        function recordRealAchievement(key, data) {
            const log = JSON.parse(localStorage.getItem('club_real_achievements_' + activeUserClub) || '[]');
            if (log.some(a => a.key === key)) return; // لا تكرار — كل إنجاز يُسجَّل مرة واحدة فقط عند أول تحقق فعلي له

        function checkSeasonCompletionAchievements(list) {
            const totalLeagueRounds = (currentLeagueTeams.length - 1) * 2;
            if (currentRound < totalLeagueRounds) return; // الموسم لم يكتمل فعلياً بعد

                recordRealAchievement('league_title_' + season, { type: 'league_title', label: `لقب الدوري ${season}`, isFirst: priorTitles === 0 });

        // ===== لوحة الهدافين وصانعي الأهداف (محاكاة معتمدة على تقدم الجولات، بنفس أسلوب محاكاة النتائج في الملف) =====
        const SCORER_FIRST_NAMES = ["محمد","أحمد","علي","يوسف","عمر","خالد","ياسين","كريم","حمزة","إبراهيم","سالم","فيصل","تركي","نواف","Carlos","Diego","Lucas","Mateo","Bruno","Rafael","Andrea","Marco","Luca","Kevin","Erik","Lars","Jan","Petr","Sven","Thiago"];
        const SCORER_LAST_NAMES  = ["الحربي","العتيبي","الغامدي","المطيري","حسن","سالم","فتحي","منصور","الشمري","القحطاني","Silva","Fernandes","Rodriguez","Martins","Rossi","Bianchi","Novak","Kowalski","Ivanov","Müller","Janssen","Andersson","Costa","Torres"];

        function seedHash(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) >>> 0; }
            return h;
        }

        function generatePlayerStatList(salt) {
            if (!currentLeagueTeams.length || currentRound <= 0) return [];
            let players = [];
            currentLeagueTeams.forEach(team => {
                for (let p = 0; p < 2; p++) {
                    const seed = seedHash(team + salt + p);
                    const first = SCORER_FIRST_NAMES[seed % SCORER_FIRST_NAMES.length];
                    const last  = SCORER_LAST_NAMES[Math.floor(seed / 7) % SCORER_LAST_NAMES.length];
                    const rate  = (seed % 5) + 1; // ميل اللاعب للتهديف/الصناعة (1-5)
                    let value = Math.round((currentRound * rate) / 9) + (seed % 3);
                    if (value < 0) value = 0;
                    players.push({ name: first + " " + last, team, value });
                }
            });
            return players.sort((a, b) => b.value - a.value || a.name.localeCompare(b.name)).slice(0, 10);
        }

        function renderStatBoard(tbodyId, salt, unitLabel) {

        function renderCupBracket() {
            const container = document.getElementById('cupMatchesContainer');
            const compInfo = getCompInfo();
            if (!isCupAvailable(compInfo)) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-lock" style="color:var(--red); margin-left:6px;"></i> بطولات الكأس المحلية مقتصرة على الدرجة الأولى والثانية فقط.</div>`;
                return;
            }
            if (currentLeagueTeams.length === 0) return;

            // مشاركة حقيقية عبر الدرجات: تُضاف فرق الدرجة الثانية الحقيقية إن كانت بياناتها متوفرة فعلياً
            // (فرق حقيقية موثَّقة من نفس قاعدة بيانات الأندية الحقيقية المستخدمة عبر اللعبة، وليست بيانات وهمية أو معتمدة على مفتاح خارجي غير مضمون)
            let cupTeams = [...currentLeagueTeams];
            let tier2Teams = [];
            const homeCountryForCup = (localStorage.getItem('homeCountry') || '').trim();
            if (hasRealLowerTier(compInfo) && REAL_TIER2_TEAMS[homeCountryForCup]) {
                tier2Teams = REAL_TIER2_TEAMS[homeCountryForCup];
            }
            cupTeams = [...cupTeams, ...tier2Teams].sort();

            // قوة حقيقية لكل فريق مأخوذة من ترتيب الدوري الفعلي المحسوب على هذه الصفحة (نقاط حقيقية من المباريات المُحتسَبة)
            // فرق الدرجة الثانية تُعطى قوة أساسية أقل واقعياً (لا بيانات نقاط فعلية لها بعد ضمن هذه الصفحة)
            const realStandings = calculateStandings();
            const strengthMap = {};
            realStandings.forEach(s => { strengthMap[s.name] = 30 + (s.total.pts || 0); });
            tier2Teams.forEach(t => { if (!(t in strengthMap)) strengthMap[t] = 18; });
            function teamStrength(name) { return strengthMap[name] !== undefined ? strengthMap[name] : 22; }

            let rounds = tier2Teams.length ? ["دور الـ 32", "دور الـ 16", "ربع النهائي", "نصف النهائي", "النهائي"] : ["دور الـ 16", "ربع النهائي", "نصف النهائي", "النهائي"];
            let targetSize = tier2Teams.length ? 32 : 16;
            let currentRoundTeams = cupTeams.slice(0, targetSize);
            while(currentRoundTeams.length < targetSize) {
                currentRoundTeams.push("—");
            }

            const realCupName = getRealCupTrophyName();
            const cupDisplayLabel = realCupName || 'الكأس المحلية';
            container.innerHTML = `<div style="display:flex; align-items:center; gap:8px; padding:10px 4px; margin-bottom:2px;">
                <img src="${getTrophyImage(realCupName || compInfo.name, null)}" onerror="this.onerror=null; this.style.display='none';" style="width:32px; height:32px; object-fit:contain;">
                <b style="font-size:13px; color:var(--gold);">${cupDisplayLabel}</b>
                ${tier2Teams.length ? `<span style="font-size:9.5px; color:var(--muted); margin-right:auto;">مشاركة حقيقية من الدرجتين الأولى والثانية</span>` : ''}
            </div>
            <div style="font-size:9.5px; color:var(--muted); padding:0 4px 8px 4px;"><i class="fas fa-arrows-left-right"></i> مرّر أفقياً لمتابعة الأدوار حتى النهائي</div>`;
            let totalRounds = (currentLeagueTeams.length - 1) * 2;
            let threshold = Math.max(1, Math.floor(totalRounds / rounds.length));
            let cupCompleted = false;

            const roundsData = []; // كل الأدوار مع مبارياتها، لبناء شجرة القوس الكاملة دفعة واحدة
            for (let rIdx = 0; rIdx < rounds.length; rIdx++) {
                const roundNumForDate = (rIdx + 1) * threshold;
                const realDate = fmtDateReal(roundDateReal(roundNumForDate));
                let isPlayed = currentRound >= roundNumForDate;
                let nextTeams = [];
                let matches = [];

                for (let i = 0; i < currentRoundTeams.length; i += 2) {
                    let tA = currentRoundTeams[i] || "—", tB = currentRoundTeams[i+1] || "—";
                    let sA = "-", sB = "-", winner = "";

                    if (isPlayed && tA !== "—" && tB !== "—") {
                        const strA = teamStrength(tA), strB = teamStrength(tB);
                        const seed = seedHashCup(tA + tB + rIdx + i);
                        const roll = seed % (strA + strB);
                        winner = roll < strA ? tA : tB;
                        const winnerStr = Math.max(strA, strB), loserStr = Math.min(strA, strB);
                        const margin = Math.min(3, 1 + Math.floor((winnerStr - loserStr) / 15));
                        const loserGoals = (seed % 3);
                        if (winner === tA) { sA = loserGoals + margin; sB = loserGoals; } else { sB = loserGoals + margin; sA = loserGoals; }
                    } else if (tA !== "—" && tB === "—") {
                        winner = tA;
                    }
                    if (winner) nextTeams.push(winner);
                    if (rIdx === rounds.length - 1 && winner) { cupCompleted = true; localStorage.setItem('cup_winner_' + activeUserClub, winner); }
                    matches.push({ tA, tB, sA, sB, winner });
                }
                roundsData.push({ label: rounds[rIdx], isPlayed, realDate, matches });
                currentRoundTeams = nextTeams.length ? nextTeams : Array(Math.max(1, currentRoundTeams.length / 2)).fill("—");
            }
            localStorage.setItem('cup_completed_' + activeUserClub, cupCompleted ? '1' : '0');

            // بناء شجرة القوس الحقيقية: أعمدة أدوار متصلة بخطوط قوسية كلاسيكية، مع بطولة في النهاية
            const trackHTML = roundsData.map(round => `
                <div class="bracket-round-col">
                    <div class="bracket-round-label">${round.label}<br><span style="color:var(--muted); font-weight:400;">${round.isPlayed ? 'منتهية' : round.realDate}</span></div>
                    ${round.matches.map(m => `
                        <div class="bracket-match-wrap">
                            <div class="bracket-match">
                                <div class="bracket-slot ${m.winner===m.tA && m.tA!=='—' ? 'winner':''}">
                                    <div class="bteam"><img src="${getTeamLogoUrl(m.tA)}" onerror="this.style.display='none';"><span>${m.tA}</span></div>
                                    <span class="bscore">${m.sA}</span>
                                </div>
                                <div class="bracket-slot ${m.winner===m.tB && m.tB!=='—' ? 'winner':''}">
                                    <div class="bteam"><img src="${getTeamLogoUrl(m.tB)}" onerror="this.style.display='none';"><span>${m.tB}</span></div>
                                    <span class="bscore">${m.sB}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `).join('') + `<div class="bracket-trophy"><img src="${getTrophyImage(getRealCupTrophyName() || compInfo.name, null)}" onerror="this.onerror=null; this.src='trophies/default_trophy.png';" style="width:44px; height:44px; object-fit:contain;"></div>`;

            container.innerHTML += `<div class="bracket-scroll"><div class="bracket-track">${trackHTML}</div></div>`;
        }
        function seedHashCup(str) { let h=0; const s=String(str); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }

        // حساب نتيجة الكأس الحقيقية (الفائز فقط، بلا كتابة DOM) — يُستخدَم في كلا التبويبين لضمان نفس النتيجة دائماً
        function computeCupResult() {
            const compInfo = getCompInfo();
            if (!isCupAvailable(compInfo) || currentLeagueTeams.length === 0) return { completed:false, winner:null };
            let cupTeams = [...currentLeagueTeams];
            let tier2Teams = [];
            const homeCountryForCup2 = (localStorage.getItem('homeCountry') || '').trim();
            if (hasRealLowerTier(compInfo) && REAL_TIER2_TEAMS[homeCountryForCup2]) {
                tier2Teams = REAL_TIER2_TEAMS[homeCountryForCup2];
            }
            cupTeams = [...cupTeams, ...tier2Teams].sort();

            const realStandings = calculateStandings();
            const strengthMap = {};
            realStandings.forEach(s => { strengthMap[s.name] = 30 + (s.total.pts || 0); });
            tier2Teams.forEach(t => { if (!(t in strengthMap)) strengthMap[t] = 18; });
            function teamStrength(name) { return strengthMap[name] !== undefined ? strengthMap[name] : 22; }

            let rounds = tier2Teams.length ? 5 : 4, targetSize = tier2Teams.length ? 32 : 16;
            let currentRoundTeams = cupTeams.slice(0, targetSize);
            while (currentRoundTeams.length < targetSize) currentRoundTeams.push("—");
            let totalRounds = (currentLeagueTeams.length - 1) * 2;
            let threshold = Math.max(1, Math.floor(totalRounds / rounds));

            let winner = null;
            for (let rIdx = 0; rIdx < rounds; rIdx++) {
                const roundNumForDate = (rIdx + 1) * threshold;
                let isPlayed = currentRound >= roundNumForDate;
                let nextTeams = [];
                for (let i = 0; i < currentRoundTeams.length; i += 2) {
                    let tA = currentRoundTeams[i] || "—", tB = currentRoundTeams[i+1] || "—";
                    let w = "";
                    if (isPlayed && tA !== "—" && tB !== "—") {
                        const strA = teamStrength(tA), strB = teamStrength(tB);
                        const seed = seedHashCup(tA + tB + rIdx + i);
                        w = (seed % (strA + strB)) < strA ? tA : tB;
                    } else if (tA !== "—" && tB === "—") { w = tA; }
                    if (w) nextTeams.push(w);
                    if (rIdx === rounds - 1 && w) winner = w;
                }
                currentRoundTeams = nextTeams.length ? nextTeams : Array(Math.max(1, currentRoundTeams.length / 2)).fill("—");
            }
            if (winner) { localStorage.setItem('cup_winner_' + activeUserClub, winner); localStorage.setItem('cup_completed_' + activeUserClub, '1'); }
            return { completed: !!winner, winner };
        }

        function renderSuperCup() {
            const container = document.getElementById('superCupContainer');
            const compInfo = getCompInfo();
            if (!isSuperAvailable(compInfo)) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-lock" style="color:var(--red); margin-left:6px;"></i> كأس السوبر مقتصر على الدرجة الأولى فقط.</div>`;
                return;
            }
            
            if (!realSuperCupName || realSuperCupName.trim() === "") {
                container.innerHTML = `<div class="empty-state">❌ لا توجد مسابقة كأس سوبر محلي لهذا الدوري.</div>`;
                return;
            }

            const list = calculateStandings();
            if (list.length < 2) {
                container.innerHTML = `<div class="empty-state">غير متاح حالياً</div>`;
                return;
            }

            // السوبر الحقيقي = بطل الدوري الفعلي (بعد اكتمال كل الجولات) × بطل الكأس الفعلي (بعد اكتمال النهائي)
            // لا تُعرض المباراة إطلاقاً قبل تحدد الفريقين فعلياً، تماماً كالواقع
            const totalLeagueRounds = (currentLeagueTeams.length - 1) * 2;
            const leagueCompleted = currentRound >= totalLeagueRounds;
            // لا نعتمد على زيارة سابقة لتبويب الكأس — نحسب نتيجته الفعلية مباشرة هنا لضمان صحة البوابة بغض النظر عن ترتيب التنقل
            let cupCompleted = localStorage.getItem('cup_completed_' + activeUserClub) === '1';
            let cupWinner = localStorage.getItem('cup_winner_' + activeUserClub);
            if (!cupCompleted || !cupWinner) {
                const result = computeCupResult();
                cupCompleted = result.completed;
                cupWinner = result.winner;
            }

            if (!leagueCompleted || !cupCompleted || !cupWinner) {
                const missing = [];
                if (!leagueCompleted) missing.push('اكتمال بطولة الدوري');
                if (!cupCompleted || !cupWinner) missing.push('اكتمال بطولة الكأس');
                container.innerHTML = `
                    <div class="supercup-title">
                        <img src="${getTrophyImage(realSuperCupName, null)}" onerror="this.onerror=null; this.src='trophies/default_trophy.png';">
                        <span>${realSuperCupName}</span>
                    </div>
                    <div class="supercup-match">
                        <div class="super-team-box">
                            <div class="super-team-name" style="color:var(--muted);">بطل الدوري</div>
                        </div>
                        <div class="super-center-trophy">
                            <img src="${getTrophyImage(realSuperCupName, null)}" onerror="this.onerror=null; this.src='trophies/default_trophy.png';">
                        </div>
                        <div class="super-team-box">
                            <div class="super-team-name" style="color:var(--muted);">بطل الكأس</div>
                        </div>
                    </div>
                    <div class="empty-state"><i class="fas fa-hourglass-half"></i> لم يتحدد طرفا المباراة بعد — بانتظار: ${missing.join(' و')}.</div>
                `;
                return;
            }

            let teamA = list[0].name; // بطل الدوري الفعلي الحقيقي بعد اكتمال كل الجولات
            let teamB = cupWinner;    // بطل الكأس الفعلي الحقيقي بعد اكتمال النهائي

            let isSuperCupPlayed = true; // لا نصل هنا إلا وقد تحدد الطرفان فعلياً، فالمباراة تُقام مباشرة

            let sA = "-", sB = "-";
            if (isSuperCupPlayed) {
                sA = (teamA.length % 3) + 1;
                sB = (teamB.length % 3);
                if (sA === sB) sA++;
            }

            container.innerHTML = `
                <div class="supercup-title">
                    <img src="${getTrophyImage(realSuperCupName, null)}" onerror="this.onerror=null; this.src='trophies/default_trophy.png';">
                    <span>${realSuperCupName}</span>
                </div>
                <div style="font-size:11px; color:var(--muted); margin-bottom:10px;">بطل الدوري × بطل الكأس — مباراة منتهية</div>
                <div class="supercup-match">
                    <div class="super-team-box">
                        <img src="${getTeamLogoUrl(teamA)}" onerror="this.src='leagues_logos/default_league.png'">
                        <div class="super-team-name">${teamA}</div>
                    </div>
                    <div class="super-center-trophy">
                        <img src="${getTrophyImage(realSuperCupName, null)}" onerror="this.onerror=null; this.src='trophies/default_trophy.png';">
                        <div class="super-score-box">${sA} : ${sB}</div>
                    </div>
                    <div class="super-team-box">
                        <img src="${getTeamLogoUrl(teamB)}" onerror="this.src='leagues_logos/default_league.png'">
                        <div class="super-team-name">${teamB}</div>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            renderLeagueTable();
        };
    </script>
</body>
</html>.
