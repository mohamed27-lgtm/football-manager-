name: football_manager
description: لعبة مدرب كرة القدم - Flutter
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  http: ^1.2.0
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  archive: ^3.6.1
  crypto: ^3.0.3
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/leagues/
    - assets/coaches.json
    - assets/coach_pool.json
    - assets/logos/
    - assets/competitions/
    - assets/trophies/
    - assets/brand/
