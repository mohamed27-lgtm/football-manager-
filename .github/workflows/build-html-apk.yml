name: Build HTML APK (Capacitor)

on:
  push:
    branches: [main, master]
    paths:
      - 'web_game/**'
      - '.github/workflows/build-html-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and vendor libs (offline)
        working-directory: web_game
        shell: bash
        run: |
          mkdir -p ../logs
          npm install --no-audit --no-fund 2>&1 | tail -5
          mkdir -p www/vendor/fa
          cp node_modules/papaparse/papaparse.min.js www/vendor/
          cp -r node_modules/@fortawesome/fontawesome-free/css www/vendor/fa/
          cp -r node_modules/@fortawesome/fontawesome-free/webfonts www/vendor/fa/
          sed -i -E 's#https://cdnjs\.cloudflare\.com/ajax/libs/font-awesome/[^"]*all\.min\.css#vendor/fa/css/all.min.css#g; s#https://cdnjs\.cloudflare\.com/ajax/libs/PapaParse/[^"]*papaparse\.min\.js#vendor/papaparse.min.js#g' www/*.html
          grep -c "cdnjs" www/*.html | grep -v ":0" || echo "no cdn refs left"

      - name: Add Android platform and sync
        id: sync
        working-directory: web_game
        shell: bash
        run: |
          npx cap add android 2>&1 | tail -5
          npx cap sync android 2>&1 | tail -8
          # عرض ملء الشاشة بدون حافة + سماح بالإنترنت
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || echo "internet permission missing"

      - name: Build debug APK
        id: build
        working-directory: web_game/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../../logs/build_full.log | tail -30
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../football_club_president.apk
          ls -la ../../football_club_president.apk

      - name: Publish APK to release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            gh release view apk-html >/dev/null 2>&1 || \
              gh release create apk-html --title "Football Club President (HTML)" --notes "Auto-built Capacitor APK (debug-signed, for testing)"
            gh release upload apk-html football_club_president.apk --clobber
            gh release view apk-html --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring))'
          } 2>&1 | tee logs/publish.txt

      - name: Save logs to ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p logs
          tail -n 400 logs/build_full.log > logs/build_tail.log 2>/dev/null || true
          rm -f logs/build_full.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f logs
          git commit -m "ci logs for ${GITHUB_SHA::7}: html build ${{ steps.build.outcome }}, publish ${{ steps.publish.outcome }}"
          git push -f origin HEAD:ci-logs
