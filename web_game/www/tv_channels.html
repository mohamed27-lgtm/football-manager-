<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="common.js"></script>
<script src="realism.js"></script><script src="core.js"></script>
    <script>
        // نفس آلية تطبيق المظهر الفوري المستخدمة عبر بقية اللعبة — يمنع وميض المظهر الخاطئ عند التحميل
        (function() { const t = localStorage.getItem('appTheme'); if (t === 'light') document.documentElement.setAttribute('data-theme','light'); })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>البث التلفزيوني | Football Manager World</title>
    <script src="indexeddb.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg:#0a0e17; --card:#141b2d; --border:#232d42; --text:#f1f5f9; --muted:#8b96ab; --gold:#e8b84b; --green:#22c55e; --red:#ef4444; }
        html[data-theme="light"] {
            --bg: #f4f5f9;
            --card: #ffffff;
            --border: #e2e5ec;
            --text: #151a24;
            --muted: #6b7385;
            --gold: #b8862f;
            --green: #16a34a;
            --red: #dc2626;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; user-select:none; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--text); padding:12px; display:flex; flex-direction:column; gap:12px; min-height:100vh; }

        .page-header { display:flex; align-items:center; justify-content:space-between; background:var(--card); padding:10px 12px; border-radius:12px; border:1px solid var(--border); }
        .back-btn { background:var(--border); color:white; border:none; padding:8px 12px; font-size:12px; border-radius:8px; text-decoration:none; }
        .page-title { font-size:14px; font-weight:800; color:var(--gold); }

        .broadcaster-hero {
            border-radius:16px; overflow:hidden; padding:22px 16px; text-align:center;
            background:linear-gradient(135deg, #1a1030, #0d0620);
            border:1px solid var(--border); position:relative;
        }
        .broadcaster-hero::before {
            content:''; position:absolute; inset:0;
            background: repeating-linear-gradient(90deg, rgba(232,184,75,0.04) 0 2px, transparent 2px 30px);
        }
        .broadcaster-hero .logo-box {
            width:64px; height:64px; border-radius:16px; background:rgba(232,184,75,0.12); border:2px solid var(--gold);
            display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--gold); margin:0 auto 10px auto; position:relative;
        }
        .broadcaster-hero .bname { font-size:16px; font-weight:800; position:relative; }
        .broadcaster-hero .bsub { font-size:11px; color:var(--muted); margin-top:4px; position:relative; }
        .broadcaster-hero .deal-value { font-size:24px; font-weight:900; color:var(--gold); margin-top:12px; position:relative; }
        .broadcaster-hero .deal-lbl { font-size:10px; color:var(--muted); position:relative; }

        .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
        .card-title { font-size:12px; font-weight:800; color:var(--gold); padding:12px 14px 8px 14px; display:flex; align-items:center; gap:6px; }
        .btn-outline2 { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:9px; font-size:11px; font-weight:700; cursor:pointer; }
        .factor-row { border-bottom:1px solid var(--border); }
        .factor-row:last-child { border-bottom:none; }
        .empty-state { text-align:center; padding:26px 16px; color:var(--muted); font-size:12.5px; line-height:1.8; }

        .broadcast-row { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border); }
        .broadcast-row:last-child { border-bottom:none; }
        .broadcast-row .live-badge { background:rgba(239,68,68,0.15); color:var(--red); font-size:9px; font-weight:800; padding:3px 8px; border-radius:999px; display:flex; align-items:center; gap:4px; flex:0 0 auto; }
        .broadcast-row .live-dot { width:5px; height:5px; border-radius:50%; background:var(--red); }
        .broadcast-row .info { flex:1; }
        .broadcast-row .mname { font-size:12.5px; font-weight:700; }
        .broadcast-row .msub { font-size:10.5px; color:var(--muted); margin-top:2px; }
        .broadcast-row .viewers { text-align:left; }
        .broadcast-row .viewers .num { font-size:13px; font-weight:800; color:var(--gold); }
        .broadcast-row .viewers .lbl { font-size:9px; color:var(--muted); }

        .report-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:10px 14px 14px 14px; }
        .report-box { background:var(--bg); border-radius:10px; padding:10px; }
        .report-box .lbl { font-size:10px; color:var(--muted); }
        .report-box .val { font-size:15px; font-weight:800; margin-top:3px; color:var(--gold); }
    </style>
</head>
<body>

    <div class="page-header">
        <a href="finance.html" class="back-btn"><i class="fas fa-arrow-right"></i></a>
        <div class="page-title">📺 البث التلفزيوني</div>
        <div style="width:34px;"></div>
    </div>

    <div class="broadcaster-hero" id="broadcasterHero"></div>

    <div class="card">
        <div class="card-title"><i class="fas fa-chart-line"></i> تقرير حقوق البث</div>
        <div class="report-grid" id="reportGrid"></div>
    </div>

    <div class="card">
        <div class="card-title"><i class="fas fa-tv"></i> جدول المباريات المذاعة</div>
        <div id="scheduleContainer"></div>
    </div>

    <div class="card">
        <div class="card-title"><i class="fas fa-satellite"></i> قناة النادي والمنصة الرقمية</div>
        <div id="channelBox" style="padding:4px 14px 14px 14px;"></div>
    </div>

    <div id="toast" style="position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--gold); color:var(--text); padding:10px 16px; border-radius:10px; font-size:12px; display:none; z-index:99; max-width:90%; text-align:center;"></div>

    <script>
        const activeClub = localStorage.getItem('presidentialClub') || '';
        const homeCountry = localStorage.getItem('homeCountry') || 'Saudi Arabia';
        function seedHash(str) { let h=0; const s=String(str); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
        function getClubBudget() { return parseFloat(localStorage.getItem('clubBudget')) || 150.0; }
        function setClubBudget(v) { localStorage.setItem('clubBudget', v.toFixed(2)); }
        function getClubReputation() { return parseFloat(localStorage.getItem('clubReputation')) || 50; }
        function fedGetRules() { return JSON.parse(localStorage.getItem('federationRules')) || { tier:1, tierLabel:'الدرجة الأولى' }; }
        function getGameDate() { return { day: parseInt(localStorage.getItem('game_day'))||1, month: parseInt(localStorage.getItem('game_month'))||9, year: parseInt(localStorage.getItem('game_year'))||2026 }; }
        function dateLabel(d) { return `${String(d.day).padStart(2,'0')}/${String(d.month).padStart(2,'0')}/${d.year}`; }
        function dateSortKey(d) { return d.year*10000+d.month*100+d.day; }
        function addDaysToDate(base, days) {
            let d = { ...base };
            for (let i=0;i<days;i++){
                d.day++; let dim=30;
                if ([1,3,5,7,8,10,12].includes(d.month)) dim=31;
                else if (d.month===2) dim=(d.year%4===0)?29:28;
                if (d.day>dim){ d.day=1; d.month++; }
                if (d.month>12){ d.month=1; d.year++; }
            }
            return d;
        }
        const realLogosPath = 'teams_logos/';
        function getTeamLogoUrl(t) { return `${realLogosPath}${(t||'').trim()}.png`; }
        function addMessageToSystem(sender, text, category) {
            let inbox = JSON.parse(localStorage.getItem('gameInbox')) || [];
            inbox.unshift({ id: Date.now(), sender, text, time: new Date().toLocaleTimeString('en-US', { hour12:false }), read:false, category: category || 'finance' });
            localStorage.setItem('gameInbox', JSON.stringify(inbox));
            localStorage.setItem('hasNewMessage', 'true');
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3200);
        }

        // ============================================================
        // الجهة الحقيقية الفعلية الناقلة لدوري كل دولة (تغطية إعلامية حقيقية معروفة)
        // ============================================================
        const REAL_BROADCASTERS = {
            'Saudi Arabia': { name:'SSC — Saudi Sports Company', country:'السعودية' },
            'Egypt': { name:'ON Time Sports', country:'مصر' },
            'Morocco': { name:'Arryadia (الرياضية المغربية)', country:'المغرب' },
            'Spain': { name:'Movistar Plus+', country:'إسبانيا' },
            'England': { name:'Sky Sports', country:'إنجلترا' },
            'France': { name:'beIN Sports France', country:'فرنسا' },
            'Italy': { name:'DAZN Italia', country:'إيطاليا' },
            'Germany': { name:'Sky Deutschland', country:'ألمانيا' },
            'Brazil': { name:'Grupo Globo / Premiere', country:'البرازيل' },
            'Netherlands': { name:'ESPN Nederland', country:'هولندا' },
            'Turkiye': { name:'beIN Sports Turkey', country:'تركيا' },
            'Russia': { name:'Match TV', country:'روسيا' },
            'Switzerland': { name:'Blue Sport', country:'سويسرا' },
            'Ireland': { name:'Premier Sports Ireland', country:'إيرلندا' },
            'Wales': { name:'Sky Sports', country:'ويلز' },
            'Ukraine': { name:'Setanta Sports Ukraine', country:'أوكرانيا' },
            'UAE': { name:'Dubai Sports / beIN Sports', country:'الإمارات' },
            'Belgium': { name:'Eleven Sports Belgium', country:'بلجيكا' },
            'Austria': { name:'Sky Sport Austria', country:'النمسا' },
            'Portugal': { name:'Sport TV', country:'البرتغال' },
            'Japan': { name:'DAZN Japan', country:'اليابان' },
            'Norway': { name:'TV 2 Sumo', country:'النرويج' }
        };
        // إن وقّع النادي فعلياً عقد راعٍ إعلامي حقيقي من sponsors.html، فهو الناقل الفعلي — وليس افتراضاً عاماً
        // ============================================================
        // قوة العقد التلفزيوني الحقيقية لكل دوري — تعكس فعلياً حجم صفقات البث الواقعية
        // (الدوري الإنجليزي أعلى بكثير من دوريات أصغر، تماماً كالواقع)
        // ============================================================
        const LEAGUE_TV_STRENGTH = {
            'England': 1.0, 'Spain': 0.75, 'Germany': 0.65, 'Italy': 0.62, 'France': 0.55,
            'Saudi Arabia': 0.5, 'Brazil': 0.45, 'Turkiye': 0.3, 'Netherlands': 0.28, 'Portugal': 0.27,
            'Russia': 0.22, 'Belgium': 0.18, 'UAE': 0.16, 'Austria': 0.14, 'Switzerland': 0.14,
            'Egypt': 0.13, 'Morocco': 0.11, 'Ukraine': 0.1, 'Japan': 0.2, 'Norway': 0.1, 'Ireland': 0.08, 'Wales': 0.07
        };
        function getLeagueTvStrength() { return LEAGUE_TV_STRENGTH[homeCountry] || 0.1; }

        // ============================================================
        // مكافأة بث قارية حقيقية — فقط إن كان ناديك مؤهلاً فعلياً (نفس منطق التحقق من continental_competitions.html)
        // ============================================================
        function calculateCurrentStanding() {
            let teams = [];
            try {
                const stored = localStorage.getItem('current_league_teams');
                if (stored) teams = JSON.parse(stored).filter(t => t !== 'إستراحة' && t.trim() !== '');
            } catch(e) {}
            if (!teams.length || !teams.includes(activeClub)) return null;
            const currentRound = parseInt(localStorage.getItem('database_current_round')) || 0;
            let standings = {};
            teams.forEach(t => { standings[t] = { name:t, pts:0, gf:0, ga:0 }; });
            let pool = [...teams];
            if (pool.length % 2 !== 0) pool.push('إستراحة');
            const total = pool.length, rounds = total-1, perRound = total/2;
            let schedule = [];
            for (let r=0;r<rounds;r++){
                let matches=[];
                for(let i=0;i<perRound;i++){
                    let home=pool[i], away=pool[total-1-i];
                    if (home==='إستراحة'||away==='إستراحة') continue;
                    if (r%2===1){ const t=home; home=away; away=t; }
                    matches.push({home,away});
                }
                schedule.push(matches); pool.splice(1,0,pool.pop());
            }
            const half = schedule.length;
            for (let r=0;r<half;r++) schedule.push(schedule[r].map(m=>({home:m.away,away:m.home})));
            let savedScores = JSON.parse(localStorage.getItem('full_season_scores')) || [];
            for (let i=0;i<currentRound;i++){
                if (!schedule[i]) break;
                schedule[i].forEach(match => {
                    let hScore, aScore;
                    if (match.home===activeClub || match.away===activeClub) {
                        let found = savedScores.find(s=>s.roundIdx===i);
                        hScore = found?found.homeScore:0; aScore = found?found.awayScore:0;
                    } else {
                        let seed = i + match.home.length + match.away.length;
                        { const _r = RLM.sim(i, match.home, match.away); hScore = _r[0]; aScore = _r[1]; }
                    }
                    let home=standings[match.home], away=standings[match.away];
                    if (home && away) {
                        home.gf+=hScore; home.ga+=aScore; away.gf+=aScore; away.ga+=hScore;
                        if (hScore>aScore) home.pts+=3; else if (hScore===aScore){ home.pts++; away.pts++; } else away.pts+=3;
                    }
                });
            }
            const sorted = Object.values(standings).sort((a,b)=>b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga));
            return { position: sorted.findIndex(t=>t.name===activeClub) + 1, total: sorted.length };
        }
        function getContinentalTvBonus() {
            const standing = calculateCurrentStanding();
            if (!standing) return 0;
            // مقعد قاري تقديري: أفضل 4-6 مراكز حسب الدرجة الأولى فقط
            const rules = fedGetRules();
            if (rules.tier !== 1) return 0;
            const continentalSlots = Math.max(2, Math.round(standing.total * 0.2));
            if (standing.position > continentalSlots) return 0;
            return Math.round((3 + getClubReputation()/100 * 12) * 10) / 10;
        }

        // ============================================================
        // مكافأة بث المباريات الودية أمام أندية عالمية مشهورة فعلياً
        // ============================================================
        const FAMOUS_CLUBS = ['Real Madrid','Barcelona','Manchester United','Manchester City','Liverpool','Chelsea FC','Arsenal','Bayern Munich','Paris Saint-Germain','Juventus','AC Milan','Inter Milan','Atletico Madrid','Borussia Dortmund','Tottenham Hotspur'];
        function getFriendlyBroadcastBonus(opponentName) {
            if (!opponentName) return 0;
            const isFamous = FAMOUS_CLUBS.some(c => opponentName.includes(c) || c.includes(opponentName));
            if (!isFamous) return 0;
            return Math.round((1 + getClubReputation()/100 * 4) * 10) / 10;
        }

        // ============================================================
        // قناة النادي / المنصة الرقمية — استثمار حقيقي بقرار من الرئيس، بدخل شهري متكرر بعد ذلك
        // ============================================================
        function getChannelLevel() { return parseInt(localStorage.getItem('clubChannelLevel_' + activeClub)) || 0; }
        function launchChannel(type) {
            const cost = type === 'channel' ? 8 : 3; // تكلفة إطلاق تقديرية بالمليون يورو
            if (cost > getClubBudget()) { showToast('الميزانية لا تكفي لإطلاق هذا المشروع!'); return; }
            setClubBudget(getClubBudget() - cost);
            localStorage.setItem('clubChannelType_' + activeClub, type);
            localStorage.setItem('clubChannelLevel_' + activeClub, '1');
            const label = type === 'channel' ? 'قناة النادي الرسمية' : 'المنصة الرقمية للنادي';
            addMessageToSystem('الإدارة الإعلامية', `📡 تم إطلاق ${label} بتكلفة ${cost}M € — ستولّد دخلاً شهرياً متكرراً من الاشتراكات والإعلانات.`, 'finance');
            showToast(`✅ تم إطلاق ${label}`);
            renderChannelBox();
        }
        function getChannelMonthlyIncome() {
            const level = getChannelLevel();
            if (!level) return 0;
            const rep = getClubReputation();
            return Math.round((0.15 + rep/100 * 0.9) * level * 100) / 100;
        }

        function getBroadcaster() {
            const realSponsorName = localStorage.getItem('clubMediaSponsorName');
            if (realSponsorName) return { name: realSponsorName, country: null, isRealContract: true };
            return REAL_BROADCASTERS[homeCountry] || { name:'الشبكة الرياضية الوطنية', country: homeCountry };
        }

        // قيمة عقد البث: إن وُجد عقد راعٍ إعلامي حقيقي موقَّع، تُستخدم قيمته الفعلية مباشرة (مصدر واحد للحقيقة)
        // وإلا تُقدَّر من سمعة ناديك ودرجته (وليست رقماً عشوائياً)
        function getSeasonBroadcastValue() {
            const realSponsorValue = parseFloat(localStorage.getItem('clubMediaSponsorValue'));
            if (!isNaN(realSponsorValue) && realSponsorValue > 0) return realSponsorValue;
            const rep = getClubReputation();
            const rules = fedGetRules();
            const tierMult = rules.tier === 1 ? 1.0 : rules.tier === 2 ? 0.35 : 0.12;
            const leagueStrength = getLeagueTvStrength();
            const base = 3 + (rep / 100) * 90; // نطاق أوسع يعكس قوة الدوري الحقيقية
            return Math.round(base * tierMult * leagueStrength * 10) / 10;
        }

        function fmtMoney1(v) {
            const abs = Math.abs(v||0);
            if (abs >= 1000000) return (v/1000000).toFixed(2) + 'T €';
            if (abs >= 1000) return (v/1000).toFixed(2) + 'B €';
            return (v||0).toFixed(1) + 'M €';
        }

        function renderHero() {
            const b = getBroadcaster();
            const value = getSeasonBroadcastValue();
            const subLine = b.isRealContract
                ? `راعيك الإعلامي الرسمي الموقَّع فعلياً`
                : `الناقل الافتراضي لدوري ${b.country} — لم توقّع بعد عقد راعٍ إعلامي حقيقي`;
            document.getElementById('broadcasterHero').innerHTML = `
                <div class="logo-box"><i class="fas fa-satellite-dish"></i></div>
                <div class="bname">${b.name}</div>
                <div class="bsub">${subLine}</div>
                <div class="deal-value">${fmtMoney1(value)}</div>
                <div class="deal-lbl">${b.isRealContract ? 'القيمة السنوية الفعلية للعقد الموقَّع' : 'القيمة السنوية التقديرية لحصتك من عقد البث'}</div>
                ${!b.isRealContract ? `<a href="sponsors.html" style="display:inline-block;margin-top:10px;position:relative;background:var(--gold);color:#06090f;padding:7px 16px;border-radius:8px;font-size:11px;font-weight:800;text-decoration:none;">التوقيع مع راعٍ إعلامي حقيقي</a>` : ''}
            `;
        }

        function renderReport() {
            const value = getSeasonBroadcastValue();
            const hasRealContract = !!localStorage.getItem('clubMediaSponsorName');
            const round = parseInt(localStorage.getItem('database_current_round')) || 0;
            let totalRounds = 34;
            try { const t = JSON.parse(localStorage.getItem('current_league_teams')||'[]').filter(x=>x!=='إستراحة'&&x.trim()!==''); if (t.length>1) totalRounds=(t.length-1)*2; } catch(e){}
            const progress = Math.min(1, round/Math.max(1,totalRounds));
            const earnedSoFar = value * progress;

            let periodicPaid = 0;
            if (hasRealContract) {
                localStorage.setItem('broadcastIncomeTotal', '0');
            } else {
                const key = 'broadcastRevenuePaid_' + activeClub;
                const alreadyPaid = parseFloat(localStorage.getItem(key)) || 0;
                const newPayment = Math.max(0, earnedSoFar - alreadyPaid);
                if (newPayment > 0.01) {
                    setClubBudget(getClubBudget() + newPayment);
                    localStorage.setItem(key, earnedSoFar.toFixed(3));
                    localStorage.setItem('broadcastIncomeTotal', earnedSoFar.toFixed(3));
                }
                periodicPaid = newPayment;
            }

            // مكافأة قارية حقيقية — تُدفع مرة واحدة فقط لكل موسم إن تحقق التأهل فعلياً
            const contBonus = getContinentalTvBonus();
            const contKey = 'continentalTvBonusPaid_' + activeClub + '_' + round;
            if (contBonus > 0 && !localStorage.getItem(contKey)) {
                setClubBudget(getClubBudget() + contBonus);
                localStorage.setItem(contKey, '1');
                addMessageToSystem('الاتحاد القاري', `📡 مكافأة بث قارية: ${fmtMoney1(contBonus)} أُضيفت لتأهلك الحالي.`, 'finance');
            }

            // دخل قناة/منصة النادي الشهري المتكرر
            const channelIncome = getChannelMonthlyIncome();
            if (channelIncome > 0) {
                const gd = getGameDate();
                const monthKey = 'channelIncomePaid_' + activeClub + '_' + gd.year + '_' + gd.month;
                if (!localStorage.getItem(monthKey)) {
                    setClubBudget(getClubBudget() + channelIncome);
                    localStorage.setItem(monthKey, '1');
                }
            }

            document.getElementById('reportGrid').innerHTML = `
                <div class="report-box"><div class="lbl">قيمة العقد السنوي</div><div class="val">${fmtMoney1(value)}</div></div>
                <div class="report-box"><div class="lbl">${hasRealContract ? 'مصدر الدفع' : 'المستلَم حتى الآن هذا الموسم'}</div><div class="val" style="font-size:${hasRealContract?'11px':'15px'};">${hasRealContract ? 'عبر جدول عقد sponsors.html' : fmtMoney1(earnedSoFar)}</div></div>
                <div class="report-box"><div class="lbl">نسبة تقدّم الموسم</div><div class="val">${Math.round(progress*100)}%</div></div>
                <div class="report-box"><div class="lbl">تقدير نهاية الموسم</div><div class="val">${fmtMoney1(value)}</div></div>
                <div class="report-box"><div class="lbl">مكافأة البث القارية</div><div class="val">${contBonus>0 ? fmtMoney1(contBonus) : 'غير مؤهل حالياً'}</div></div>
                <div class="report-box"><div class="lbl">دخل قناة/منصة النادي الشهري</div><div class="val">${channelIncome>0 ? fmtMoney1(channelIncome) : 'غير مُفعَّلة'}</div></div>
            `;
        }

        // ============================================================
        // جدول مباريات مذاعة — حقيقي من جدولك الفعلي، مع تقدير مشاهدين محسوب من أهمية المباراة
        // ============================================================
        async function getUpcomingRealMatches() {
            const gd = getGameDate();
            let candidates = [];
            try {
                const teams = JSON.parse(localStorage.getItem('current_league_teams')||'[]').filter(t=>t!=='إستراحة'&&t.trim()!=='');
                const currentRound = parseInt(localStorage.getItem('database_current_round'))||0;
                if (teams.length > 1 && teams.includes(activeClub)) {
                    let pool = [...teams];
                    if (pool.length % 2 !== 0) pool.push('إستراحة');
                    const total = pool.length, rounds = total-1, perRound = total/2;
                    let schedule = [];
                    for (let r=0;r<rounds;r++){
                        let matches=[];
                        for(let i=0;i<perRound;i++){
                            let home=pool[i], away=pool[total-1-i];
                            if (home==='إستراحة'||away==='إستراحة') continue;
                            if (r%2===1){ const t=home; home=away; away=t; }
                            matches.push({home,away});
                        }
                        schedule.push(matches); pool.splice(1,0,pool.pop());
                    }
                    const half = schedule.length;
                    for (let r=0;r<half;r++) schedule.push(schedule[r].map(m=>({home:m.away,away:m.home})));
                    const seasonStartYear = (gd.month>=8) ? gd.year : gd.year-1;
                    const seasonStart = { day:15, month:8, year:seasonStartYear };
                    for (let i = currentRound; i < Math.min(schedule.length, currentRound+5); i++) {
                        const match = schedule[i].find(m => m.home===activeClub || m.away===activeClub);
                        if (match) {
                            const rd = addDaysToDate(seasonStart, i*7);
                            candidates.push({ type:'league', opponent: match.home===activeClub?match.away:match.home, venue: match.home===activeClub?'home':'away', date: rd });
                        }
                    }
                }
            } catch(e) {}
            try {
                await clubDB.init();
                const upcoming = await clubDB.getAllUpcomingMatches();
                upcoming.filter(m => m.competition === 'ودية' && (m.ownerClub===undefined || m.ownerClub===activeClub)).forEach(f => {
                    const [dd,mm,yy] = (f.date||'').split('/').map(Number);
                    if (dd) candidates.push({ type:'friendly', opponent: f.opponent, venue: f.venue, date:{day:dd,month:mm,year:yy} });
                });
            } catch(e) {}
            candidates.sort((a,b) => dateSortKey(a.date) - dateSortKey(b.date));
            return candidates.slice(0, 6);
        }

        function getSquadStarFactor() {
            try {
                const squad = JSON.parse(localStorage.getItem('signed_players_by_club')||'{}')[activeClub] || [];
                if (!squad.length) return 1.0;
                const avgRating = squad.reduce((s,p) => s + (parseFloat(p.rating)||60), 0) / squad.length;
                const topRating = Math.max(...squad.map(p => parseFloat(p.rating)||60));
                // نجم عالمي واحد (تقييم عالٍ جداً) يرفع نسب المشاهدة فعلياً حتى لو باقي الفريق متوسطاً
                return 0.7 + (avgRating/99)*0.5 + Math.max(0, (topRating-85))*0.02;
            } catch(e) { return 1.0; }
        }

        function renderSchedule(matches) {
            const el = document.getElementById('scheduleContainer');
            if (!matches.length) { el.innerHTML = `<div class="empty-state"><i class="fas fa-tv"></i>لا توجد مباريات قادمة مجدولة للبث حالياً.</div>`; return; }
            const rep = getClubReputation();
            const b = getBroadcaster();
            const gd = getGameDate();
            const todaySort = dateSortKey(gd);
            const leagueStrength = getLeagueTvStrength();
            const starFactor = getSquadStarFactor();
            el.innerHTML = matches.map(m => {
                const seed = seedHash(activeClub + m.opponent + dateSortKey(m.date));
                // قاعدة واقعية فعلية: أقصى جمهور تلفزيوني ممكن لدوري بحجم الدوري الإنجليزي ~2.2 مليون مشاهد للمباراة الواحدة،
                // وتُقاس بقية الدوريات نسبياً منه حسب قوتها الإعلامية الحقيقية (leagueStrength)
                const leagueMaxAudience = 2200000 * leagueStrength;
                const fameFactor = 0.25 + (rep/100) * 1.1; // شهرة ناديك تحدد أي نسبة من الحد الأقصى تحصل عليها فعلياً
                const matchTypeFactor = m.type === 'league' ? 1.0 : 0.3; // الودية أقل جذباً إعلامياً من الرسمية دائماً
                const friendlyBonus = m.type === 'friendly' ? getFriendlyBroadcastBonus(m.opponent) : 0;
                const famousOpponentFactor = friendlyBonus > 0 ? 4.5 : 1.0; // مباراة أمام ناد عالمي تكسر قاعدة "الودية الأقل" تماماً كالواقع
                const variance = 0.85 + (seed % 30) / 100; // تفاوت طبيعي بين مباراة وأخرى، ثابت لكل مباراة وليس متغيراً عشوائياً بلا سبب
                const viewers = Math.round(leagueMaxAudience * fameFactor * matchTypeFactor * famousOpponentFactor * starFactor * variance);
                const isNext = matches.indexOf(m) === 0;

                // مكافأة بث حقيقية لمباراة ودية أمام ناد عالمي مشهور — تُدفع مرة واحدة عند وصول تاريخها فعلياً
                if (friendlyBonus > 0) {
                    const payKey = 'friendlyTvBonusPaid_' + activeClub + '_' + dateSortKey(m.date);
                    if (todaySort >= dateSortKey(m.date) && !localStorage.getItem(payKey)) {
                        setClubBudget(getClubBudget() + friendlyBonus);
                        localStorage.setItem(payKey, '1');
                        addMessageToSystem('شبكة رياضية عالمية', `📡 اشترت شبكة عالمية حقوق بث مباراتكم أمام ${m.opponent} مقابل ${fmtMoney1(friendlyBonus)}.`, 'finance');
                    }
                }

                return `
                <div class="broadcast-row">
                    <img src="${getTeamLogoUrl(m.opponent)}" onerror="this.style.display='none';" style="width:26px;height:26px;object-fit:contain;">
                    <div class="info">
                        <div class="mname">${activeClub} ${m.venue==='home'?'ضد':'خارج أرضه ضد'} ${m.opponent}</div>
                        <div class="msub">${dateLabel(m.date)} · ${m.type==='league'?'الدوري المحلي':'ودية'} · ${b.name}${friendlyBonus>0?' · 🌍 اهتمام إعلامي عالمي':''}</div>
                    </div>
                    ${isNext && dateSortKey(m.date) <= dateSortKey(gd) + 2 ? `<div class="live-badge"><span class="live-dot"></span>قريباً</div>` : ''}
                    <div class="viewers"><div class="num">${viewers >= 1000000 ? (viewers/1000000).toFixed(2)+'M' : (viewers/1000).toFixed(0)+'K'}</div><div class="lbl">مشاهد متوقَّع</div></div>
                </div>`;
            }).join('');
        }

        function renderChannelBox() {
            const level = getChannelLevel();
            const el = document.getElementById('channelBox');
            if (level > 0) {
                const type = localStorage.getItem('clubChannelType_' + activeClub);
                const label = type === 'channel' ? 'قناة النادي الرسمية' : 'المنصة الرقمية للنادي';
                el.innerHTML = `<div class="factor-row" style="display:flex; justify-content:space-between; font-size:11.5px; padding:8px 0;"><span>✅ ${label} نشطة</span><b style="color:var(--gold);">${fmtMoney1(getChannelMonthlyIncome())}/شهر</b></div>`;
            } else {
                el.innerHTML = `
                    <div style="font-size:11px; color:var(--muted); margin-bottom:8px;">استثمار حقيقي يُنشئ دخلاً شهرياً متكرراً من الاشتراكات والإعلانات (بث التدريبات، المؤتمرات، مقابلات اللاعبين، مباريات الشباب).</div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-outline2" onclick="launchChannel('channel')">إطلاق قناة رسمية (8M €)</button>
                        <button class="btn-outline2" onclick="launchChannel('platform')">منصة رقمية (3M €)</button>
                    </div>`;
            }
        }

        window.onload = async function() {
            renderHero();
            renderReport();
            renderChannelBox();
            const matches = await getUpcomingRealMatches();
            renderSchedule(matches);
        };
    </script>
</body>
</html>
