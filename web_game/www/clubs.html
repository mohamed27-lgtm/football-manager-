<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="common.js"></script>
<script src="realism.js"></script><script src="core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title> Football club president- القائمة الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* الخلفية الخاصة بك bg.png */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .header {
            margin-top: 80px; /* زيادة المسافة العلوية لتعويض غياب زر الخروج */
            text-align: center;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: -12px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .header h2 {
            font-size: 3.2rem;
            font-weight: 900;
            color: #74b9ff;
            letter-spacing: 4px;
            text-shadow: 2px 2px 15px rgba(116, 185, 255, 0.4);
        }

        .menu-container {
            width: 92%;
            max-width: 450px;
            margin-top: auto;
            margin-bottom: 80px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 20px 22px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
        }

        .menu-item:hover {
            background: rgba(116, 185, 255, 0.15);
            transform: translateY(-3px);
            border-color: #74b9ff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .icon-box {
            width: 54px;
            height: 54px;
            background: rgba(116, 185, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 18px;
        }

        .icon-box i {
            font-size: 1.4rem;
            color: #74b9ff;
        }

        .text-box { flex-grow: 1; }

        .text-box .title {
            font-size: 1.3rem;
            font-weight: 800;
            display: block;
            margin-bottom: 2px;
        }

        .text-box .subtitle {
            font-size: 0.9rem;
            color: #d1d5db;
        }

        .footer-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 25px;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FOOTBALL</h1>
        <h2>CLUB</h2>
        <h3>PRESIDENT</h3>
     </div>

    <div class="menu-container">
        
        <a href="game_main.html" class="menu-item">
            <div class="icon-box">
                <i class="fas fa-play"></i>
            </div>
            <div class="text-box">
                <span class="title">إكمال المسيرة</span>
                <span class="subtitle">مواصلة إدارة ناديك</span>
            </div>
        </a>

        <a href="choose_club.html" class="menu-item">
            <div class="icon-box">
                <i class="fas fa-plus"></i>
            </div>
            <div class="text-box">
                <span class="title">لعبة جديدة</span>
                <span class="subtitle">تأسيس حقبة إدارية جديدة</span>
            </div>
        </a>

        <a href="settings.html" class="menu-item">
            <div class="icon-box">
                <i class="fas fa-cog"></i>
            </div>
            <div class="text-box">
                <span class="title">الإعدادات</span>
                <span class="subtitle">تعديل تجربة اللعبة</span>
            </div>
        </a>
        
    </div>

    <div class="footer-text">
        SEASON 2026 EDITION
    </div>

    <script>
        // التأكد من تسجيل الدخول لحماية الصفحة
        window.onload = function() {
            // لا يوجد نظام حسابات في هذه النسخة: نعتبر اللاعب مسجّلاً دائماً (منع حلقة إعادة توجيه لا نهائية)
            try { if (!localStorage.getItem('currentUser')) localStorage.setItem('currentUser', 'coach'); } catch (e) {}
            // «إكمال المسيرة» بدون مسيرة محفوظة => ابدأ لعبة جديدة بدل فتح نادٍ افتراضي
            var cont = document.querySelector('a[href="game_main.html"]');
            if (cont) cont.addEventListener('click', function (ev) {
                try { if (!localStorage.getItem('presidentialClub')) { ev.preventDefault(); window.location.href = 'choose_club.html'; } } catch (e) {}
            });
        };
    </script>
</body>
</html>
