<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="common.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>التدريب | Football Manager World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg:#0a0e17; --card:#141b2d; --border:#232d42; --text:#f1f5f9; --muted:#8b96ab; --gold:#e8b84b; --green:#22c55e; --red:#ef4444; --blue:#3b82f6; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; user-select:none; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--text); padding:12px; display:flex; flex-direction:column; gap:12px; min-height:100vh; }

        .page-header { display:flex; align-items:center; justify-content:space-between; background:var(--card); padding:10px 12px; border-radius:12px; border:1px solid var(--border); }
        .back-btn { background:var(--border); color:white; border:none; padding:8px 12px; font-size:12px; border-radius:8px; text-decoration:none; }
        .page-title { font-size:14px; font-weight:800; color:var(--gold); display:flex; align-items:center; gap:6px; }

        .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
        .card-title { font-size:12px; font-weight:800; color:var(--gold); padding:12px 14px 8px 14px; display:flex; align-items:center; gap:6px; }
        .empty-state { text-align:center; padding:22px 16px; color:var(--muted); font-size:12px; line-height:1.8; }

        .indicator-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:10px 14px 14px 14px; }
        .indicator-box { background:var(--bg); border-radius:10px; padding:10px; }
        .indicator-box .lbl { font-size:10px; color:var(--muted); display:flex; justify-content:space-between; }
        .indicator-box .val { font-size:15px; font-weight:800; margin-top:4px; }
        .ibar { height:5px; background:var(--border); border-radius:3px; overflow:hidden; margin-top:6px; }
        .ibar-fill { height:100%; }

        .weekly-row { display:flex; justify-content:space-between; align-items:center; padding:9px 14px; border-bottom:1px solid var(--border); font-size:11.5px; }
        .weekly-row:last-child { border-bottom:none; }
        .weekly-row span:first-child { color:var(--muted); }
        .weekly-row b { color:var(--text); }

        .chip-row { display:flex; gap:6px; padding:10px 14px; flex-wrap:wrap; }
        .chip { flex:1; min-width:75px; text-align:center; padding:9px 4px; border-radius:9px; background:var(--bg); border:1px solid var(--border); font-size:10.5px; font-weight:700; color:var(--muted); cursor:pointer; }
        .chip.active { background:var(--gold); color:#06090f; border-color:var(--gold); }
        .chip-desc { padding:0 14px 12px 14px; font-size:10px; color:var(--muted); line-height:1.7; }

        .decision-btn { width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:11px; border-radius:10px; font-size:11.5px; font-weight:700; cursor:pointer; margin:6px 14px; width:calc(100% - 28px); text-align:right; display:flex; align-items:center; gap:8px; }
        .decision-btn i { color:var(--gold); }
        .decision-btn:last-of-type { margin-bottom:14px; }

        .facility-row { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); }
        .facility-row:last-child { border-bottom:none; }
        .facility-row .fname { flex:1; font-size:11.5px; font-weight:700; }
        .facility-row .fbar { flex:1; height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin:0 8px; }
        .facility-row .fval { font-size:10.5px; color:var(--gold); font-weight:700; min-width:30px; text-align:left; }
        .btn-upgrade { background:var(--gold); color:#06090f; border:none; padding:6px 12px; border-radius:7px; font-size:9.5px; font-weight:800; cursor:pointer; }

        .report-line { display:flex; justify-content:space-between; align-items:center; padding:8px 14px; border-bottom:1px solid var(--border); font-size:11.5px; }
        .report-line:last-child { border-bottom:none; }

        .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--gold); color:var(--text); padding:10px 16px; border-radius:10px; font-size:12px; display:none; z-index:99; max-width:90%; text-align:center; }
    </style>
</head>
<body>

    <div class="page-header">
        <a href="game_main.html" class="back-btn"><i class="fas fa-arrow-right"></i></a>
        <div class="page-title"><i class="fas fa-dumbbell"></i> التدريب</div>
        <div style="width:34px;"></div>
    </div>

    <!-- 1) نظرة عامة على حالة التدريب -->
    <div class="card">
        <div class="card-title"><i class="fas fa-gauge-high"></i> حالة التدريب</div>
        <div class="indicator-grid" id="indicatorsGrid"></div>
    </div>

    <!-- 2) البرنامج الحالي والجدول الأسبوعي العام -->
    <div class="card">
        <div class="card-title"><i class="fas fa-calendar-week"></i> البرنامج الحالي — هذا الأسبوع</div>
        <div id="weeklyContainer"></div>
    </div>

    <!-- 3) أهداف التدريب -->
    <div class="card">
        <div class="card-title"><i class="fas fa-bullseye"></i> أهداف التدريب المعتمدة</div>
        <div class="chip-row" id="goalRow"></div>
        <div class="chip-desc" id="goalDesc"></div>
    </div>

    <!-- 4) شدة البرنامج -->
    <div class="card">
        <div class="card-title"><i class="fas fa-fire"></i> شدة البرنامج العامة</div>
        <div class="chip-row" id="intensityRow"></div>
        <div class="chip-desc" id="intensityDesc"></div>
    </div>

    <!-- 5) فلسفة التدريب -->
    <div class="card">
        <div class="card-title"><i class="fas fa-compass"></i> فلسفة التدريب العامة</div>
        <div class="chip-row" id="philosophyRow"></div>
        <div class="chip-desc" id="philosophyDesc"></div>
    </div>

    <!-- 6) قرارات الرئيس -->
    <div class="card">
        <div class="card-title"><i class="fas fa-gavel"></i> قرارات الرئيس</div>
        <button class="decision-btn" onclick="requestProgramReview()"><i class="fas fa-magnifying-glass-chart"></i> طلب مراجعة البرنامج من المدرب</button>
        <button class="decision-btn" onclick="adjustGeneralLevel(1)"><i class="fas fa-arrow-up"></i> رفع مستوى التدريب العام</button>
        <button class="decision-btn" onclick="adjustGeneralLevel(-1)"><i class="fas fa-arrow-down"></i> خفض مستوى التدريب العام</button>
    </div>

    <!-- 7) منشآت ومعدات التدريب -->
    <div class="card">
        <div class="card-title"><i class="fas fa-building-columns"></i> منشآت ومعدات التدريب</div>
        <div id="facilitiesContainer"></div>
    </div>

    <!-- 8) تقرير التدريب -->
    <div class="card">
        <div class="card-title"><i class="fas fa-file-lines"></i> تقرير التدريب — آخر 30 يوماً</div>
        <div id="reportContainer"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const activeClub = localStorage.getItem('presidentialClub') || '';
        function showToast(msg) { const t=document.getElementById('toast'); t.innerText=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 3000); }
        function seedHash(str) { let h=0; const s=String(str); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
        function getGameDate() { return { day: parseInt(localStorage.getItem('game_day'))||1, month: parseInt(localStorage.getItem('game_month'))||9, year: parseInt(localStorage.getItem('game_year'))||2026 }; }
        function dateSortKey(d) { return d.year*10000+d.month*100+d.day; }
        function addMessageToSystem(sender, text, category) {
            let inbox = JSON.parse(localStorage.getItem('gameInbox')) || [];
            inbox.unshift({ id: Date.now(), sender, text, time: new Date().toLocaleTimeString('en-US', { hour12:false }), read:false, category: category || 'system' });
            localStorage.setItem('gameInbox', JSON.stringify(inbox));
            localStorage.setItem('hasNewMessage', 'true');
        }
        function getSquad() { return (JSON.parse(localStorage.getItem('signed_players_by_club'))||{})[activeClub] || []; }
        function saveSquad(squad) {
            const all = JSON.parse(localStorage.getItem('signed_players_by_club')) || {};
            all[activeClub] = squad;
            localStorage.setItem('signed_players_by_club', JSON.stringify(all));
        }
        function getClubBudget() { return parseFloat(localStorage.getItem('clubBudget')) || 0; }
        function setClubBudget(v) { localStorage.setItem('clubBudget', v.toFixed(2)); }

        // ============================================================
        // جودة الجهاز الفني — تُستهلَك هنا كعامل خارجي جاهز من staff.html (مصدر الحقيقة الوحيد)
        // هذه الصفحة لا تُدير الطاقم ولا تُعيد حساب جودته بنفسها إطلاقاً
        // ============================================================
        function getStaffQualityFactor() {
            const exported = localStorage.getItem('coachingQualityFactor_' + activeClub);
            return exported !== null ? parseFloat(exported) : 0.55; // قيمة احتياطية محايدة فقط إن لم تُفتح staff.html بعد هذا الموسم
        }

        // ============================================================
        // ميزانية المنشآت (نفس pool_facilities الحقيقي من budget_office.html) — لا ميزانية تدريب منفصلة مُختلقة
        // ============================================================
        function getFacilitiesPool() { return parseFloat(localStorage.getItem(`pool_facilities_${activeClub}`)) || 0; }

        // ============================================================
        // مستوى التدريب العام — قرار رئاسي واحد بسيط (رفع/خفض)، وليس أزرار عشوائية متعددة
        // ============================================================
        function getGeneralLevel() { return parseInt(localStorage.getItem(`trainingGeneralLevel_${activeClub}`)) ?? 3; } // 1-5
        function setGeneralLevel(v) { localStorage.setItem(`trainingGeneralLevel_${activeClub}`, String(Math.max(1, Math.min(5, v)))); }
        function adjustGeneralLevel(delta) {
            const cur = getGeneralLevel();
            const next = Math.max(1, Math.min(5, cur + delta));
            if (next === cur) { showToast(delta>0 ? 'المستوى في أعلى درجاته بالفعل.' : 'المستوى في أدنى درجاته بالفعل.'); return; }
            setGeneralLevel(next);
            addMessageToSystem('الجهاز الفني', `📋 تم ${delta>0?'رفع':'خفض'} مستوى التدريب العام بقرار رئاسي إلى الدرجة ${next}/5.`, 'system');
            showToast(`✅ تم ${delta>0?'رفع':'خفض'} المستوى العام`);
            renderIndicators();
            renderWeekly();
        }

        // ============================================================
        // أهداف التدريب — قرار عام واحد يعتمده الرئيس، يوجّه الجهاز الفني بلا تدخل بالتفاصيل
        // ============================================================
        const TRAINING_GOALS = {
            development: { label:'تطوير اللاعبين', desc:'التركيز على رفع إمكانيات اللاعبين الشباب تحديداً — نمو أبطأ للفريق الأول حالياً مقابل مستقبل أفضل.' },
            readiness:   { label:'رفع الجاهزية', desc:'التركيز على تجهيز الفريق الأول للمباريات القادمة مباشرة.' },
            maintain:    { label:'الحفاظ على المستوى', desc:'برنامج متوازن يمنع التراجع دون مخاطرة إضافية — مناسب في منتصف موسم مزدحم.' },
            firstteam:   { label:'تطوير الفريق الأول', desc:'أولوية قصوى لرفع مستوى التشكيلة الأساسية الحالية تحديداً.' },
            youth:       { label:'رفع مستوى الشباب', desc:'ضمن نظام التدريب فقط (وليس إدارة الأكاديمية نفسها) — دفعة إضافية للاعبين الشباب في القائمة الحالية.' },
        };
        function getGoal() { return localStorage.getItem(`trainingGoal_${activeClub}`) || 'maintain'; }
        function setGoal(key) {
            localStorage.setItem(`trainingGoal_${activeClub}`, key);
            markProgramRestart();
            addMessageToSystem('الجهاز الفني', `🎯 اعتمد الرئيس هدف "${TRAINING_GOALS[key].label}" كتوجّه عام للتدريب.`, 'system');
            renderGoal(); renderIndicators(); renderWeekly();
        }
        function renderGoal() {
            const active = getGoal();
            document.getElementById('goalRow').innerHTML = Object.entries(TRAINING_GOALS).map(([k,g])=>`<div class="chip ${k===active?'active':''}" onclick="setGoal('${k}')">${g.label}</div>`).join('');
            document.getElementById('goalDesc').innerText = TRAINING_GOALS[active].desc;
        }

        // ============================================================
        // شدة البرنامج العامة — مستوى عام واحد يراه الرئيس، والمدرب من يحدد تفاصيل الحصص
        // ============================================================
        const INTENSITIES = {
            light:  { label:'خفيفة', loadScore:35, desc:'حمل تدريبي منخفض — مناسب بعد مباريات متتالية مرهقة أو لتفادي الإصابات.' },
            normal: { label:'عادية', loadScore:60, desc:'الحمل التدريبي المعتاد لمعظم فترات الموسم.' },
            high:   { label:'مكثّفة', loadScore:85, desc:'حمل تدريبي مرتفع — مناسب في فترات الإعداد، لكنه يرفع خطر الإرهاق والإصابات (تُدار تفاصيلها الطبية في صفحة الطب).' },
        };
        function getIntensity() { return localStorage.getItem(`trainingIntensity_${activeClub}`) || 'normal'; }
        function setIntensity(key) {
            localStorage.setItem(`trainingIntensity_${activeClub}`, key);
            addMessageToSystem('الجهاز الفني', `🔥 اعتمد الرئيس شدة برنامج "${INTENSITIES[key].label}".`, 'system');
            renderIntensity(); renderIndicators(); renderWeekly();
        }
        function renderIntensity() {
            const active = getIntensity();
            document.getElementById('intensityRow').innerHTML = Object.entries(INTENSITIES).map(([k,i])=>`<div class="chip ${k===active?'active':''}" onclick="setIntensity('${k}')">${i.label}</div>`).join('');
            document.getElementById('intensityDesc').innerText = INTENSITIES[active].desc;
        }

        // ============================================================
        // فلسفة التدريب العامة — توجّه شامل، والتكتيك يبقى بيد المدرب بالكامل
        // ============================================================
        const PHILOSOPHIES = {
            longterm:  { label:'تطوير طويل المدى', desc:'بناء تدريجي عبر مواسم، أولوية للأساسيات والنمو المستدام.' },
            playerdev: { label:'تطوير اللاعبين', desc:'أقصى استفادة تدريبية من كل لاعب فردياً.' },
            competitive:{ label:'الجاهزية للمنافسة', desc:'كل شيء موجَّه نحو الأداء في المباريات القادمة مباشرة.' },
            stable:    { label:'الحفاظ على المستوى', desc:'تثبيت الأداء الحالي دون مجازفات تدريبية كبيرة.' },
            intensive: { label:'تدريب مكثف', desc:'فلسفة عالية الحمل عموماً طوال الموسم.' },
            balanced:  { label:'تدريب متوازن', desc:'توازن دائم بين الحمل والراحة — الخيار الأكثر أماناً على المدى الطويل.' },
        };
        function getPhilosophy() { return localStorage.getItem(`trainingPhilosophy_${activeClub}`) || 'balanced'; }
        function setPhilosophy(key) {
            localStorage.setItem(`trainingPhilosophy_${activeClub}`, key);
            markProgramRestart();
            addMessageToSystem('الجهاز الفني', `🧭 اعتمد الرئيس فلسفة "${PHILOSOPHIES[key].label}" كتوجّه عام للنادي في التدريب. التكتيك وطريقة اللعب تبقى بيد المدرب بالكامل.`, 'system');
            renderPhilosophy(); renderIndicators();
        }
        function renderPhilosophy() {
            const active = getPhilosophy();
            document.getElementById('philosophyRow').innerHTML = Object.entries(PHILOSOPHIES).map(([k,p])=>`<div class="chip ${k===active?'active':''}" onclick="setPhilosophy('${k}')">${p.label}</div>`).join('');
            document.getElementById('philosophyDesc').innerText = PHILOSOPHIES[active].desc;
        }

        // ============================================================
        // مؤشرات حقيقية محسوبة من: جودة الجهاز الفني + المستوى العام + الشدة + استثمار المنشآت الفعلي
        // لا تدخل مباشر بالتمارين — الرئيس يرى النتيجة فقط
        // ============================================================
        function computeIndicators() {
            const staffQ = getStaffQualityFactor();
            const level = getGeneralLevel();
            const intensity = INTENSITIES[getIntensity()];
            const facilitiesPool = getFacilitiesPool();
            const facilitiesFactor = Math.min(1, 0.5 + facilitiesPool/20);

            const programQuality = Math.round(Math.min(100, (staffQ*55) + (facilitiesFactor*30) + (level*3)));
            const load = intensity.loadScore;
            // الانتظام: طاقم أفضل ومنشآت أفضل = برنامج أكثر انتظاماً واقعياً
            const consistency = Math.round(Math.min(100, 60 + staffQ*25 + facilitiesFactor*15));
            // التوافق مع جدول المباريات: كلما زاد الحمل قرب المباريات، قلّ التوافق واقعياً (تبسيط معقول)
            const matchFit = Math.round(Math.max(40, 95 - (load-50)*0.4));

            return { programQuality, load, consistency, matchFit };
        }
        function barColor(v) { return v>=75?'var(--green)':v>=50?'var(--gold)':'var(--red)'; }

        // ============================================================
        // مدة البرنامج الحالي الحقيقية — منذ آخر تغيير فعلي في الهدف أو الفلسفة، وليس رقماً وهمياً
        // ============================================================
        function getProgramStartDateSort() {
            const stored = parseInt(localStorage.getItem(`trainingProgramStart_${activeClub}`));
            if (!isNaN(stored)) return stored;
            const today = dateSortKey(getGameDate());
            localStorage.setItem(`trainingProgramStart_${activeClub}`, String(today));
            return today;
        }
        function markProgramRestart() { localStorage.setItem(`trainingProgramStart_${activeClub}`, String(dateSortKey(getGameDate()))); }
        function getProgramDurationWeeks() {
            const start = getProgramStartDateSort();
            const today = dateSortKey(getGameDate());
            return Math.max(0, Math.floor((today - start) / 7));
        }

        // ============================================================
        // محاكاة تطوّر أسبوعية حقيقية — نتيجة فعلية للصيغة المطلوبة بالضبط:
        // جودة البرنامج × العمر × قابلية التطور × دقائق اللعب × جودة المدرب × الالتزام × الحمل × الحالة الحالية × مدة البرنامج
        // النتيجة تُطبَّق فعلياً على بيانات اللاعبين الحقيقية، ثم يُلخِّصها التقرير — لا رقم عشوائي مُختلق
        // ============================================================
        function computeGrowthProbability(p, ind, staffQ, commitment, durationWeeks) {
            const age = parseFloat(p.age) || 25;
            const rating = parseFloat(p.rating) || 60;
            const potential = parseFloat(p.potential) || rating;
            const gap = potential - rating;
            if (age >= 24 || gap <= 0) return 0; // خارج نطاق التطوّر الواقعي فعلياً

            const ageFactor = age <= 19 ? 1.0 : age <= 21 ? 0.8 : 0.55; // ذروة النمو الحقيقية لدى الشباب
            const gapFactor = Math.min(1, gap / 15); // قابلية تطوّر حقيقية = المسافة المتبقية حتى السقف
            const minutesFactor = 0.5 + Math.min(1, (parseFloat(p.matches) || 0) / 20) * 0.5; // خبرة حقيقية من عدد مباريات فعلي
            const programQualityFactor = ind.programQuality / 100;
            const loadFactor = 0.6 + (ind.load / 100) * 0.5;
            const commitmentFactor = commitment / 100;
            const currentStateFactor = Math.max(0.6, 1 - (rating - 50) / 100); // كلما ارتفعت الحالة الحالية، صعُب التحسّن أكثر إحصائياً
            const durationFactor = Math.min(1.3, 0.7 + durationWeeks * 0.02); // برنامج مستمر لفترة أطول = نتيجة تراكمية حقيقية أفضل

            const weekly = 0.05 * programQualityFactor * ageFactor * gapFactor * minutesFactor * staffQ * commitmentFactor * loadFactor * currentStateFactor * durationFactor;
            return Math.max(0, Math.min(0.9, weekly));
        }
        function getGrowthLog() { try { return JSON.parse(localStorage.getItem(`trainingGrowthLog_${activeClub}`)) || []; } catch(e){ return []; } }
        function processWeeklyDevelopment() {
            const today = getGameDate();
            const todaySort = dateSortKey(today);
            const lastKey = `trainingWeekProcessed_${activeClub}`;
            const last = parseInt(localStorage.getItem(lastKey)) || 0;
            if (todaySort - last < 7) return;
            localStorage.setItem(lastKey, String(todaySort));

            const squad = getSquad();
            if (!squad.length) return;
            const ind = computeIndicators();
            const staffQ = getStaffQualityFactor();
            const commitment = Math.round(Math.min(99, 70 + staffQ * 25));
            const durationWeeks = getProgramDurationWeeks();

            let grownPlayers = [];
            squad.forEach(p => {
                const prob = computeGrowthProbability(p, ind, staffQ, commitment, durationWeeks);
                if (prob <= 0) return;
                const seed = seedHash(activeClub + p.tmid + todaySort);
                if ((seed % 1000) / 1000 < prob) {
                    const rating = parseFloat(p.rating) || 60;
                    const potential = parseFloat(p.potential) || rating;
                    p.rating = Math.min(potential, rating + 1);
                    grownPlayers.push(p.player_name || p.name);
                }
            });
            if (grownPlayers.length) saveSquad(squad);

            // تسجيل حقيقي لما حدث فعلياً هذا الأسبوع — التقرير يلخّص هذا السجل، لا يختلق رقماً
            const log = getGrowthLog();
            log.push({ dateSort: todaySort, grownCount: grownPlayers.length, names: grownPlayers });
            const cutoff = todaySort - 30;
            const trimmed = log.filter(e => e.dateSort >= cutoff);
            localStorage.setItem(`trainingGrowthLog_${activeClub}`, JSON.stringify(trimmed));

            if (grownPlayers.length) {
                addMessageToSystem('الجهاز الفني', `📈 تقرير أسبوعي: تطوّر ${grownPlayers.length} لاعباً فعلياً هذا الأسبوع نتيجة البرنامج الحالي.`, 'system');
            }
        }

        function renderIndicators() {
            const ind = computeIndicators();
            const rows = [
                { key:'programQuality', label:'جودة البرنامج', val:ind.programQuality },
                { key:'load', label:'الحمل التدريبي', val:ind.load },
                { key:'consistency', label:'انتظام التدريب', val:ind.consistency },
                { key:'matchFit', label:'توافق مع جدول المباريات', val:ind.matchFit },
            ];
            document.getElementById('indicatorsGrid').innerHTML = rows.map(r => `
                <div class="indicator-box">
                    <div class="lbl"><span>${r.label}</span><span>${r.val}/100</span></div>
                    <div class="val" style="color:${barColor(r.val)};">${r.val >= 75 ? 'ممتاز' : r.val >= 50 ? 'جيد' : 'ضعيف'}</div>
                    <div class="ibar"><div class="ibar-fill" style="width:${r.val}%; background:${barColor(r.val)};"></div></div>
                </div>
            `).join('');
        }

        // ============================================================
        // الجدول الأسبوعي العام — عرض عام فقط، والمدرب يحدد تفاصيل الحصص كما هو مطلوب بدقة
        // ============================================================
        async function getNextMatchDaysAway() {
            try {
                await clubDB.init();
                const upcoming = await clubDB.getAllUpcomingMatches();
                if (!upcoming.length) return null;
                const gd = getGameDate();
                const todayAbs = dateSortKey(gd);
                let minDays = null;
                upcoming.forEach(m => {
                    const [dd,mm,yy] = (m.date||'').split('/').map(Number);
                    if (!dd) return;
                    const diff = dateSortKey({day:dd,month:mm,year:yy}) - todayAbs;
                    if (diff >= 0 && (minDays===null || diff < minDays)) minDays = diff;
                });
                return minDays;
            } catch(e) { return null; }
        }
        function renderWeekly(nextMatchDays) {
            const intensity = INTENSITIES[getIntensity()];
            const level = getGeneralLevel();
            const trainDays = level >= 4 ? 6 : level === 3 ? 5 : 4;
            const restDays = 7 - trainDays;
            const programLabel = (nextMatchDays !== null && nextMatchDays !== undefined && nextMatchDays <= 3) ? 'تحضير مباشر للمباراة القادمة' : 'برنامج تطوير عام';
            document.getElementById('weeklyContainer').innerHTML = `
                <div class="weekly-row"><span>الحمل التدريبي</span><b>${intensity.label}</b></div>
                <div class="weekly-row"><span>عدد أيام التدريب</span><b>${trainDays} أيام</b></div>
                <div class="weekly-row"><span>أيام الراحة</span><b>${restDays} أيام</b></div>
                <div class="weekly-row"><span>المباراة القادمة</span><b>${(nextMatchDays===null||nextMatchDays===undefined) ? 'غير مجدولة حالياً' : (nextMatchDays===0?'اليوم':'بعد '+nextMatchDays+' يوم')}</b></div>
                <div class="weekly-row"><span>البرنامج الحالي</span><b>${programLabel}</b></div>
            `;
        }

        // ============================================================
        // منشآت ومعدات التدريب فقط — لا طب، لا استشفاء، تمويلها من ميزانية المنشآت الحقيقية الموجودة أصلاً
        // ============================================================
        const TRAINING_FACILITIES = [
            { key:'pitches', label:'ملاعب التدريب وجودة الأرضية', icon:'fa-mound', costRange:[0.2,0.8], daysRange:[14,42] },
            { key:'rooms', label:'غرف التدريب والاجتماعات', icon:'fa-chalkboard', costRange:[0.15,0.5], daysRange:[21,56] },
            { key:'equipment', label:'المعدات والأجهزة التدريبية', icon:'fa-dumbbell', costRange:[0.3,1.2], daysRange:[7,21] },
            { key:'analysis', label:'أنظمة تسجيل وتحليل التدريب', icon:'fa-video', costRange:[0.4,1.5], daysRange:[14,35] },
        ];
        function toAbsDay(d) { return Math.floor(new Date(d.year, d.month-1, d.day).getTime()/86400000); }
        function facilityUpgradeCost(f) {
            const seed = seedHash(activeClub + f.key + 'cost');
            const [min,max] = f.costRange;
            return Math.round((min + (seed%1000)/1000*(max-min)) * 20) / 20;
        }
        function facilityUpgradeDays(f) {
            const seed = seedHash(activeClub + f.key + 'days');
            const [min,max] = f.daysRange;
            return Math.round(min + (seed%1000)/1000*(max-min));
        }
        function getActiveFacilityProject(key) { try { return JSON.parse(localStorage.getItem(`trainFacilityProject_${activeClub}_${key}`)); } catch(e){ return null; } }
        function getFacilityCondition(key) {
            const stored = localStorage.getItem(`trainFacility_${activeClub}_${key}`);
            return stored !== null ? parseFloat(stored) : 55;
        }
        function processFacilityCompletions() {
            const todayAbs = toAbsDay(getGameDate());
            TRAINING_FACILITIES.forEach(f => {
                const project = getActiveFacilityProject(f.key);
                if (!project) return;
                if (todayAbs >= project.completionAbsDay) {
                    const cur = getFacilityCondition(f.key);
                    localStorage.setItem(`trainFacility_${activeClub}_${f.key}`, String(Math.min(100, cur + project.improvement)));
                    localStorage.removeItem(`trainFacilityProject_${activeClub}_${f.key}`);
                    addMessageToSystem('الجهاز الفني', `✅ اكتمل تطوير "${f.label}" فعلياً بعد ${project.days} يوماً من العمل.`, 'system');
                }
            });
        }
        function upgradeFacility(key) {
            const f = TRAINING_FACILITIES.find(x=>x.key===key);
            if (getActiveFacilityProject(key)) { showToast('يوجد مشروع تطوير جارٍ فعلياً لهذا المرفق — انتظر اكتماله.'); return; }
            const pool = getFacilitiesPool();
            const cost = facilityUpgradeCost(f);
            const days = facilityUpgradeDays(f);
            if (pool < cost) { showToast(`ميزانية المنشآت لا تكفي (تحتاج ${cost.toFixed(2)}M €، المتاح ${pool.toFixed(2)}M €) — طوّرها من مكتب الميزانية.`); return; }
            localStorage.setItem(`pool_facilities_${activeClub}`, (pool-cost).toFixed(2));
            const todayAbs = toAbsDay(getGameDate());
            localStorage.setItem(`trainFacilityProject_${activeClub}_${key}`, JSON.stringify({ cost, days, improvement:15, startAbsDay:todayAbs, completionAbsDay: todayAbs+days }));
            addMessageToSystem('الجهاز الفني', `🏗️ بدأ تطوير "${f.label}" فعلياً بتكلفة ${cost.toFixed(2)}M € من ميزانية المنشآت — يستغرق نحو ${days} يوماً حتى الاكتمال.`, 'system');
            showToast(`✅ بدأ التطوير — يكتمل خلال ${days} يوماً`);
            renderFacilities(); renderIndicators();
        }
        function renderFacilities() {
            const pool = getFacilitiesPool();
            const todayAbs = toAbsDay(getGameDate());
            const el = document.getElementById('facilitiesContainer');
            el.innerHTML = `<div class="report-line"><span>ميزانية المنشآت المتاحة حالياً</span><b style="color:var(--gold);">${pool.toFixed(2)}M €</b></div>` +
                TRAINING_FACILITIES.map(f => {
                    const cond = getFacilityCondition(f.key);
                    const project = getActiveFacilityProject(f.key);
                    if (project) {
                        const elapsed = Math.max(0, todayAbs - project.startAbsDay);
                        const pct = Math.min(100, Math.round((elapsed/project.days)*100));
                        const daysLeft = Math.max(0, project.completionAbsDay - todayAbs);
                        return `<div class="facility-row" style="flex-direction:column; align-items:stretch; gap:5px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div class="fname"><i class="fas ${f.icon}" style="color:var(--gold);"></i> ${f.label}</div>
                                <span style="font-size:9.5px; color:var(--gold);">قيد التطوير — ${daysLeft} يوم متبقٍ</span>
                            </div>
                            <div class="fbar"><div style="height:100%; width:${pct}%; background:var(--gold);"></div></div>
                        </div>`;
                    }
                    const cost = facilityUpgradeCost(f); const days = facilityUpgradeDays(f);
                    return `<div class="facility-row">
                        <i class="fas ${f.icon}" style="color:var(--gold);"></i>
                        <div class="fname">${f.label}</div>
                        <div class="fbar"><div style="height:100%; width:${cond}%; background:${barColor(cond)};"></div></div>
                        <div class="fval">${Math.round(cond)}%</div>
                        <button class="btn-upgrade" onclick="upgradeFacility('${f.key}')" title="${cost.toFixed(2)}M € · ${days} يوماً">تطوير</button>
                    </div>`;
                }).join('');
        }

        // ============================================================
        // قرارات الرئيس الإضافية
        // ============================================================
        function requestProgramReview() {
            addMessageToSystem('المدرب', `📋 تلقّينا طلب مراجعة البرنامج التدريبي من الرئاسة. سنعيد تقييم البرنامج الحالي ونرسل تقريراً محدَّثاً قريباً.`, 'system');
            showToast('✅ تم إرسال طلب المراجعة للمدرب');
        }

        // ============================================================
        // تقرير آخر 30 يوماً — نفس المؤشرات محسوبة بصيغة تقرير دوري
        // ============================================================
        function renderReport() {
            const ind = computeIndicators();
            const commitment = Math.round(Math.min(99, 70 + getStaffQualityFactor()*25));
            const squad = getSquad();
            const youngPlayers = squad.filter(p => (parseFloat(p.age)||25) < 24);
            const eligiblePlayers = youngPlayers.filter(p => (parseFloat(p.rating)||60) < (parseFloat(p.potential)||60));

            // نتيجة حقيقية فعلية — مجموع ما تطوّر بالفعل آخر 30 يوماً من السجل الحقيقي، وليس رقماً مُختلقاً
            const log = getGrowthLog();
            const totalGrown = log.reduce((s,e)=>s+e.grownCount, 0);
            const avgRatingBefore = squad.length ? squad.reduce((s,p)=>s+(parseFloat(p.rating)||60),0)/squad.length : 60;
            const perfChangePct = avgRatingBefore>0 ? (totalGrown / squad.length) / avgRatingBefore * 100 : 0;

            const evalLabel = ind.programQuality>=80?'ممتاز':ind.programQuality>=60?'جيد':ind.programQuality>=40?'مقبول':'ضعيف';
            document.getElementById('reportContainer').innerHTML = `
                <div class="report-line"><span>جودة البرنامج</span><b>${ind.programQuality}/100</b></div>
                <div class="report-line"><span>التزام الفريق</span><b>${commitment}%</b></div>
                <div class="report-line"><span>تطوّر فعلي محقَّق (30 يوماً)</span><b style="color:${totalGrown>0?'var(--green)':'var(--muted)'};">${totalGrown>0 ? `+${totalGrown} لاعباً تطوّروا فعلياً (${perfChangePct.toFixed(1)}%)` : 'لا تطوّر مسجَّل بعد'}</b></div>
                <div class="report-line"><span>الحمل التدريبي</span><b>${ind.load>=75?'مرتفع':ind.load>=50?'مناسب':'منخفض'}</b></div>
                <div class="report-line"><span>توافق التدريب مع المباريات</span><b>${ind.matchFit>=75?'ممتاز':ind.matchFit>=50?'جيد':'يحتاج مراجعة'}</b></div>
                <div class="report-line"><span>تقييم الجهاز الفني للبرنامج</span><b style="color:var(--gold);">${evalLabel}</b></div>
                <div class="report-line"><span>لاعبون قابلون فعلياً للتطوّر حالياً</span><b>${eligiblePlayers.length} من ${youngPlayers.length} شاباً</b></div>
            `;
        }

        window.onload = async function() {
            processFacilityCompletions();
            processWeeklyDevelopment();
            renderIndicators();
            renderGoal();
            renderIntensity();
            renderPhilosophy();
            renderFacilities();
            renderReport();
            const nextMatchDays = await getNextMatchDaysAway();
            renderWeekly(nextMatchDays);
        };
    </script>
</body>
</html>
